<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f6ef7">
<title>题库刷题 · 教育心理学 / 教育学</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f6fb;--card:#fff;--text:#101828;--sec:#667085;--line:#e8ecf4;
  --pri:#4f6ef7;--pri-l:#eef2ff;--ok:#0f9d68;--ok-l:#eafaf2;--err:#e5484d;--err-l:#fdeeee;
  --warn:#b7791f;--warn-l:#fdf6e3;--r:14px;--sh:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
html,body{height:100%}
body{font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);padding:12px 12px 92px;-webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
mark{background:#fff3b0;border-radius:3px;padding:0 1px}

/* ---------- 首页 ---------- */
.hero{padding:10px 4px 14px}
.hero h1{font-size:22px;font-weight:700;letter-spacing:.3px}
.hero p{color:var(--sec);font-size:13px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:20px;font-weight:700;color:var(--pri);line-height:1.3}
.stat span{font-size:12px;color:var(--sec)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.searchbox{padding:0;overflow:hidden;margin-bottom:12px}
.searchbox input{width:100%;border:none;outline:none;padding:14px 16px;font:inherit;background:transparent;color:var(--text)}
.h2{font-size:14px;color:var(--sec);font-weight:600;margin:18px 4px 8px}
.groups{display:flex;flex-direction:column;gap:10px}
.gcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s}
.gcard:active{transform:scale(.985)}
.gt{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.gname{font-size:16px;font-weight:700}
.gtag{font-size:11px;color:var(--pri);background:var(--pri-l);border-radius:20px;padding:2px 9px}
.gbar{height:7px;background:#eef1f7;border-radius:4px;overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#7c9bff);border-radius:4px;transition:width .35s}
.gm{display:flex;justify-content:space-between;font-size:12px;color:var(--sec);margin-top:8px}
.row-btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:600;text-align:center;transition:opacity .15s,transform .12s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
.btn.danger-ghost{background:var(--card);border:1px solid var(--line);color:var(--err)}
.btn.sm{padding:8px 12px;font-size:13px;flex:none;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.list{display:flex;flex-direction:column;gap:8px}
.litem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;box-shadow:var(--sh)}
.lmeta{display:block;font-size:11px;color:var(--sec);margin-bottom:3px}
.lq{display:block;font-size:14px;line-height:1.55}
.lact{display:flex;gap:8px;margin-top:8px}
.mini{font-size:12px;color:var(--pri);background:var(--pri-l);border-radius:8px;padding:5px 10px}
.empty{color:var(--sec);font-size:13px;text-align:center;padding:18px 0}

/* ---------- 练习页 ---------- */
.phead{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
.back{font-size:15px;color:var(--pri);font-weight:600;padding:4px 6px;margin-left:-6px}
.ptitle{flex:1;font-size:14px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnum{font-size:12px;color:var(--sec);min-width:60px;text-align:right}
.pbar{height:6px;background:#e9edf5;border-radius:4px;overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
.jumpbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.jumpbar input{width:82px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;background:var(--card);outline:none}
.jumpbar span{font-size:12px;color:var(--sec)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 15px}
.qtag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--pri);background:var(--pri-l);border-radius:20px;padding:2px 9px;margin-bottom:10px}
.qtag em{font-style:normal;color:var(--sec)}
.qtext{font-size:16.5px;line-height:1.75;font-weight:500;letter-spacing:.2px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.opts.judge{flex-direction:row}
.opts.judge .opt{flex:1;justify-content:center;text-align:center}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;background:#fbfcfe;border:1.5px solid var(--line);
  border-radius:12px;padding:12px 13px;text-align:left;font-size:14.5px;line-height:1.6;transition:all .14s}
.opt b{font-weight:500}
.opt:active{border-color:var(--pri)}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}
.opt.correct{border-color:var(--ok);background:var(--ok-l)}
.opt.wrong{border-color:var(--err);background:var(--err-l)}
.opt.dim{opacity:.5}
.reveal{margin-top:15px;border-radius:12px;padding:13px 14px;border:1px solid var(--line);background:#fbfcfe}
.reveal.rok{border-color:#bfe8d4;background:var(--ok-l)}
.reveal.rerr{border-color:#f6cccc;background:var(--err-l)}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:700;margin-bottom:10px}
.ok{color:var(--ok)}.err{color:var(--err)}
.ansline{font-weight:500;font-size:13px;color:var(--sec)}
.ansline b{color:var(--text);font-size:15px;letter-spacing:1px}
.rlab{font-size:12px;color:var(--sec);font-weight:600;margin-bottom:4px}
.rbody p{font-size:14px;line-height:1.75}
.doubt{margin-top:11px;background:var(--warn-l);border:1px solid #f0dfae;color:var(--warn);
  border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7}
.racts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
/* 次要动作（重做／选中文字／移出错题本）单独一行，允许换行。
   手机上按钮文字长，「移出错题本」这类如果和别的挤在一行会被裁掉。 */
.racts.row2{margin-top:8px}
.racts.row2 .btn{flex:0 1 auto;min-width:0}
/* AI 解析是主操作：整行加宽、加大点击区域，手机上更好点 */
.racts .btn.ai{flex:1 1 100%;padding:13px 14px;font-size:15px;border-radius:12px}
.navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20}
.navbar .inner{max-width:660px;margin:0 auto;display:flex;gap:8px;width:100%}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(16,24,40,.9);color:#fff;
  font-size:13px;padding:9px 16px;border-radius:20px;z-index:40;pointer-events:none;opacity:0;transition:opacity .25s;
  max-width:calc(100vw - 32px);box-sizing:border-box;text-align:center;line-height:1.5}
.toast.show{opacity:1}
.foot{text-align:center;font-size:11px;color:#9aa4b2;padding:22px 0 6px;line-height:1.7}
.swipehint{text-align:center;font-size:12px;color:#9aa4b2;padding:14px 0 2px;letter-spacing:.5px}
.cardstat{display:flex;gap:8px;margin-bottom:12px}
.cardstat>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;color:var(--sec);box-shadow:var(--sh)}
.cardstat b{display:block;font-size:19px;font-weight:700;line-height:1.35}
.cardstat .c-ok b{color:var(--ok)}
.cardstat .c-no b{color:var(--err)}
.cardhint{font-size:12px;color:var(--sec);margin-bottom:10px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.cell{height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--sec);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.cell:active{transform:scale(.94)}
.cell.ok{background:var(--ok-l);border-color:#a8dcc3;color:var(--ok)}
.cell.no{background:var(--err-l);border-color:#f2b8ba;color:var(--err)}
.cell.cur{outline:2px solid var(--pri);outline-offset:1px}
.btn.danger{background:var(--err);color:#fff}
.ask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.ask.show{display:flex}
.askbox{background:#fff;border-radius:16px;padding:20px 18px 16px;width:100%;max-width:320px;box-shadow:0 12px 32px rgba(16,24,40,.22)}
.askbox p{font-size:15px;line-height:1.75;margin-bottom:16px;text-align:center;white-space:pre-line}
.askbtns{display:flex;gap:10px}
.askbtns .btn{padding:11px 14px;font-size:14px}
.storewarn{background:var(--warn-l);border:1px solid #f0dfae;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.stats4{grid-template-columns:repeat(4,1fr);margin-top:-4px}
.stats4 .stat{padding:9px 4px}
.stats4 .stat b{font-size:17px}
.stats4 .stat span{font-size:11px}
.stat.netup b{color:var(--ok)}
.stat.netdown b{color:var(--err)}
.qstats{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px}
.qsb{font-size:11.5px;line-height:1.6;padding:1px 8px;border-radius:20px;background:#f1f4f9;color:var(--sec);border:1px solid var(--line)}
.qsb.netup{background:var(--ok-l);color:var(--ok);border-color:#bfe8d4}
.qsb.netdown{background:var(--err-l);color:var(--err);border-color:#f6cccc}
.btn.sm.rm{background:#fff;border:1px solid #f6cccc;color:var(--err)}
.qsb.sbok{background:var(--ok-l);color:var(--ok);border-color:#bfe8d4}
.qsb.sbno{background:var(--err-l);color:var(--err);border-color:#f6cccc}

/* ---------- 考试模式 ----------
   需求：单选 40 + 判断 30 + 多选 20 = 90 题，满分 100。
   单选/判断 每题 1 分（70 分），多选 每题 1.5 分（30 分）。
   设计要点：
    · 考试中「不即时判分」——选中只是选中，交卷后才出对错与解析，
      否则和练习模式没有区别，考不出真实水平。
    · 独立导航：只能「上一题/下一题 + 题号跳转」，不能靠随机跳来跳去。
    · 顶部常驻计时与答题进度，交卷前有确认，避免误触丢卷。 */
.examsetup .exr{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.examsetup .exr:last-of-type{border-bottom:none}
.examsetup .exr .lb{flex:1;font-size:14.5px}
.examsetup .exr .lb i{display:block;font-style:normal;font-size:11.5px;color:var(--sec);margin-top:2px}
.examsetup .exr .num{flex:none;font-size:15px;font-weight:700;color:var(--pri);min-width:62px;text-align:right}
.examsetup .exr .num em{font-style:normal;font-size:11px;color:var(--sec);font-weight:400}
.examtot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:12px 13px;
  border-radius:12px;background:var(--pri-l);border:1px solid #dde3ff}
.examtot b{font-size:22px;color:var(--pri);font-weight:700}
.examtot span{font-size:12.5px;color:var(--sec);text-align:right;line-height:1.5}
.exambar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border:1px solid var(--line);
  border-radius:12px;padding:8px 10px;margin-bottom:10px;box-shadow:var(--sh)}
.exambar .et{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--text);min-width:66px}
.exambar .et.warn{color:var(--err)}
.exambar .ep{flex:1;font-size:12px;color:var(--sec);text-align:center}
.exambar .ep b{color:var(--pri)}
.eopt{display:flex;align-items:flex-start;gap:10px;width:100%;background:#fbfcfe;border:1.5px solid var(--line);
  border-radius:12px;padding:12px 13px;text-align:left;font-size:14.5px;line-height:1.6;transition:all .14s}
.eopt:active{border-color:var(--pri)}
.eopt.sel{border-color:var(--pri);background:var(--pri-l)}
.eopt.correct{border-color:var(--ok);background:var(--ok-l)}
.eopt.wrong{border-color:var(--err);background:var(--err-l)}
.eopt.dim{opacity:.5}
.eopt .ck{flex:none;width:19px;height:19px;border-radius:6px;border:1.5px solid #cdd5e4;background:#fff;
  margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700}
.eopt.sel .ck{border-color:var(--pri);background:var(--pri)}
.eopt.correct .ck{border-color:var(--ok);background:var(--ok)}
.eopt.wrong .ck{border-color:var(--err);background:var(--err)}
.emark{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border-radius:20px;padding:2px 9px;margin-bottom:10px;font-weight:600}
.emark.no{background:var(--err-l);color:var(--err);border:1px solid #f6cccc}
.emark.ok{background:var(--ok-l);color:var(--ok);border:1px solid #bfe8d4}
.emark.skip{background:#f1f4f9;color:var(--sec);border:1px solid var(--line)}
.eresult{text-align:center;padding:20px 14px 8px}
.eresult .score{font-size:52px;font-weight:700;line-height:1.1;letter-spacing:-1px}
.eresult .score.full{color:var(--ok)}
.eresult .score.pass{color:var(--pri)}
.eresult .score.fail{color:var(--err)}
.eresult .sl{font-size:13.5px;color:var(--sec);margin-top:4px}
.eresult .rk{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;border-radius:20px;padding:5px 14px}
.etbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
.etbl th,.etbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}
.etbl th:first-child,.etbl td:first-child{text-align:left}
.etbl th{font-size:11.5px;color:var(--sec);font-weight:600;background:#fbfcfe}
.etbl td b{font-size:14.5px}
.etbl tr.tot td{border-bottom:none;font-weight:700;background:#fbfcfe}
.ehist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ehitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;box-shadow:var(--sh);font-size:13px}
.ehitem .hs{font-size:19px;font-weight:700;min-width:52px;text-align:center}
.ehitem .hd{flex:1;min-width:0;color:var(--sec);font-size:11.5px;line-height:1.5}
.ehitem .hd b{display:block;color:var(--text);font-size:13px;margin-bottom:1px}
.ehist .empty{padding:14px 0}
.eegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.ecell{height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--sec);
  font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.ecell:active{transform:scale(.94)}
.ecell.answered{background:var(--pri-l);border-color:#c3cdfa;color:var(--pri)}
.ecell.ok{background:var(--ok-l);border-color:#a8dcc3;color:var(--ok)}
.ecell.no{background:var(--err-l);border-color:#f2b8ba;color:var(--err)}
.ecell.cur{outline:2px solid var(--pri);outline-offset:1px}
.elegend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--sec);margin:10px 0 12px}
.elegend i{display:inline-block;width:11px;height:11px;border-radius:4px;border:1.5px solid var(--line);
  vertical-align:-1px;margin-right:5px}
.elegend .l1 i{background:var(--pri-l);border-color:#c3cdfa}
.elegend .l2 i{background:var(--ok-l);border-color:#a8dcc3}
.elegend .l3 i{background:var(--err-l);border-color:#f2b8ba}

/* ---------- AI 助手 ---------- */
.aih{display:flex;align-items:center;gap:8px;margin:14px 0 8px;flex-wrap:wrap}
.aih .sp{flex:1}
.btn.ai{background:linear-gradient(135deg,#5b6cf9,#7d4df2);color:#fff;border-radius:10px;
  padding:9px 14px;font-size:13.5px;font-weight:600;flex:none;box-shadow:0 2px 6px rgba(91,108,249,.28)}
.btn.ai:active{transform:scale(.97)}
.btn.ai[disabled]{opacity:.55;pointer-events:none;box-shadow:none}
.aibox{margin-top:4px;background:linear-gradient(180deg,#f7f8ff,#fbfcff);border:1px solid #dde3ff;
  border-left:3px solid var(--pri);border-radius:12px;padding:13px 14px}
.aibody{font-size:14px;line-height:1.8;word-break:break-word}
.aibody p{margin:0 0 10px}
.aibody p:last-child{margin-bottom:0}
.aibody h3{font-size:13px;margin:16px 0 7px;color:var(--pri);font-weight:700;
  display:flex;align-items:center;gap:7px;letter-spacing:.2px}
.aibody h3:first-child{margin-top:0}
/* 标题前的小竖条，把四个小节在视觉上彻底切开，避免长段落连成一片 */
.aibody h3:before{content:'';width:3px;height:13px;border-radius:2px;background:var(--pri);flex:none}
.aibody ul,.aibody ol{margin:0 0 10px;padding-left:20px;list-style:none}
/* 逐项分析改用自绘圆点：每项独占一行、悬挂缩进，
   这样「A：错因——说明」换行时能对齐，不会看成两段。 */
.aibody li{margin:4px 0;position:relative;padding-left:14px}
.aibody li:before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;
  background:var(--pri-l);border:1px solid var(--pri)}
.aibody li+li{margin-top:5px}
.aibody code{background:#eef1ff;color:#4152d6;border-radius:4px;padding:1px 5px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.aibody strong{font-weight:700;color:#1b2a5e}
.aierr{margin-top:8px;background:var(--err-l);border:1px solid #f6cccc;color:var(--err);border-radius:10px;
  padding:10px 12px;font-size:13px;line-height:1.7;word-break:break-word}
.aiwait{display:flex;align-items:center;gap:10px;color:var(--sec);font-size:13px}
.spin{width:15px;height:15px;border:2px solid var(--pri-l);border-top-color:var(--pri);border-radius:50%;
  animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 笔记 ---------- */
.notewrap{margin-top:10px;border-top:1px dashed #e4e0cd;padding-top:11px}
.note{background:#fffdf3;border:1px solid #f0e2b6;border-radius:12px;padding:11px 12px;margin-bottom:9px}
.note.tk{background:#fffaf0}
.notehead{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px;color:var(--warn);flex-wrap:wrap}
.notehead .ntag{background:var(--warn-l);border:1px solid #f0dfae;border-radius:20px;padding:1px 8px;font-weight:600}
.notehead .ntag.ai{background:#eef2ff;border-color:#dde3ff;color:var(--pri)}
.notehead .ntime{color:#a08a4e}
.notehead .sp{flex:1}
.notebody{font-size:14px;line-height:1.78;word-break:break-word;white-space:pre-wrap}
.notebody.ai{white-space:normal}
.notebody.ai p{margin:0 0 9px}.notebody.ai p:last-child{margin-bottom:0}
.notebody.ai h3{font-size:13px;margin:14px 0 6px;color:#8a6a12;font-weight:700;
  display:flex;align-items:center;gap:7px}
.notebody.ai h3:before{content:'';width:3px;height:12px;border-radius:2px;background:var(--warn);flex:none;opacity:.7}
.notebody.ai ul,.notebody.ai ol{margin:0 0 9px;padding-left:20px;list-style:none}
.notebody.ai li{margin:4px 0;position:relative;padding-left:14px}
.notebody.ai li:before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;
  background:#f0dfae;border:1px solid #d8b96a}
.notebody.ai code{background:#f6efd8;border-radius:4px;padding:1px 5px;font-size:13px;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.notebody.ai strong{font-weight:700}
.nact{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.nact button{font-size:12px;border-radius:8px;padding:5px 10px;background:#fff;border:1px solid #ecdfb4;color:#8a6a12}
.nact button.del{border-color:#f6cccc;color:var(--err)}
.noteedit{width:100%;border:1px solid #ecdfb4;border-radius:10px;padding:10px 11px;font:inherit;font-size:14px;
  line-height:1.7;background:#fff;outline:none;resize:vertical;min-height:110px;color:var(--text)}
.noteadd{margin-top:8px}
.noteadd textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;
  font-size:14px;line-height:1.7;background:#fbfcfe;outline:none;resize:vertical;min-height:64px;color:var(--text)}
.noteadd textarea:focus{border-color:var(--warn)}
.noteadd .row{display:flex;gap:8px;margin-top:8px}

/* ---------- 设置页 ---------- */
.setrow{margin-bottom:15px}
.setrow label{display:block;font-size:12.5px;color:var(--sec);font-weight:600;margin-bottom:6px}
.setrow input,.setrow select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  font:inherit;font-size:14px;background:var(--card);outline:none;color:var(--text)}
.setrow input:focus,.setrow select:focus{border-color:var(--pri)}
.setrow .hint{font-size:11.5px;color:#9aa4b2;margin-top:5px;line-height:1.65}
.keyline{display:flex;gap:8px}
.keyline input{flex:1;min-width:0}
.keyline button{flex:none;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fbfcfe;
  font-size:13px;color:var(--sec)}
.modeltip{font-size:11.5px;color:var(--sec);background:#f1f4f9;border:1px solid var(--line);border-radius:10px;
  padding:10px 11px;line-height:1.7;margin-bottom:15px}
.badge-ai{font-size:10.5px;color:#fff;background:linear-gradient(135deg,#5b6cf9,#7d4df2);border-radius:20px;  padding:1px 7px;font-weight:600;vertical-align:middle}
.okdot{color:var(--ok);font-weight:600}
.nodot{color:var(--sec);font-weight:600}
.selstatus{font-size:12.5px;line-height:1.7;margin-top:8px;padding:8px 11px;border-radius:10px;
  background:#f1f4f9;border:1px solid var(--line);color:var(--sec)}
.selstatus.ok{background:var(--ok-l);border-color:#bfe8d4;color:var(--ok)}
.selstatus.no{background:var(--err-l);border-color:#f6cccc;color:var(--err)}
/* file:// 求助块里的命令：深底等宽，user-select:all 让整行一点即全选，方便复制 */
.cmdline{margin:5px 0;background:#1e2233;color:#d8e0ff;border-radius:8px;padding:8px 11px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;
  word-break:break-all;user-select:all;-webkit-user-select:all}
/* 单题思考强度开关 */
.effbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--sec)}
.effbar:empty{display:none}
.effbtn{font:inherit;font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);
  background:#fff;color:var(--sec);cursor:pointer}
.effbtn.on{background:linear-gradient(135deg,#5b6cf9,#7d4df2);color:#fff;border-color:transparent;font-weight:600}
.efftip{font-size:11px;color:#9aa4b2;margin-left:2px}
.effsep{color:#d6dbe3;font-size:11px;margin:0 1px}
/* 流式输出：阶段标签 + 光标动画 */
.aiphase{font-size:11px;color:var(--sec);margin-right:7px;white-space:nowrap}
.aibody .aiwait0{color:#9aa4b2}
.aibody:empty{display:none}
/* 缓存 / 已存提示 */
.aiphase.cache{color:#8a7bd8}
.aiphase.saved{color:var(--ok)}
.badge-cache{font-size:10.5px;color:#6b5cc4;background:#efecfb;border:1px solid #ddd6f7;
  border-radius:20px;padding:1px 7px;font-weight:600;vertical-align:middle;margin-left:5px}
/* 备份 / 恢复控件 */
.bkchk{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:12.5px;color:var(--sec);
  line-height:1.6;cursor:pointer}
.bkchk input{margin:2px 0 0;flex:none;width:16px;height:16px;accent-color:var(--pri)}
.bktext{width:100%;box-sizing:border-box;margin-top:10px;min-height:74px;max-height:180px;resize:vertical;
  border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.6;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#fbfcff;color:var(--text)}
.bktext:focus{outline:none;border-color:var(--pri);background:#fff}
.bkok{margin-top:10px;background:var(--ok-l);border:1px solid #c9e9d5;color:#1c7a45;border-radius:10px;
  padding:9px 11px;font-size:12.5px;line-height:1.65;word-break:break-word}

/* ---------- 手机适配 ----------
   原先整份样式表没有任何媒体查询，所有尺寸都按桌面写：
   · .row-btns 里三个按钮各 flex:1，中文按钮文字放不下就被挤出屏幕
   · .racts 里「重做本题 / AI 解析本题 / 解析选中文字 / 移出错题本」四个挤一行必然溢出
   · .stats4 四列在窄屏压到无法阅读
   下面按 640 / 400 两档收口，保证 375px（iPhone 常见宽度）不出现横向滚动。 */
@media (max-width:640px){
  body{padding:10px 10px 96px}
  .hero h1{font-size:20px}
  .qtext{font-size:16px}
  .opt{font-size:14px;padding:11px 12px}
  .qcard{padding:14px 13px}
  /* 首页两排按钮：改为纵向堆叠，避免中文按钮被压缩换行 */
  .row-btns{flex-wrap:wrap}
  .row-btns .btn{flex:1 1 100%}
  .row-btns .btn.sm{flex:1 1 auto}
  .racts.row2 .btn{flex:1 1 auto}
  .navbar .inner .btn{padding:11px 8px;font-size:14px}
  .aibody{font-size:14px}
  .stats4{grid-template-columns:repeat(2,1fr)}
  .cmdline{font-size:11px;padding:7px 9px}
  /* 考试页：题号网格在小屏保持 46px 可点区域，靠列数自适应而不是缩小 */
  .eopt{font-size:14px;padding:11px 12px}
  .examsetup .exr .num{min-width:54px}
  .eresult .score{font-size:46px}
}
@media (max-width:400px){
  body{padding:8px 8px 92px}
  .hero h1{font-size:18px}
  .stat b{font-size:18px}
  .stat span{font-size:11px}
  .stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .opt{font-size:13.5px}
  /* 收窄到 375px 时「解析选中文字」这类仍能一行放下，
     实在放不下就自动换行，绝不横向溢出。 */
  .racts.row2 .btn{padding:8px 10px;font-size:12.5px}
  .ract-row2 .mini,.lact .mini{padding:5px 8px}
  /* 考试页：375px 下把「已答 x/90」这行压到下一排，别把计时器挤没 */
  .exambar{flex-wrap:wrap;padding:8px}
  .exambar .ep{flex:1 1 100%;text-align:left}
  .etbl{font-size:12px}
  .etbl th,.etbl td{padding:8px 5px}
  .ehitem .hd b{font-size:12.5px}
}
</style>
</head>

"师生平等交往","D":"教师给学生的第一印象"},"a":"A","e":"教师的仪表、生活作风和习惯是教师获得威信的必要条件。","d":"本题问“教师获得威信的必要条件”，答案为 A（仪表、生活作风和习惯）；与单选 87（基本条件＝良好的道德品质）、单选 44 措辞极近却答案不同，建议核对题源。"},{"k":"教育心理学|单选题|41","b":"教育心理学","t":"单选题","ty":"single","n":41,"q":"关于道德的描述，下列说法错误的是","o":{"A":"从反映内容上看，道德反映的内容比品德反映的内容要广阔得多，概括得多。","B":"人们依据道德规范来辨别是非、善恶、美丑，指导或调节行为。","C":"道德产生的力量源泉则是个人需要。","D":"道德的内容是社会生活的总体要求，是对经济基础的反映，是调节社会关系的行为规范的完整体系。"},"a":"C","e":"道德产生的力量源泉是社会需要，而非个人需要，故C错误。"},{"k":"教育心理学|单选题|42","b":"教育心理学","t":"单选题","ty":"single","n":42,"q":"马斯洛认为，人们追求实现自己的能力，并使之完善化的需要。","o":{"A":"爱与归属的需要","B":"自我实现的需要","C":"生理需要","D":"安全需要"},"a":"B","e":"追求实现自身能力并使之完善，属自我实现的需要。"},{"k":"教育心理学|单选题|43","b":"教育心理学","t":"单选题","ty":"single","n":43,"q":"关于问题解决的心理过程，下列说法正确的是","o":{"A":"桑代克认为，问题解决不是尝试和错误的渐进过程，而是对整个问题情境的突然领悟和豁然开朗，即突然领悟到手段和目的之间的关系。","B":"试误说认为，问题解决要经过一系列尝试和错误，这对后来的问题解决研究有一定影响。但它认为尝试和错误是盲目的，忽视了认知在问题解决中的作用。","C":"纽威尔和西蒙提出，问题解决由一系列互相联系的心理组织构成，每一心理组织都把问题分析综合为更狭小、更明确的陈述。一般要经历一般范围、功能解决、特殊解决这三个水平。","D":"邓克尔认为，问题解决就是在问题空间进行探索、运用一系列认知操作以达到目标的过程。"},"a":"B","e":"B项对试误说的评述正确：肯定其影响，也指出其忽视认知作用的局限。"},{"k":"教育心理学|单选题|44","b":"教育心理学","t":"单选题","ty":"single","n":44,"q":"什么是教师获得威信所必需的因素","o":{"A":"教育教学技能和心理素质","B":"师生平等交往","C":"教师的仪表、生活作风和习惯","D":"良好的道德品质"},"a":"A","e":"教育教学技能和心理素质是教师获得威信所必需的因素。","d":"本题问“教师获得威信所必需的因素”，答案为 A（教育教学技能和心理素质）；与单选 40、87 措辞极近却答案不同，建议核对题源。"},{"k":"教育心理学|单选题|45","b":"教育心理学","t":"单选题","ty":"single","n":45,"q":"提出人格发展的八阶段论的心理学家是","o":{"A":"弗洛伊德","B":"维果茨基","C":"皮亚杰","D":"埃里克森"},"a":"D","e":"人格发展八阶段论由埃里克森提出。"},{"k":"教育心理学|单选题|46","b":"教育心理学","t":"单选题","ty":"single","n":46,"q":"关于智力，下列说法不正确的是","o":{"A":"智力正常是大学生学习、生活与工作的基本心理条件，是心理健康的重要标准。","B":"衡量大学生的智力是否正常，关键在于看其是否正常地、充分地发挥了效能","C":"衡量大学生的智力是否正常，看他是否有强烈的求知欲和浓厚的探索兴趣，乐于学习，能适应时代的要求，具有创新能力。","D":"智力的高低等于成绩的高低"},"a":"D","e":"智力高低不等于成绩高低，故D不正确。"},{"k":"教育心理学|单选题|47","b":"教育心理学","t":"单选题","ty":"single","n":47,"q":"大学生在择业时，有的工作经济收入高但工作环境较差，有的工作经济收入低但工作环境较好，此类冲突属于动机冲突中的","o":{"A":"双趋冲突","B":"双避冲突","C":"趋避冲突","D":"多重趋避冲突"},"a":"D","e":"多个目标各有优劣、难以取舍，属多重趋避冲突。"},{"k":"教育心理学 学生心理及师生相互作用的心理，不含家长心理。"},{"k":"教育心理学|单选题|116","b":"教育心理学","t":"单选题","ty":"single","n":116,"q":"下列不属于创造性的特点是","o":{"A":"社会价值或个人价值","B":"独特性","C":"概括性","D":"新颖性"},"a":"C","e":"创造性的特点是新颖性、独特性及具有社会价值或个人价值，不含概括性。"},{"k":"教育心理学|单选题|117","b":"教育心理学","t":"单选题","ty":"single","n":117,"q":"教师的主要作用是","o":{"A":"维护学生心理健康","B":"开展教学活动","C":"传授给学生知识","D":"管理班级秩序"},"a":"C","e":"教师的主要作用是传授给学生知识。"},{"k":"教育心理学|单选题|118","b":"教育心理学","t":"单选题","ty":"single","n":118,"q":"关于心理问题，下列说法正确的是","o":{"A":"心理疾病通常不存在心理状态的病理性变化，是正常心理活动中的局部异常状态。","B":"心理障碍通常不存在心理状态的病理性变化，是正常心理活动中的局部异常状态。","C":"心理障碍属于轻微的心理异常。","D":"心理疾病是比较严重或严重的心理异常，是多种心理障碍集中或综合的表现。"},"a":"D","e":"心理疾病是较严重或严重的心理异常，是多种心理障碍集中或综合的表现。"},{"k":"教育心理学|单选题|119","b":"教育心理学","t":"单选题","ty":"single","n":119,"q":"以下关于教师在咨询中常具备的特征，描述错误的是","o":{"A":"具有自发性和诚恳的态度","B":"心领神会","C":"把自己的价值观强加给学生","D":"没有占有欲"},"a":"C","e":"把自己的价值观强加给学生，是教师咨询中应当避免的错误做法。"},{"k":"教育心理学|单选题|120","b":"教育心理学","t":"单选题","ty":"single","n":120,"q":"提出了“学习的最佳期”的概念的心理学家是","o":{"A":"弗洛伊德","B":"维果茨基","C":"皮亚杰","D":"埃里克森"},"a":"B","e":"“学习的最佳期”概念由维果茨基提出。"},{"k":"教育心理学|单选题|121","b":"教育心理学","t":"单选题","ty":"single","n":121,"q":"关于发散思维的独特性，下列说法错误的是","o":{"A":"指对问题提出超乎寻常的、新颖的、独特的见解，即以前所未有的新观点、新角度去反映事物。","B":"它最能代表发散思维的本质，是最高层次的发散特征。","C":"表现为发散的“新异”、“独到”。","D":"指思考方式变化多端，思维产品的种类不拘一格，能举一反三，触类旁通，随机应变，思维不受定势束缚，能产生多种多样的新观点。"},"a":"D","e":"D描述的是发散思维的变通性，不是独特性。"},{"k":"教育心理学|单选题|122","b":"教育心理学","t":"单选题","ty":"single","n":122,"q":"A－B型的人格分类由哪两位心理学家提出","o":{"A":"培因和李波特","B":"弗瑞德曼和李波特","C":"弗瑞德曼和罗森曼","D":"阿德勒和荣格"},"a":"C","e":"A—B型人格分类由弗瑞德曼和罗森曼提出。"},{"k":"教育心理学|单选题|123","b":"教育心理学","t":"单选题","ty":"single","n":123,"q":"人格的基本特征不包括","o":{"A":"社会性","B":"整体性","C":"多变性","D":"独特性"},"a":"C","e":"人格的基本特征是独特性、稳定性、整体性、社会性和功能性，不含多变性。"},{"k":"教育心理学|单选题|124","b":"教育心理学","t":"单选题","ty":"single","n":124,"q":"下列大学生中常见的不合理信念中的过分概况化的是","o":{"A":"“如果我这次竞聘不顺利，我这一辈子就完了”","B":"“如果我这门课考不好，我真是一个无用的人”","C":"“尺有所长，寸有所短”","D":"“我的表现必须得到所有人的高度评价”"},"a":"B","e":"把一次考试失败概括为“我是一个无用的人”，属过分概括化。"},{"k":"教育心理学|单选题|125","b":"教育心理学","t":"单选题","ty":"single","n":125,"q":"具有精力旺盛、直率热情、行动敏捷、情绪易于激动、心情变化剧烈、脾气暴躁等特征的人属于以下哪种气质类型","o":{"A":"多血质","B":"胆汁质","C":"抑郁质","D":"粘液质"},"a":"B","e":"精力旺盛、直率热情、行动敏捷、易激动、脾气暴躁属胆汁质。"},{"k":"教育心理学|单选题|126","b":"教育心理学","t":"单选题","ty":"single","n":126,"q":"以下不属于赫尔巴特提出的学习过程的阶段：","o":{"A":"感觉阶段","B":"记忆阶段","C":"理解阶段","D":"遗忘阶段"},"a":"D","e":"赫尔巴特提出的学习过程阶段不含“遗忘阶段”。"},{"k":"教育心理学|单选题|127","b":"教育心理学","t":"单选题","ty":"single","n":127,"q":"激励作为过程以什么告终","o":{"A":"目标实现需要满足","B":"行动","C":"需要","D":"动机"},"a":"A","e":"激励作为一个过程，以目标实现、需要满足而告终。"},{"k":"教育心理学|单选题|128","b":"教育心理学","t":"单选题","ty":"single","n":128,"q":"状态型激励理论不包括","o":{"A":"归因理论","B":"公平理论","C":"双因素理论","D":"挫折理论"},"a":"C","e":"双因素理论属内容型激励理论，不属于状态型激励理论。"},{"k":"教育心理学|单选题|129","b":"教育心理学","t":"单选题","ty":"single","n":129,"q":"激励的中介机制是","o":{"A":"行为","B":"目标","C":"诱因","D":"动机"},"a":"D","e":"动机是激励的中介机制。"},{"k":"教育心理学|单选题|130","b":"教育心理学","t":"单选题","ty":"single","n":130,"q":"大学生动机的冲突性表现在","o":{"A":"多样性和学习动机占主导地位","B":"由于大学生面临着学习、交往、升学、职业等多方面选择","C":"大学生为了获得真才实学而勤奋学习","D":"大学生不轻易将内心活动表露出来，他们的动机和行为之间也经常不一致"},"a":"B","e":"大学生面临学习、交往、升学、职业等多方面选择，故动机具有冲突性。"},{"k":"教育心理学|单选题|131","b":"教育心理学","t":"单选题","ty":"single","n":131,"q":"成就需要理论的提出者是","o":{"A":"赫茨伯格","B":"马斯洛","C":"弗鲁姆","D":"麦克利兰的"},"a":"D","e":"成就需要理论由麦克利兰提出。"},{"k":"教育心理学|单选题|132","b":"教育心理学","t":"单选题","ty":"single","n":132,"q":"强化理论的提出者是","o":{"A":"斯金纳","B":"洛克","C":"弗鲁姆","D":"马斯洛"},"a":"A","e":"强化理论由斯金纳提出。"},{"k":"教育心理学|单选题|133","b":"教育心理学","t":"单选题","ty":"single","n":133,"q":"马斯洛认为，具有健全人格的人是","o":{"A":"自我实现的人","B":"机能充分发挥的人","C":"“成熟者”","D":"创发者"},"a":"A","e":"马斯洛认为具有健全人格的人是自我实现的人。"},{"k":"教育心理学|单选题|134","b":"教育心理学","t":"单选题","ty":"single","n":134,"q":"关于品德的描述，下列说法错误的是","o":{"A":"品德的形成与发展不仅受社会制约，而且受个体的心理制约。","B":"品德反映社会生活，它的产生、发展和变化服从于社会的发展规律，属于社会意识的范畴。","C":"品德的内容则是社会道德规范局部的具体体现，是社会道德要求的部分反映。","D":"品德又称道德品质，是道德在个体身上的体现，是个人依据一定的社会道德准则和规范行动时所表现出的稳定的心理特征或倾向。"},"a":"B","e":"品德属于个体意识范畴，B项说品德属于社会意识范畴，故错误。"},{"k":"教育心理学|单选题|135","b":"教育心理学","t":"单选题","ty":"single","n":135,"q":"教师运用学习测查的主要目的是","o":{"A":"教授新知识","B":"提供练习","C":"检查学生是否理解了所学的内容","D":"复习旧知识"},"a":"C","e":"教师运用学习测查的主要目的是检查学生是否理解了所学的内容。"},{"k":"教育心理学|多选题|1","b":"教育心理学","t":"多选题","ty":"multiple","n":1,"q":"大学生的学习动机主要有","o":{"A":"谋求职业和满足生活的动机","B":"事业成就的动机","C":"报答性和附属的学习动机","D":"自我实现和自我提高的动机"},"a":"ABCD","e":"大学生的学习动机包括谋求职业与满足生活、事业成就、报答性与附属、自我实现与自我提高等。"},{"k":"教育心理学|多选题|2","b":"教育心理学","t":"多选题","ty":"multiple","n":2,"q":"下列属于思维的特征是","o":{"A":"问题性","B":"创造性","C":"概括性","D":"间接性"},"a":"ABCD","e":"思维的特征有问题性、创造性、概括性和间接性。"},{"k":"教育心理学|多选题|3","b":"教育心理学","t":"多选题","ty":"multiple","n":3,"q":"下列关于爬山法与手段-目的分析法的说法中，正确的是","o":{"A":"都属于算法的一种。","B":"爬山法与手段-目的分析法的不同在于：有时人们为了实现最终目标，不得不采取迂回方式，暂时扩大初始状态与目标状态的差异（暂时“退回去”或“欲进先退”）以有利于问题解决。","C":"爬山法即采用一定方法，有时是迂回方式，逐步降低初始状态和目标状态的差异以解决问题。","D":"手段-目的分析指将需要达到的问题的目标状态分析成若干子目标，采用一定手段，消除差异，通过实现一系列子目标最终达到总目标。"},"a":"BCD","e":"爬山法与手段—目的分析属启发式策略，B、C、D表述正确；A错，二者不属于算法。"},{"k":"教育心理学|多选题|4","b":"教育心理学","t":"多选题","ty":"multiple","n":4,"q":"下列属于斯金纳的“学习公律”是","o":{"A":"准备律","B":"消退率","C":"练习律","D":"效果律"},"a":"ACD","e":"斯金纳的学习公律为准备律、练习律、效果律，“消退率”不属于。"},{"k":"教育心理学|多选题|5","b":"教育心理学","t":"多选题","ty":"multiple","n":5,"q":"关于品德的描述，下列说法正确的是","o":{"A":"品德的内容则是社会道德规范局部的具体体现，是社会道德要求的部分反映。","B":"品德又称道德品质，是道德在个体身上的体现，是个人依据一定的社会道德准则和规范行动时所表现出的稳定的心理特征或倾向。","C":"品德的形成与发展不仅受社会制约，而且受个体的心理制约。","D":"品德反映社会生活，它的产生、发展和变化服从于社会的发展规律，属于社会意识的范畴。"},"a":"ABC","e":"A、B、C正确；D错，应说“道德”属于社会意识范畴，品德属于个体意识范畴。"},{"k":"教育心理学|多选题|6","b":"教育心理学","t":"多选题","ty":"multiple","n":6,"q":"下列不属于一级强化物的是","o":{"A":"安全","B":"钱","C":"娱乐","D":"食物"},"a":"BC","e":"一级强化物是直接满足生理需要的（食物、安全）；钱和娱乐属二级强化物。"},{"k":"教育心理学|多选题|7","b":"教育心理学","t":"多选题","ty":"multiple","n":7,"q":"关于品德的四种心理成分，下列说法正确的是","o":{"A":"它们的发展有阶段性，且可以单独地割裂开来。","B":"道德认识是品德的思想基础，是道德情感产生的依据。","C":"道德认识是品德一个循环中的终末环节，也是更高循环中的依据和基础。","D":"在品德的心理结构中，哪种成分是核心，占主导和支配地位，取决于主体与情境、事件的性质及完成事情的难易程度。"},"a":"BD","e":"B、D正确；A错（各成分不可割裂）；C错（道德行为才是终末环节与依据）。"},{"k":"教育心理学|多选题|8","b":"教育心理学","t":"多选题","ty":"multiple","n":8,"q":"下列属于品德心理结构的特征的是","o":{"A":"整体性","B":"简单性","C":"复杂性","D":"敏感性"},"a":"AC","e":"品德心理结构的特征有整体性和复杂性，简单性、敏感性不属于。"},{"k":"教育心理学|多选题|9","b":"教育心理学","t":"多选题","ty":"multiple","n":9,"q":"高等教育文化选择途径主要有哪几种","o":{"A":"培养目标","B":"课程和教材","C":"教师群体","D":"校园环境"},"a":"ABCD","e":"高等教育文化选择途径包括培养目标、课程和教材、教师群体、校园环境。"},{"k":"教育心理学|多选题|10","b":"教育心理学","t":"多选题","ty":"multiple","n":10,"q":"关于智力，下列说法正确的是","o":{"A":"衡量大学生的智力是否正常，看他是否有强烈的求知欲和浓厚的探索兴趣，乐于学习，能适应时代的要求，具有创新能力。","B":"智力的高低等于成绩的高低","C":"智力正常是大学生学习、生活与工作的基本心理条件，是心理健康的重要标准。","D":"衡量大学生的智力是否正常，关键在于看其是否正常地、充分地发挥了效能"},"a":"ACD","e":"A、C、D正确；B错，智力高低不等于成绩高低。"},{"k":"教育心理学|多选题|11","b":"教育心理学","t":"多选题","ty":"multiple","n":11,"q":"下列关于陈述性知识，说法正确的是","o":{"A":"陈述性知识是人的长时记忆中的重要内容。","B":"大部分陈述性知识都能够用语言来表述。","C":"它是关于人怎样解决问题、如何去做某事的知识。","D":"能被人用语言来陈述和描述，是有关人所知道的事物状况的知识。"},"a":"ABD","e":"A、B、D正确；C描述的是程序性知识。"},{"k":"教育心理学|多选题|12","b":"教育心理学","t":"多选题","ty":"multiple","n":12,"q":"关于品德和道德，下列说法正确的是","o":{"A":"道德是一种社会现象，是调整人们相互关系的各种行为规范和准则。","B":"品德又称道德品质，是道德在个体身上的体现，是个人依据一定的社会道德准则和规范行动时所表现出的稳定的心理特征或倾向。","C":"道德反映社会生活，它的产生、发展和变化服从于社会的发展规律，属于社会意识的范畴。","D":"品德支配和调节着个体的道德行为，属于个体意识的范畴。"},"a":"ABCD","e":"道德是社会现象、属社会意识；品德是个体现象、属个体意识，A、B、C、D均正确。"},{"k":"教育心理学|多选题|13","b":"教育心理学","t":"多选题","ty":"multiple","n":13,"q":"关于学习过程，以下说法正确的是","o":{"A":"学生的学习活动同科学家探索客观真理的认知活动相同","B":"学习过程不需要也不可能事事从头实践","C":"学习过程等同于认知过程","D":"学习过程必须从头到尾都有实践的参与。"},"a":"BC","e":"B、C正确；A错（学生与科学家的认知活动不同）；D错（不必事事从头实践）；C错（学习过程不等同于认知过程）。","d":"选项 C 写的是“学习过程等同于认知过程”，这句话本身是错误的，但源文件给出的答案是 BC，答案与选项自相矛盾（原选项可能漏了一个“不”字）。"},{"k":"教育心理学|多选题|14","b":"教育心理学","t":"多选题","ty":"multiple","n":14,"q":"心理发展的特点","o":{"A":"不平衡性","B":"普遍性和差异性","C":"连续性与阶段性","D":"具有一定的方向性和顺序性"},"a":"ABCD","e":"心理发展的特点有不平衡性、普遍性和差异性、连续性与阶段性、方向性和顺序性。"},{"k":"教育心理学|多选题|15","b":"教育心理学","t":"多选题","ty":"multiple","n":15,"q":"教师扮演的角色对学生而言有不同作用，这些作用可以按感情因素排列，其中起支持作用的有","o":{"A":"心理咨询和治疗学家","B":"学生的朋友和知己","C":"知识的传授者","D":"团体的领导"},"a":"AB","e":"按感情因素排列，起支持作用的是心理咨询和治疗学家、学生的朋友和知己。"},{"k":"教育心理学|多选题|16","b":"教育心理学","t":"多选题","ty":"multiple","n":16,"q":"下列属于遗忘理论的是","o":{"A":"提取失败说","B":"同化说","C":"模块说","D":"衰退说"},"a":"ABD","e":"遗忘理论包括提取失败说、同化说、衰退说，“模块说”不属于遗忘理论。"},{"k":"教育心理学|多选题|17","b":"教育心理学","t":"多选题","ty":"multiple","n":17,"q":"高等教育心理学对大学生个体心理的研究主要集中","o":{"A":"社交心理","B":"品德和人格心理","C":"知识获得的心理","D":"学习心理"},"a":"BCD","e":"高等教育心理学对大学生个体心理的研究集中在品德和人格心理、知识获得的心理、学习心理。"},{"k":"教育心理学|多选题|18","b":"教育心理学","t":"多选题","ty":"multiple","n":18,"q":"一般说来，激发学生创造意识的主要方法中包括：","o":{"A":"培养良好的否定意识","B":"培养良好的问题意识","C":"勤于思考","D":"给予权威答案"},"a":"ABC","e":"激发创造意识的方法包括培养否定意识、问题意识和勤于思考，给予权威答案会扼杀创造。"},{"k":"教育心理学|多选题|19","b":"教育心理学","t":"多选题","ty":"multiple","n":19,"q":"在影响教师威信形成的客观因素中，最主要的是","o":{"A":"社会对待教师职业的态度","B":"教师职业的社会地位","C":"教育行政机关、学校领导对教师的态度","D":"学生对教师工作的认识和态度"},"a":"AB","e":"影响教师威信形成的客观因素中最主要的是社会对待教师职业的态度和教师职业的社会地位。"},{"k":"教育心理学|多选题|20","b":"教育心理学","t":"多选题","ty":"multiple","n":20,"q":"道德情感形成的形式包括","o":{"A":"意识到道德伦理的情绪体验","B":"与具体的道德形象相联系的情绪体验","C":"直觉的道德感","D":"工具性的相对主义"},"a":"ABC","e":"道德情感形成的形式包括直觉的道德感、与具体道德形象相联系的情绪体验、意识到道德伦理的情绪体验。"},{"k":"教育心理学|多选题|21","b":"教育心理学","t":"多选题","ty":"multiple","n":21,"q":"教师扮演的角色对学生而言有不同作用，这些作用可以按感情因素排列，其中起权威者作用的","o":{"A":"家长的代理人","B":"知识的传授者","C":"团体的领导","D":"模范公民"},"a":"ABCD","e":"起权威者作用的角色包括家长的代理人、知识的传授者、团体的领导、模范公民。"},{"k":"教育心理学|多选题|22","b":"教育心理学","t":"多选题","ty":"multiple","n":22,"q":"记忆的时间分类可分为","o":{"A":"永久记忆","B":"长时记忆","C":"短时记忆","D":"感觉记忆"},"a":"BCD","e":"按时间分类，记忆分为感觉记忆、短时记忆、长时记忆，不含“永久记忆”。"},{"k":"教育心理学|多选题|23","b":"教育心理学","t":"多选题","ty":"multiple","n":23,"q":"关于品德和道德，下列说法正确的是","o":{"A":"道德是一种社会现象，是调整人们相互关系的各种行为规范和准则。","B":"品德又称道德品质，是道德在个体身上的体现，是个人依据一定的社会道德准则和规范行动时所表现出的稳定的心理特征或倾向。","C":"品德反映社会生活，它的产生、发展和变化服从于社会的发展规律，属于社会意识的范畴。","D":"道德支配和调节着个体的道德行为，属于个体意识的范畴。"},"a":"AB","e":"A、B正确；C、D把道德与品德的属性说反了。"},{"k":"教育心理学|多选题|24","b":"教育心理学","t":"多选题","ty":"multiple","n":24,"q":"关于品德的四种心理成分，下列说法错误的是","o":{"A":"道德行为是品德一个循环中的终末环节，也是更高循环中的依据和基础。","B":"它们的发展有阶段性，且可以单独地割裂开来。","C":"它们分别是道德认识、道德情感、道德意志、道德信念","D":"道德情感是品德的思想基础，是道德认识产生的依据。"},"a":"BCD","e":"B、C、D错误：成分不可割裂，应为“道德认识、道德情感、道德意志、道德行为”，思想基础是道德认识。"},{"k":"教育心理学|多选题|25","b":"教育心理学","t":"多选题","ty":"multiple","n":25,"q":"大学生中常见的自我认知问题主要有","o":{"A":"自卑","B":"自负","C":"虚荣","D":"抑郁"},"a":"ABC","e":"大学生常见的自我认知问题有自卑、自负、虚荣，抑郁属情绪问题。"},{"k":"教育心理学|多选题|26","b":"教育心理学","t":"多选题","ty":"multiple","n":26,"q":"我国学者认为，问题解决包括","o":{"A":"分析问题","B":"发现问题","C":"验证假设","D":"提出假设"},"a":"ABCD","e":"问题解决包括发现问题、分析问题、提出假设、验证假设。"},{"k":"教育心理学|多选题|27","b":"教育心理学","t":"多选题","ty":"multiple","n":27,"q":"心理发展的特征","o":{"A":"反映活动从混沌未分化向着分化、专门化演变；","B":"反映活动从不随意性、被动性向着随意性、主动性演变；","C":"从认识客体的外部现象向着认识事物的内部本质演变；","D":"对周围事物的态度从不稳定向着稳定演变；"},"a":"ABCD","e":"心理发展的特征包括由混沌向分化、由被动向主动、由外部现象向内部本质、态度由不稳定向稳定演变。"},{"k":"教育心理学|多选题|28","b":"教育心理学","t":"多选题","ty":"multiple","n":28,"q":"关于逆向搜索和手段-目的分析法，下列说法错误的是","o":{"A":"两者搜索方向相同","B":"当从初始状态出发有多种途径能够到达目标状态时，采用手段-目的分析较好","C":"当从初始状态出发可以引出许多途径却只有很少途径能够到达目标状态时，则采用逆向搜索较有效。","D":"适用范围无差异"},"a":"AD","e":"A、D错误：两者搜索方向相反、适用范围有差异；B、C正确。"},{"k":"教育心理学|多选题|29","b":"教育心理学","t":"多选题","ty":"multiple","n":29,"q":"下列属于表象的特性的是","o":{"A":"可操作性","B":"多通道性","C":"概括性","D":"直观性"},"a":"ABCD","e":"表象的特性有直观性、概括性、可操作性和多通道性。"},{"k":"教育心理学|多选题|30","b":"教育心理学","t":"多选题","ty":"multiple","n":30,"q":"关于品德和道德，下列说法正确的是","o":{"A":"道德的形成与发展受社会发展规律制约，有明显的社会历史性。","B":"品德的形成与发展不仅受社会制约，而且受个体的心理制约。","C":"从反映内容上看，道德反映的内容比品德反映的内容要广阔得多，概括得多。","D":"品德的内容则是社会道德规范局部的具体体现，是社会道德要求的部分反映。"},"a":"ABCD","e":"道德的形成受社会规律制约、品德受社会与个体心理双重制约、道德反映内容更广阔，A、B、C、D均正确。"},{"k":"教育心理学|多选题|31","b":"教育心理学","t":"多选题","ty":"multiple","n":31,"q":"关于科尔伯格道德发展理论，下列说法错误的是","o":{"A":"后习俗水平这一阶段已经发展到超越现实道德规范的约束，达到完全自律的境界。","B":"工具性的相对主义定向阶段属于前习俗水平。","C":"儿童处于前习俗水平这一时期的特征是，个人认识到团体的行为规范，进而接受并付诸实践","D":"前习俗水平这一时期又分为两个阶段：人际协调的定向阶段和维护权威或秩序的定向阶段"},"a":"CD","e":"C、D错误：前习俗水平的特征是服从与惩罚定向，其两阶段为惩罚服从定向和工具性相对主义定向。"},{"k":"教育心理学|多选题|32","b":"教育心理学","t":"多选题","ty":"multiple","n":32,"q":"大学生心理健康教育的方法与途径有","o":{"A":"开展心理健康教育","B":"优化大学生的成长环境","C":"建立心理咨询机构","D":"提高大学生的挫折耐受力"},"a":"ABCD","e":"心理健康教育的方法与途径包括开展心理健康教育、优化成长环境、建立心理咨询机构、提高挫折耐受力。"},{"k":"教育心理学|多选题|33","b":"教育心理学","t":"多选题","ty":"multiple","n":33,"q":"关于道德的描述，下列说法正确的是","o":{"A":"人们依据道德规范来辨别是非、善恶、美丑，指导或调节行为。","B":"从反映内容上看，道德反映的内容比品德反映的内容要广阔得多，概括得多。","C":"道德的内容是社会生活的总体要求，是对经济基础的反映，是调节社会关系的行为规范的完整体系。","D":"道德产生的力量源泉则是个人需要。"},"a":"ABC","e":"A、B、C正确；D错，道德产生的力量源泉是社会需要。"},{"k":"教育心理学|多选题|34","b":"教育心理学","t":"多选题","ty":"multiple","n":34,"q":"下列关于价值观的说法正确的是","o":{"A":"如果一个人不追求对社会贡献，只追求个人需要满足，把社会价值和个人价值对立起来，就不可能实现个人的自我价值","B":"是个人对于人生目的和意义的根本看法和态度，是一定的世界观在人生问题上的反映","C":"人的价值包括社会价值和自我价值","D":"价值观是人们以自身需要为尺度对事物重要性认识的观念系统"},"a":"ACD","e":"A、C、D正确；B描述的是人生观。"},{"k":"教育心理学|多选题|35","b":"教育心理学","t":"多选题","ty":"multiple","n":35,"q":"下列关于图式，说法正确的是","o":{"A":"是指外界客观物体的抽象类似物在人头脑中的再现形式。","B":"图式是围绕某一个主题组织起来的知识表征和贮存方式，是陈述性知识表征的整合单位。","C":"将获得知识以图式形式，围绕某一主题相互联系起来，形成一定的知识单元，将会有效地促进人对知识的存储和运用。","D":"是将具有线性特征的事物按照一定的顺序排列。"},"a":"BC","e":"B、C正确；A描述的是表象，D描述的是线性排序。"},{"k":"教育心理学|多选题|36","b":"教育心理学","t":"多选题","ty":"multiple","n":36,"q":"下列属于陈述性知识的表征方式是","o":{"A":"线性排序","B":"图式","C":"表象","D":"命题"},"a":"ABCD","e":"陈述性知识的表征方式有命题、表象、线性排序和图式。"},{"k":"教育心理学|多选题|37","b":"教育心理学","t":"多选题","ty":"multiple","n":37,"q":"影响遗忘的因素","o":{"A":"识记材料的性质和数量","B":"学习程度","C":"识记材料的系列位置","D":"时间因素"},"a":"ABCD","e":"影响遗忘的因素有识记材料的性质和数量、学习程度、系列位置和时间因素。"},{"k":"教育心理学|多选题|38","b":"教育心理学","t":"多选题","ty":"multiple","n":38,"q":"下列属于直觉思维起主要作用的是","o":{"A":"3岁前儿童只能在动作中思考问题","B":"魏格纳在看地图时突然闪现出“大陆漂移”的观念","C":"牛顿被落下的苹果砸中后突然产生了“万有引力”的想法","D":"聋哑人通过手势交往"},"a":"BC","e":"直觉思维起主要作用的是魏格纳的“大陆漂移”和牛顿的“万有引力”；A、D属直观动作思维。"},{"k":"教育心理学|多选题|39","b":"教育心理学","t":"多选题","ty":"multiple","n":39,"q":"下列属于影响大学生心理健康的个人因素中认知方面是","o":{"A":"遗传因素","B":"自我评价偏差","C":"神经系统的先天素质不健全","D":"存在不合理的认知方式和信念"},"a":"BD","e":"认知方面的个人因素包括自我评价偏差和不合理认知方式与信念；A、C属生理因素。"},{"k":"教育心理学|多选题|40","b":"教育心理学","t":"多选题","ty":"multiple","n":40,"q":"斯腾伯格在专家型教师原型观基础上，总结出专家型教师的基本特征","o":{"A":"迅速有效地发现学生存在的问题","B":"有丰富的组织化的专门知识，并能有效运用","C":"解决教学领域问题的高效","D":"创造性地解决问题，有很强的洞察力"},"a":"BCD","e":"斯腾伯格总结的专家型教师特征为：有丰富组织化的专门知识并能有效运用、解决教学问题高效、创造性解决问题并有很强洞察力。"},{"k":"教育心理学|多选题|41","b":"教育心理学","t":"多选题","ty":"multiple","n":41,"q":"以下属于图式的特征的是：","o":{"A":"图式有简单和复杂、抽象和具体、高级和低级之分。","B":"图式描述的是具有一定概括程度的知识，但不是定义。","C":"图式是在旧知识与新信息相互联系的基础上，通过“同化”与“顺应”而形成的，是经验的积极组织。","D":"图式不是事物的各个部分的简单相加，而是按照一定规律由各个部分构成的有机整体。"},"a":"ABCD","e":"图式的特征包括有简单复杂之分、是概括程度的知识而非定义、经同化顺应形成、是有机整体。"},{"k":"教育心理学|多选题|42","b":"教育心理学","t":"多选题","ty":"multiple","n":42,"q":"品德心理结构的特征有","o":{"A":"历时性与共时性","B":"稳定性与可变性","C":"复杂性","D":"整体性"},"a":"ABCD","e":"品德心理结构的特征有整体性、复杂性、稳定性与可变性、历时性与共时性。"},{"k":"教育心理学|多选题|43","b":"教育心理学","t":"多选题","ty":"multiple","n":43,"q":"教师的教育机智主要表现在以下哪几个方面","o":{"A":"善于掌握分寸","B":"善于对症下药","C":"善于随机应变","D":"善于因势利导"},"a":"ABCD","e":"教师的教育机智表现在善于因势利导、随机应变、对症下药、掌握分寸。"},{"k":"教育心理学|多选题|44","b":"教育心理学","t":"多选题","ty":"multiple","n":44,"q":"培养大学生良好自我意识的途径","o":{"A":"有效控制自我","B":"正确认识自我","C":"放纵自我","D":"积极悦纳自我"},"a":"ABD","e":"培养良好自我意识的途径有正确认识自我、积极悦纳自我、有效控制自我，“放纵自我”错误。"},{"k":"教育心理学|多选题|45","b":"教育心理学","t":"多选题","ty":"multiple","n":45,"q":"大学生自我意识发展的障碍有","o":{"A":"自我中心和从众心理","B":"过分的独立意识和过分的逆反心理","C":"过度的自我接受与过度的自我拒绝","D":"过强的自尊心与过重的自卑感"},"a":"ABCD","e":"大学生自我意识发展的障碍包括自我中心与从众、过分独立与过分逆反、过度自我接受与拒绝、过强自尊与过重自卑。"},{"k":"教育心理学|多选题|46","b":"教育心理学","t":"多选题","ty":"multiple","n":46,"q":"以下属于影响知识理解的因素有","o":{"A":"概念的关键特征。","B":"学习态度。","C":"材料的感性程度以及与经验的相关程度。","D":"新旧知识间的联系。"},"a":"ABCD","e":"影响知识理解的因素有关键特征、学习态度、材料感性程度与经验相关程度、新旧知识间联系。"},{"k":"教育心理学|多选题|47","b":"教育心理学","t":"多选题","ty":"multiple","n":47,"q":"安德森（J·Anderson，1990）和加涅（E·Gagneetal.，1993）等人认为，程序性知识的获得主要包括以下阶段：","o":{"A":"识记阶段","B":"自动化阶段","C":"陈述阶段","D":"联合阶段"},"a":"BCD","e":"程序性知识获得包括陈述阶段、联合阶段、自动化阶段，不含识记阶段。"},{"k":"教育心理学|多选题|48","b":"教育心理学","t":"多选题","ty":"multiple","n":48,"q":"大学生的心理健康包括以下方面","o":{"A":"情绪稳定，适应良好，有幸福感和成就感","B":"形成了优良的心理品质","C":"心智潜能得到了充分发挥","D":"具有反社会人格"},"a":"ABC","e":"大学生心理健康包括形成优良心理品质、心智潜能充分发挥、情绪稳定适应良好，“反社会人格”不属于。"},{"k":"教育心理学|多选题|49","b":"教育心理学","t":"多选题","ty":"multiple","n":49,"q":"教师反思的阶段","o":{"A":"具体经验阶段","B":"观察分析阶段","C":"重新概括阶段","D":"积极的验证阶段"},"a":"ABCD","e":"教师反思阶段包括具体经验、观察分析、重新概括和积极的验证阶段。"},{"k":"教育心理学|多选题|50","b":"教育心理学","t":"多选题","ty":"multiple","n":50,"q":"下列属于大学生的心理健康的八大特征是","o":{"A":"情绪健康","B":"智力正常","C":"社会适应良好","D":"自我意识正确"},"a":"ABCD","e":"心理健康的大学生具有智力正常、情绪健康、自我意识正确、社会适应良好等特征。"},{"k":"教育心理学|多选题|51","b":"教育心理学","t":"多选题","ty":"multiple","n":51,"q":"按照记忆的内容，可以将记忆分为","o":{"A":"形象记忆","B":"语词－逻辑记忆","C":"情绪记忆","D":"动作记忆"},"a":"ABCD","e":"按记忆内容可分为形象记忆、语词—逻辑记忆、情绪记忆和动作记忆。"},{"k":"教育心理学|多选题|52","b":"教育心理学","t":"多选题","ty":"multiple","n":52,"q":"借助于思维的间接性，人们可以通过已知来推断未知，主要表现为：","o":{"A":"它使人的认识能力突破了时空的限制。","B":"它使人能够超越感官的局限来认识事物、揭露事物的本质和规律","C":"反映事物之间的关系","D":"反映事物的本质属性或一类事物的共同特征"},"a":"AB","e":"使人突破时空限制、超越感官局限来认识事物，是思维间接性的表现；C、D属概括性。"},{"k":"教育心理学|多选题|53","b":"教育心理学","t":"多选题","ty":"multiple","n":53,"q":"弗勒和布朗根据教师的需要和不同时期关注的焦点，把教师成长划分为哪三个阶段","o":{"A":"关注生存阶段","B":"关注情境阶段","C":"关注学生阶段","D":"关注教学阶段"},"a":"ABC","e":"弗勒和布朗把教师成长划分为关注生存、关注情境、关注学生三个阶段。"},{"k":"教育心理学|多选题|54","b":"教育心理学","t":"多选题","ty":"multiple","n":54,"q":"下列做法可以提高大学生问题解决能力的是","o":{"A":"建立接纳意见的气氛","B":"鼓励大学生仔细地界定问题","C":"教给大学生分析问题的方法","D":"鼓励大学生多角度地提出假设"},"a":"ABCD","e":"提高问题解决能力应建立接纳意见的气氛、鼓励界定问题、教给分析方法、鼓励多角度提出假设。"},{"k":"教育心理学|多选题|55","b":"教育心理学","t":"多选题","ty":"multiple","n":55,"q":"下列属于创造性的特点是","o":{"A":"新颖性","B":"概括性","C":"独特性","D":"社会价值或个人价值"},"a":"ACD","e":"创造性的特点有新颖性、独特性以及具有社会价值或个人价值，不含概括性。"},{"k":"教育心理学|多选题|56","b":"教育心理学","t":"多选题","ty":"multiple","n":56,"q":"高校教师的角色冲突表现在哪几个方面","o":{"A":"在师生关系上，表现为“教育者”与“服务者”冲突","B":"在教师与高校行政管理部门的关系上，表现为“被服务者”与“被管理者”的冲突","C":"在教师与社会的关系上，体现为“引领者”与“被动适应者”的冲突","D":"在职业理想方面，存在着“志业”和“谋生”的冲突"},"a":"ABCD","e":"高校教师的角色冲突表现在“教育者”与“服务者”、“被服务者”与“被管理者”、“引领者”与“被动适应者”、“志业”与“谋生”四个方面。"},{"k":"教育心理学|多选题|57","b":"教育心理学","t":"多选题","ty":"multiple","n":57,"q":"大学生常见的心理冲突有","o":{"A":"适应心理问题","B":"性生理成熟与性心理相对幼稚的心理冲突","C":"交往与闭锁的心理冲突","D":"理想化和现实感的心理冲突"},"a":"BCD","e":"大学生常见的心理冲突包括交往与闭锁、理想化与现实感、性生理成熟与性心理幼稚的冲突，“适应心理问题”不属于。"},{"k":"教育心理学|多选题|58","b":"教育心理学","t":"多选题","ty":"multiple","n":58,"q":"对学习对象的理解分别有三个不同水平：","o":{"A":"一般水平的理解","B":"初级水平的理解","C":"中级水平的理解","D":"高级水平的理解"},"a":"BCD","e":"理解分为初级、中级、高级三个水平，无“一般水平”。"},{"k":"教育心理学|多选题|59","b":"教育心理学","t":"多选题","ty":"multiple","n":59,"q":"品德的心理成分","o":{"A":"道德意志","B":"道德行为","C":"道德认识","D":"道德情感"},"a":"ABCD","e":"品德的心理成分包括道德认识、道德情感、道德意志和道德行为。"},{"k":"教育心理学|多选题|60","b":"教育心理学","t":"多选题","ty":"multiple","n":60,"q":"关于心理健康的理解，下列说法正确的是","o":{"A":"心理健康是相对的","B":"心理健康是一种心理上和行为上的良好状态，是个人所能达到的最佳状态。","C":"心理健康的人能保持镇静的情绪、坚强的性格、较高的智能、适度的社会适应行为和愉快和谐的情绪。","D":"心理健康具有动态性"},"a":"ABCD","e":"心理健康是相对的、动态的，是个人所能达到的最佳状态，A、B、C、D均正确。"},{"k":"教育心理学|多选题|61","b":"教育心理学","t":"多选题","ty":"multiple","n":61,"q":"下列属于直观动作思维的是","o":{"A":"4岁前儿童只能在动作中思考问题","B":"在动手重新布置房间之前，我们会先利用头脑中各种装饰物和家具的形象考虑如何进行摆设，形成多种方案，再选择最佳方案。","C":"教室的多媒体投影仪坏了，技术人员一边检查相关部件，一边思索损坏原因，最后排除故障。","D":"聋哑人通过手势交往"},"a":"ACD","e":"直观动作思维指在动作中思考，A、C、D正确；B属具体形象思维。"},{"k":"教育心理学|多选题|62","b":"教育心理学","t":"多选题","ty":"multiple","n":62,"q":"教师扮演的角色对学生而言有不同作用，这些作用可以按感情因素排列，其中起消极作用的有","o":{"A":"侦探和纪律执行者","B":"替罪羊","C":"心理咨询和治疗学家","D":"家长的代理人"},"a":"AB","e":"按感情因素排列，起消极作用的是侦探和纪律执行者、替罪羊。"},{"k":"教育心理学|多选题|63","b":"教育心理学","t":"多选题","ty":"multiple","n":63,"q":"关于习惯化，下列说法不正确的是","o":{"A":"由于刺激重复使有机体对它的反应性增强，即有机体对环境中的某一特定刺激更容易作出反应。","B":"人的感受能力发生了变化","C":"感受能力和肌肉能力下降","D":"由于重复刺激引起的反应性下降，它涉及反应的减少，而不是新反应的习得。"},"a":"ABC","e":"A、B、C均是对习惯化的错误描述；D是习惯化的正确定义。"},{"k":"教育心理学|多选题|64","b":"教育心理学","t":"多选题","ty":"multiple","n":64,"q":"下列关于大学生的认知特征，说法正确的是","o":{"A":"思维发展处于成熟期","B":"创造力发展处于最佳期","C":"智力发展达到最佳水平","D":"记忆能力发展达到黄金期"},"a":"ABCD","e":"大学生认知特征表现为思维发展成熟、创造力发展处于最佳期、智力达到最佳水平、记忆发展处于黄金期。"},{"k":"教育心理学|多选题|65","b":"教育心理学","t":"多选题","ty":"multiple","n":65,"q":"关于品德和道德，下列说法正确的是","o":{"A":"道德是在个体身上的体现，是个人依据一定的社会道德准则和规范行动时所表现出的稳定的心理特征或倾向。","B":"品德是一种社会现象，是调整人们相互关系的各种行为规范和准则。","C":"品德支配和调节着个体的道德行为，属于个体意识的范畴。","D":"道德反映社会生活，它的产生、发展和变化服从于社会的发展规律，属于社会意识的范畴。"},"a":"CD","e":"C、D正确；A、B把道德与品德的含义说反了。"},{"k":"教育心理学|多选题|66","b":"教育心理学","t":"多选题","ty":"multiple","n":66,"q":"关于算法和启发法，下列说法正确的是","o":{"A":"启发式是个体根据已有的知识经验，在问题空间中进行较少的搜索，以达到解决问题的方法。","B":"算法不能保证问题一定能解决，但用这种方法解决问题省时省力。","C":"启发法的优点是保证能够解决问题，但有时需要大量的尝试，因而费时费力。","D":"算法是一种随机尝试式的问题解决策略。在问题空间中，搜索所有可能的解决问题方法，并逐一加以尝试，最终使问题得以解决。"},"a":"AD","e":"A、D正确：启发式靠已有经验进行较少搜索；算法是逐一尝试所有可能方案。"},{"k":"教育心理学|多选题|67","b":"教育心理学","t":"多选题","ty":"multiple","n":67,"q":"关于自负，下列说法正确的是","o":{"A":"自负往往通过语言、行为方式表现出来。","B":"自负必须建立在客观现实的基础之上。","C":"脱离实际的自负，不但不能帮助人成就事业，反而影响自己的生活、学习、工作和人际交往，严重的还会影响心理健康。","D":"对大学生而言，在适当的范围内，自负可以激发他们的斗志，树立必胜的信心，坚定战胜困难的信念，使他们勇往直前。"},"a":"ABCD","e":"自负可通过言行表现，须以客观现实为基础，适度可激发斗志，脱离实际则有害，A、B、C、D均正确。"},{"k":"教育心理学|多选题|68","b":"教育心理学","t":"多选题","ty":"multiple","n":68,"q":"下列说法正确的是","o":{"A":"道德技能的掌握有助于实现道德目的，它将指导人做出对他人和社会具有道德意义的事情。","B":"道德意志的作用就在于发动与既定目的相符的行动，制止与既定目的相悖的行动。","C":"道德信念的形成和道德评价能力的完善是衡量大学生道德认识成熟的主要标志。","D":"道德认识的形成是品德形成的客观标志。"},"a":"ABC","e":"A、B、C正确；D错，道德行为的形成（而非道德认识）才是品德形成的客观标志。"},{"k":"教育心理学|多选题|69","b":"教育心理学","t":"多选题","ty":"multiple","n":69,"q":"关于皮亚杰提出的儿童道德发展阶段，下列说法错误的是","o":{"A":"自律阶段的儿童已经不把规则看成是不可改变的，而是把它看作是同伴之间的共同约定，是可以改变的。","B":"他律阶段的儿童对外在权威表现出绝对尊敬和顺从的愿望。","C":"处在公正阶段的孩子，他们认为，服从、听话就是好孩子，否则就是坏孩子。","D":"处在权威阶段的儿童，他们的公正观念或正义感是在可逆的道德观念上发展起来。"},"a":"CD","e":"C、D错误：服从听话是权威（他律）阶段特征，公正观念在可逆的道德观念上发展属公正阶段。"},{"k":"教育心理学|多选题|70","b":"教育心理学","t":"多选题","ty":"multiple","n":70,"q":"道德认识是人的认知过程在品德上的表现，它的形成由以下层次构成：","o":{"A":"道德信念的产生","B":"道德判断的发展","C":"道德概念的形成","D":"道德知识的掌握"},"a":"ABCD","e":"道德认识的形成由道德知识的掌握、道德概念的形成、道德判断的发展和道德信念的产生四个层次构成。"},{"k":"教育心理学|多选题|71","b":"教育心理学","t":"多选题","ty":"multiple","n":71,"q":"根据思维任务的性质和解决问题的方式，可以将思维分为","o":{"A":"抽象逻辑思维","B":"分析思维","C":"直观动作思维","D":"具体形象思维"},"a":"ACD","e":"按思维任务的性质和解决问题的方式，思维分为直观动作思维、具体形象思维和抽象逻辑思维。"},{"k":"教育心理学|多选题|72","b":"教育心理学","t":"多选题","ty":"multiple","n":72,"q":"道德情感体验的获得对品德的形成和发展作用十分重要，主要表现在以下几个方面：","o":{"A":"移情是由道德认知引发道德行为的中介变量","B":"道德情感引发与支持道德行为","C":"道德情感深化道德认识","D":"道德情感是道德品质结构中的重要成分"},"a":"ABCD","e":"道德情感能深化道德认识、引发并支持道德行为、是品德结构的重要成分，移情是道德认知引发道德行为的中介变量。"},{"k":"教育心理学|多选题|73","b":"教育心理学","t":"多选题","ty":"multiple","n":73,"q":"大学生心理健康的自我维护方法有","o":{"A":"用积极心态对待外界事物，创造一个良好和谐的外部环境","B":"建立正确的自我认识，形成积极的自我概念","C":"正确看待压力","D":"坚持健康文明的生活方式"},"a":"ABCD","e":"心理健康自我维护方法包括用积极心态对待外界、建立正确自我认识、正确看待压力、坚持健康文明生活方式。"},{"k":"教育心理学|多选题|74","b":"教育心理学","t":"多选题","ty":"multiple","n":74,"q":"精神分析大师弗洛伊德提出了","o":{"A":"本我","B":"超我","C":"自我","D":"他人"},"a":"ABC","e":"弗洛伊德提出本我、自我、超我三个部分。"},{"k":"教育心理学|多选题|75","b":"教育心理学","t":"多选题","ty":"multiple","n":75,"q":"下列属于影响大学生心理健康的个人因素中生理方面是","o":{"A":"存在不合理的认知方式和信念","B":"神经系统的先天素质不健全","C":"自我评价偏差","D":"遗传因素"},"a":"BD","e":"生理方面因素包括遗传因素和神经系统的先天素质不健全；A、C属认知方面。"},{"k":"教育心理学|多选题|76","b":"教育心理学","t":"多选题","ty":"multiple","n":76,"q":"安德森（Anderson，1980）指出，问题解决有以下特征：","o":{"A":"操作序列","B":"目标指引","C":"得出答案","D":"认知操作"},"a":"ABD","e":"安德森指出问题解决具有目标指引、操作序列和认知操作三个特征。"},{"k":"教育心理学|多选题|77","b":"教育心理学","t":"多选题","ty":"multiple","n":77,"q":"心理健康与大学生关系重大，它的作用包括","o":{"A":"促进大学生独立发展","B":"促进大学生全面发展","C":"促进大学生个性完善","D":"促进大学生取得成功"},"a":"ABCD","e":"心理健康有助于大学生全面发展、独立发展、个性完善并促进取得成功。"},{"k":"教育心理学|多选题|78","b":"教育心理学","t":"多选题","ty":"multiple","n":78,"q":"关于逆向搜索和手段-目的分析法，下列说法正确的是","o":{"A":"两者搜索方向相同","B":"当从初始状态出发有多种途径能够到达目标状态时，采用手段-目的分析较好","C":"当从初始状态出发可以引出许多途径却只有很少途径能够到达目标状态时，则采用逆向搜索较有效。","D":"适用范围无差异"},"a":"BC","e":"B、C正确：两者方向相反，多途径时用手段—目的分析，少途径时用逆向搜索。"},{"k":"教育心理学|多选题|79","b":"教育心理学","t":"多选题","ty":"multiple","n":79,"q":"心理健康具有社会性是因为","o":{"A":"有相当多的人处于介于健康和不健康的状态中，称为“亚健康状态”。","B":"不同社会心理健康的标准也有不同。","C":"处于“亚健康状态”的人是心理障碍的易感人群。","D":"在一个社会中是健康的、可以接受的行为，在另一个社会中就属于不健康、不可接受甚至是犯罪的行为。"},"a":"BD","e":"心理健康具有社会性，因不同社会心理健康标准不同，同一行为在不同社会评价也不同；A、C说的是亚健康状态。"},{"k":"教育心理学|多选题|80","b":"教育心理学","t":"多选题","ty":"multiple","n":80,"q":"一般来说，思维的过程包括","o":{"A":"抽象与概括","B":"具体化与系统化","C":"分析与综合","D":"比较与分类"},"a":"ABCD","e":"思维的过程包括分析与综合、比较与分类、抽象与概括、具体化与系统化。"},{"k":"教育心理学|多选题|81","b":"教育心理学","t":"多选题","ty":"multiple","n":81,"q":"柯尔伯格把儿童的道德判断分为以下水平","o":{"A":"习俗水平","B":"后习俗水平","C":"自我中心水平","D":"前习俗水平"},"a":"ABD","e":"柯尔伯格把道德判断分为前习俗水平、习俗水平和后习俗水平。"},{"k":"教育心理学|多选题|82","b":"教育心理学","t":"多选题","ty":"multiple","n":82,"q":"关于程序性知识，下列说法正确的是","o":{"A":"大部分程序性知识都能够用语言来表述。","B":"能被人用语言来陈述和描述，是有关人所知道的事物状况的知识。","C":"程序性知识既可能涉及人们要完成一项任务所需要的运动技能，也可能涉及在一定条件下使用科学原理的认知技能。","D":"它是关于人怎样解决问题、如何去做某事的知识."},"a":"CD","e":"C、D正确；A、B描述的是陈述性知识。"},{"k":"教育心理学|多选题|83","b":"教育心理学","t":"多选题","ty":"multiple","n":83,"q":"美国教育心理学索里和特尔福德认为，教师应担负如下哪几种角色","o":{"A":"家长的代理人","B":"知识的传授者","C":"团体的领导","D":"模范公民"},"a":"ABCD","e":"索里和特尔福德认为教师应担负家长的代理人、知识的传授者、团体的领导、模范公民等角色。"},{"k":"教育心理学|多选题|84","b":"教育心理学","t":"多选题","ty":"multiple","n":84,"q":"心理健康具有相对性表现在","o":{"A":"心理健康不具有动态性","B":"心理健康与不健康没有绝对的分界","C":"不同地区社会心理健康有统一标准","D":"心理健康具有社会性"},"a":"BD","e":"B、D正确：心理健康与不健康没有绝对分界、具有社会性；A、C错误。","d":"D 项“心理健康具有社会性”讲的是社会性，与题干问的“相对性的表现”不完全对应，略显牵强。"},{"k":"教育心理学|多选题|85","b":"教育心理学","t":"多选题","ty":"multiple","n":85,"q":"教师反思的具体方法","o":{"A":"详细描述","B":"反思日记","C":"行动研究","D":"职业发展"},"a":"ABCD","e":"教师反思的具体方法有反思日记、详细描述、行动研究和职业发展。"},{"k":"教育心理学|多选题|86","b":"教育心理学","t":"多选题","ty":"multiple","n":86,"q":"关于发散思维的独特性，下列说法正确的是","o":{"A":"表现为发散的“新异”、“独到”。","B":"指思考方式变化多端，思维产品的种类不拘一格，能举一反三，触类旁通，随机应变，思维不受定势束缚，能产生多种多样的新观点。","C":"指对问题提出超乎寻常的、新颖的、独特的见解，即以前所未有的新观点、新角度去反映事物。","D":"它最能代表发散思维的本质，是最高层次的发散特征。"},"a":"ACD","e":"A、C、D是对发散思维独特性的正确描述；B描述的是变通性。"},{"k":"教育心理学|多选题|87","b":"教育心理学","t":"多选题","ty":"multiple","n":87,"q":"维果茨基的工具论认为，个体的两种工具是","o":{"A":"身体工具","B":"意识工具","C":"精神工具","D":"物质工具"},"a":"CD","e":"维果茨基认为个体的两种工具是物质工具和精神工具。"},{"k":"教育心理学|多选题|88","b":"教育心理学","t":"多选题","ty":"multiple","n":88,"q":"大学生的心理问题分为以下几个层次","o":{"A":"心理障碍","B":"心理疾病","C":"心理冲突","D":"心理变态"},"a":"ABC","e":"大学生心理问题分为心理冲突、心理障碍和心理疾病三个层次。"},{"k":"教育心理学|多选题|89","b":"教育心理学","t":"多选题","ty":"multiple","n":89,"q":"关于抽象与概括，下列说法正确的是","o":{"A":"抽象是概括的前提，没有抽象就无从概括。","B":"只有通过抽象与概括，才能逐步把握事物的本质与规律。","C":"抽象与概括相互依存、相辅相成。","D":"概括是抽象的发展。"},"a":"ABCD","e":"抽象是概括的前提，概括是抽象的发展，二者相互依存、相辅相成，是把握事物本质与规律的途径。"},{"k":"教育心理学|多选题|90","b":"教育心理学","t":"多选题","ty":"multiple","n":90,"q":"下列属于知识的正迁移的是","o":{"A":"一种学习使另一学习所需时间或所需练习次增加","B":"一种学习使另一学习具有了良好的心理准备状态","C":"已经具有的知识经验使学习者顺利地解决了面临的问题","D":"一种学习使另一学习活动所需时间或练习次数减少"},"a":"BCD","e":"B、C、D属正迁移；A是负迁移。"},{"k":"教育心理学|多选题|91","b":"教育心理学","t":"多选题","ty":"multiple","n":91,"q":"下列属于影响创造性的社会因素的是","o":{"A":"早期教育","B":"学校教育","C":"年龄","D":"人格"},"a":"AB","e":"影响创造性的社会因素包括早期教育和学校教育；年龄、人格属个体因素。"},{"k":"教育心理学|多选题|92","b":"教育心理学","t":"多选题","ty":"multiple","n":92,"q":"关于品德和道德，下列说法正确的是","o":{"A":"个体的品德对社会道德状况有一定的反作用。","B":"品德和道德是相辅相成、辩证统一的关系。","C":"品德是社会道德的个体化。","D":"社会道德风气影响品德的形成与发展。"},"a":"ABCD","e":"品德是社会道德的个体化，与社会道德相辅相成，且社会道德风气影响品德的形成与发展，A、B、C、D均正确。"},{"k":"教育心理学|多选题|93","b":"教育心理学","t":"多选题","ty":"multiple","n":93,"q":"大学生心理健康的自我维护方法有","o":{"A":"对青春期和性成熟状态的良好适应","B":"建立正确的自我认识，形成积极的自我概念","C":"合理宣泄情绪","D":"坚持健康文明的生活方式"},"a":"ABCD","e":"心理健康自我维护方法包括建立正确自我认识、合理宣泄情绪、坚持健康文明生活方式、对青春期和性成熟状态的良好适应。"},{"k":"教育心理学|多选题|94","b":"教育心理学","t":"多选题","ty":"multiple","n":94,"q":"下列属于道德情感的表现","o":{"A":"集体主义情感","B":"爱国主义情感","C":"道德评价","D":"道德信念"},"a":"AB","e":"道德情感的表现有集体主义情感、爱国主义情感等；道德评价、道德信念不属于情感表现。"},{"k":"教育心理学|多选题|95","b":"教育心理学","t":"多选题","ty":"multiple","n":95,"q":"影响程序性知识形成的因素是：","o":{"A":"足够的练习","B":"合并小程序，形成大程序","C":"技能或前提技能的自动化","D":"完整的陈述性知识"},"a":"ABCD","e":"影响程序性知识形成的因素有足够的练习、合并小程序形成大程序、技能的自动化、完整的陈述性知识。"},{"k":"教育心理学|多选题|96","b":"教育心理学","t":"多选题","ty":"multiple","n":96,"q":"麦克因泰等人认为，教师在教学活动中扮演什么样的角色","o":{"A":"组织者的角色","B":"交流者的角色","C":"激发者的角色","D":"管理者的角色"},"a":"ABCD","e":"麦克因泰等人认为教师在教学中扮演组织者、交流者、激发者和管理者的角色。"},{"k":"教育心理学|多选题|97","b":"教育心理学","t":"多选题","ty":"multiple","n":97,"q":"关于皮亚杰提出的儿童道德发展阶段，下列说法正确的是","o":{"A":"自律阶段的儿童已经不把规则看成是不可改变的，而是把它看作是同伴之间的共同约定，是可以改变的。","B":"他律阶段的儿童对外在权威表现出绝对尊敬和顺从的愿望。","C":"处在公正阶段的孩子，他们认为，服从、听话就是好孩子，否则就是坏孩子。","D":"处在权威阶段的儿童，他们的公正观念或正义感是在可逆的道德观念上发展起来。"},"a":"AB","e":"A、B正确；C、D错误，服从听话属权威阶段，公正观念在可逆道德观念上发展属公正阶段。"},{"k":"教育心理学|多选题|98","b":"教育心理学","t":"多选题","ty":"multiple","n":98,"q":"下列属于程序性知识的是","o":{"A":"礼尚往来","B":"滴水之恩，当涌泉相报","C":"以牙还牙","D":"投桃报李"},"a":"ABCD","e":"“礼尚往来、滴水之恩当涌泉相报、以牙还牙、投桃报李”都是关于如何行动的知识，属程序性知识。"},{"k":"教育心理学|多选题|99","b":"教育心理学","t":"多选题","ty":"multiple","n":99,"q":"班杜拉把观察学习分为以下几个过程：","o":{"A":"注意过程","B":"保持过程","C":"复制过程","D":"动机过程"},"a":"ABCD","e":"班杜拉把观察学习分为注意过程、保持过程、复制过程和动机过程。"},{"k":"教育心理学|多选题|100","b":"教育心理学","t":"多选题","ty":"multiple","n":100,"q":"皮亚杰和柯尔伯格的研究成果，对学校德育有以下启发意义","o":{"A":"道德判断水平的高低对道德行为选择有重要制约作用。","B":"道德认识水平的提高与思维水平的提高平行。","C":"道德认识的发展是循序渐进的","D":"要以道德伦理说教来达到教育目标"},"a":"ABC","e":"A、B、C正确；D错，不能只靠道德伦理说教来达成德育目标。"},{"k":"教育心理学|多选题|101","b":"教育心理学","t":"多选题","ty":"multiple","n":101,"q":"关于学习，以下说法正确的是","o":{"A":"学习只存在于人类的活动中，动物不存在学习。","B":"学习的发生以行为和行为潜能的改变为标志。","C":"动物和人类都可以进行学习。","D":"心理学中的学习是指个体在生活中由于经验而产生的行为或行为潜能的比较持久的变化。"},"a":"BCD","e":"B、C、D正确；A错，动物也存在学习。"},{"k":"教育心理学|多选题|102","b":"教育心理学","t":"多选题","ty":"multiple","n":102,"q":"高等教育心理学有如下任务","o":{"A":"描述高校教师和学生的心理现象","B":"揭示高校教师和学生的心理规律","C":"预测高校教师和学生的行为","D":"为高等教育实践提供指导"},"a":"ABCD","e":"高等教育心理学的任务包括描述师生心理现象、揭示心理规律、预测行为、为高等教育实践提供指导。"},{"k":"教育心理学|多选题|103","b":"教育心理学","t":"多选题","ty":"multiple","n":103,"q":"一般说来，创造思维有以下特征","o":{"A":"具有重要的社会价值","B":"新颖性","C":"敏锐性","D":"首创性"},"a":"ABCD","e":"创造思维的特征有新颖性、首创性、敏锐性和具有重要社会价值。"},{"k":"教育心理学|多选题|104","b":"教育心理学","t":"多选题","ty":"multiple","n":104,"q":"下列属于影响创造性的个体因素的是","o":{"A":"人格","B":"年龄","C":"学校教育","D":"早期教育"},"a":"AB","e":"影响创造性的个体因素有人格和年龄；学校教育、早期教育属社会因素。"},{"k":"教育心理学|多选题|105","b":"教育心理学","t":"多选题","ty":"multiple","n":105,"q":"吉尔福特认为，发散思维有以下特点","o":{"A":"流畅性","B":"概括性","C":"变通性","D":"独特性"},"a":"ACD","e":"吉尔福特认为发散思维具有流畅性、变通性和独特性，不含概括性。"},{"k":"教育心理学|多选题|106","b":"教育心理学","t":"多选题","ty":"multiple","n":106,"q":"促进知识迁移的条件有","o":{"A":"定势的作用","B":"知识经验的概括水平","C":"对材料的理解程度","D":"学习材料之间的共同因素"},"a":"ABCD","e":"促进知识迁移的条件有定势的作用、知识经验的概括水平、对材料的理解程度、学习材料之间的共同因素。"},{"k":"教育心理学|多选题|107","b":"教育心理学","t":"多选题","ty":"multiple","n":107,"q":"教师职业角色压力主要来源于","o":{"A":"角色超载","B":"角色冲突","C":"角色不清","D":"角色混乱"},"a":"AB","e":"教师职业角色压力主要来源于角色超载和角色冲突。"},{"k":"教育心理学|多选题|108","b":"教育心理学","t":"多选题","ty":"multiple","n":108,"q":"下列属于一级强化物的是","o":{"A":"娱乐","B":"食物","C":"安全","D":"钱"},"a":"BC","e":"一级强化物直接满足生理需要，如食物、安全；娱乐和钱属二级强化物。"},{"k":"教育心理学|多选题|109","b":"教育心理学","t":"多选题","ty":"multiple","n":109,"q":"赫尔巴特认为，学习过程可以分为以下阶段：","o":{"A":"感觉阶段","B":"记忆阶段","C":"理解阶段","D":"遗忘阶段"},"a":"ABC","e":"赫尔巴特把学习过程分为感觉阶段、记忆阶段和理解阶段，不含遗忘阶段。"},{"k":"教育心理学|判断题|1","b":"教育心理学","t":"判断题","ty":"judge","n":1,"q":"空气属于一级强化物，而钱属于二级强化物。","o":null,"a":"对","e":"一级强化物直接满足生理需要（空气、食物），钱属二级强化物。"},{"k":"教育心理学|判断题|2","b":"教育心理学","t":"判断题","ty":"judge","n":2,"q":"从教师的职业要求来看，成熟的教师应具备以下的人格特征：成熟的自我意识、崇高的品德和正确的人生观、有职业特色的需要、兴趣和价值观、富有创新精神和良好的性格","o":null,"a":"对","e":"成熟教师应具备成熟的自我意识、崇高品德、有职业特色的需要兴趣价值观、创新精神和良好性格。"},{"k":"教育心理学|判断题|3","b":"教育心理学","t":"判断题","ty":"judge","n":3,"q":"学习者通过学习的各个阶段而不断进步","o":null,"a":"对","e":"学习是一个由低到高、通过各个阶段不断进步的过程。"},{"k":"教育心理学|判断题|4","b":"教育心理学","t":"判断题","ty":"judge","n":4,"q":"心理学家所讲的关键期是指，人或动物的某些行为与能力发展的某一段时间，如果此时给以适当的良性刺激，会促使行为与能力得到更好的发展；反之，则会阻碍发展甚至导致行为与能力的缺失。","o":null,"a":"对","e":"关键期是行为与能力发展的敏感期，良性刺激促进发展，缺失则阻碍发展。"},{"k":"教育心理学|判断题|5","b":"教育心理学","t":"判断题","ty":"judge","n":5,"q":"维果茨基的工具论认为，个体有两种工具：一是物质工具，二是精神工具。","o":null,"a":"对","e":"维果茨基认为个体有物质工具与精神工具两种工具。"},{"k":"教育心理学|判断题|6","b":"教育心理学","t":"判断题","ty":"judge","n":6,"q":"男性在成功的情境下多做外部归因，在失败的情境下多做内部归因","o":null,"a":"错","e":"恰好相反：成功时多作内部归因，失败时多作外部归因。"},{"k":"教育心理学|判断题|7","b":"教育心理学","t":"判断题","ty":"judge","n":7,"q":"需要、动机、行为和目标（包括诱因）是激励的四大基本要素，在管理中是激励的着眼点","o":null,"a":"对","e":"需要、动机、行为和目标（含诱因）是激励的四大基本要素。"},{"k":"教育心理学|判断题|8","b":"教育心理学","t":"判断题","ty":"judge","n":8,"q":"完型-顿悟说属于格式塔学派的观点。","o":null,"a":"对","e":"完型—顿悟说属格式塔学派（苛勒）的观点。"},{"k":"教育心理学|判断题|9","b":"教育心理学","t":"判断题","ty":"judge","n":9,"q":"皮连生将认知目标分为3类：陈述性知识，智慧技能和认知策略。","o":null,"a":"对","e":"皮连生把认知目标分为陈述性知识、智慧技能和认知策略三类。"},{"k":"教育心理学|判断题|10","b":"教育心理学","t":"判断题","ty":"judge","n":10,"q":"教师威信的维护和发展，通常取决于以下几个方面：教师要有坦荡的胸怀，实事求是的态度、教师要正确认识、合理运用自己的威信、教师要有不断进取的敬业精神以及教师要言行一致，做学生的楷模","o":null,"a":"对","e":"教师威信的维护需坦荡胸怀、正确认识与运用威信、敬业精神、言行一致。"},{"k":"教育心理学|判断题|11","b":"教育心理学","t":"判断题","ty":"judge","n":11,"q":"习惯化由于刺激重复使有机体对它的反应性增强，即有机体对环境中的某一特定刺激更容易作出反应。","o":null,"a":"错","e":"习惯化是反应性下降，题干描述的是敏感化。"},{"k":"教育心理学|判断题|12","b":"教育心理学","t":"判断题","ty":"judge","n":12,"q":"教师是一个角色丛，各种角色的角色规范不一致，就会造成角色冲突","o":null,"a":"对","e":"教师是角色丛，各角色规范不一致就会造成角色冲突。"},{"k":"教育心理学|判断题|13","b":"教育心理学","t":"判断题","ty":"judge","n":13,"q":"教师给学生的第一印象对教师威信的获得有较大影响","o":null,"a":"对","e":"教师给学生的第一印象对威信获得有较大影响。"},{"k":"教育心理学|判断题|14","b":"教育心理学","t":"判断题","ty":"judge","n":14,"q":"一般来说，群体中地位低的人不易出现从众行为，地位高的人容易出现从众行为","o":null,"a":"错","e":"恰好相反：地位低的人更易从众，地位高的人不易从众。"},{"k":"教育心理学|判断题|15","b":"教育心理学","t":"判断题","ty":"judge","n":15,"q":"生涯彩虹图描绘出生涯发展阶段与角色彼此间交互影响、多重角色生涯发展的状况","o":null,"a":"对","e":"生涯彩虹图表现生涯发展阶段与多重角色交互影响、多重角色生涯发展的状况。"},{"k":"教育心理学|判断题|16","b":"教育心理学","t":"判断题","ty":"judge","n":16,"q":"埃里克森认为，人格发展包括了机体成熟、自我成长和社会关系这三个不可分割的过程。","o":null,"a":"对","e":"埃里克森认为人格发展含机体成熟、自我成长和社会关系三个不可分割的过程。"},{"k":"教育心理学|判断题|17","b":"教育心理学","t":"判断题","ty":"judge","n":17,"q":"挫折反应的个体差异，由以下因素引起：个体的抱负水平、个体的挫折耐受力和个体对挫折的经验","o":null,"a":"对","e":"挫折反应的个体差异由抱负水平、挫折耐受力与挫折经验引起。"},{"k":"教育心理学|判断题|18","b":"教育心理学","t":"判断题","ty":"judge","n":18,"q":"教育和教学是高校教师的主要活动","o":null,"a":"对","e":"教育和教学是高校教师的主要活动。"},{"k":"教育心理学|判断题|19","b":"教育心理学","t":"判断题","ty":"judge","n":19,"q":"人际交往的基本原则有交互性原则、自我价值保护原则和情境控制原则","o":null,"a":"对","e":"人际交往基本原则有交互性原则、自我价值保护原则和情境控制原则。"},{"k":"教育心理学|判断题|20","b":"教育心理学","t":"判断题","ty":"judge","n":20,"q":"艾宾浩斯遗忘曲线揭示了遗忘的规律。即，遗忘的进程不是均衡的，在学习之后立即开始，而且进展很快，以后就逐渐变慢。到了一定时间以后，几乎就不再遗忘了。","o":null,"a":"对","e":"艾宾浩斯遗忘曲线表明遗忘进程不均衡，先快后慢。"},{"k":"教育心理学|判断题|21","b":"教育心理学","t":"判断题","ty":"judge","n":21,"q":"提高教学监控能力的技术有：角色改变、教学反馈和现场指导","o":null,"a":"对","e":"提高教学监控能力的技术有角色改变、教学反馈和现场指导。"},{"k":"教育心理学|判断题|22","b":"教育心理学","t":"判断题","ty":"judge","n":22,"q":"加德纳认为就智力的结构而言，智力不是某种能力或围绕某种能力的几种能力的整合，而是由相对独立、相互平等的八种智力构成","o":null,"a":"对","e":"加德纳认为智力由相对独立、相互平等的八种智力构成。"},{"k":"教育心理学|判断题|23","b":"教育心理学","t":"判断题","ty":"judge","n":23,"q":"气质与人的道德品质、智力发展和成就高低有直接的联系。","o":null,"a":"错","e":"气质无好坏之分，与道德品质、智力发展和成就高低没有直接联系。"},{"k":"教育心理学|判断题|24","b":"教育心理学","t":"判断题","ty":"judge","n":24,"q":"教师知识越多，教学效果越好","o":null,"a":"错","e":"教师知识多不等于教学效果好，还取决于教学能力与方法等因素。"},{"k":"教育心理学|判断题|25","b":"教育心理学","t":"判断题","ty":"judge","n":25,"q":"在新的形势下，对大学生进行相应的就业指导工作已迫在眉睫。","o":null,"a":"对","e":"新形势下开展大学生就业指导工作已迫在眉睫。"},{"k":"教育心理学|判断题|26","b":"教育心理学","t":"判断题","ty":"judge","n":26,"q":"人格的基本特征包括：独特性、稳定性、整体性、社会性和功能性","o":null,"a":"对","e":"人格的基本特征是独特性、稳定性、整体性、社会性和功能性。"},{"k":"教育心理学|判断题|27","b":"教育心理学","t":"判断题","ty":"judge","n":27,"q":"教师扮演的角色对学生而言有不同作用，这些作用可以按感情因素排列，其中起支持作用的有心理咨询和治疗学家与学生的朋友和知己","o":null,"a":"对","e":"按感情因素排列，心理咨询和治疗学家、学生的朋友和知己起支持作用。"},{"k":"教育心理学|判断题|28","b":"教育心理学","t":"判断题","ty":"judge","n":28,"q":"由于人的遗传素质不同，生活环境不同，所受的教育不同，从事的实践活动也不同，所处的社会地位不同，因而也形成了各不相同的心理特点。","o":null,"a":"对","e":"遗传、环境、教育、实践和社会地位的差异形成了各不相同的心理特点。"},{"k":"教育心理学|判断题|29","b":"教育心理学","t":"判断题","ty":"judge","n":29,"q":"激励，一般指一个有机体在追求某些既定目标时的意愿程度。它含有引起需要、激发动机、鼓励行为、形成动力的意义。","o":null,"a":"对","e":"激励指追求既定目标时的意愿程度，含引起需要、激发动机、鼓励行为、形成动力。"},{"k":"教育心理学|判断题|30","b":"教育心理学","t":"判断题","ty":"judge","n":30,"q":"心理学中的学习是指个体在生活中由于经验而产生的行为或行为潜能的比较持久的变化。","o":null,"a":"对","e":"学习是个体因经验引起的行为或行为潜能的比较持久的变化。"},{"k":"教育心理学|判断题|31","b":"教育心理学","t":"判断题","ty":"judge","n":31,"q":"群体内大多数成员的意见会产生一种无形的力量，使群体内的每一成员自觉或不自觉地保持与大多数人的一致性，这就是群体压力。","o":null,"a":"对","e":"群体压力使成员自觉或不自觉与多数人保持一致。"},{"k":"教育心理学|判断题|32","b":"教育心理学","t":"判断题","ty":"judge","n":32,"q":"一般而言，高校就业系统的主要职能部门是学校就业指导中心","o":null,"a":"对","e":"高校就业系统的主要职能部门是学校就业指导中心。"},{"k":"教育心理学|判断题|33","b":"教育心理学","t":"判断题","ty":"judge","n":33,"q":"对集体成员来说，个体目标必须与整体目标一致，当整体目标和个体目标发生矛盾时，应以集体目标为重，修正个人目标。","o":null,"a":"对","e":"整体目标与个体目标矛盾时应以集体目标为重，修正个人目标。"},{"k":"教育心理学|判断题|34","b":"教育心理学","t":"判断题","ty":"judge","n":34,"q":"事物的外形、颜色、所能发出的声音特征、乃至闻起来或吃起来的味道都是属于形象记忆。","o":null,"a":"对","e":"事物的外形、颜色、声音、味道等在头脑中的再现属形象记忆。"},{"k":"教育心理学|判断题|35","b":"教育心理学","t":"判断题","ty":"judge","n":35,"q":"大学生中常见的自我认知问题主要有自卑、自负、虚荣和抑郁。","o":null,"a":"错","e":"大学生的自我认知问题是自卑、自负、虚荣，抑郁属情绪问题。"},{"k":"教育心理学|判断题|36","b":"教育心理学","t":"判断题","ty":"judge","n":36,"q":"描述性的研究方法可以揭示出两个变量之间的因果关系和相关关系","o":null,"a":"错","e":"描述性研究只能揭示相关关系，不能确定因果关系。"},{"k":"教育心理学|判断题|37","b":"教育心理学","t":"判断题","ty":"judge","n":37,"q":"卡特尔认为流体智力随着生理的成长而变化，随着机体的衰老而减退。","o":null,"a":"对","e":"卡特尔认为流体智力随生理成长而变化、随机体衰老而减退。"},{"k":"教育心理学|判断题|38","b":"教育心理学","t":"判断题","ty":"judge","n":38,"q":"轻微的嫉妒叫羡慕，它对人的行为有积极的推动作用，促使个体通过增加努力去参与竞争。","o":null,"a":"对","e":"轻微的嫉妒即羡慕，可推动个体努力参与竞争。"},{"k":"教育心理学|判断题|39","b":"教育心理学","t":"判断题","ty":"judge","n":39,"q":"集体规范的作用都是积极的","o":null,"a":"错","e":"集体规范的作用既有积极也有消极，并非都是积极的。"},{"k":"教育心理学|判断题|40","b":"教育心理学","t":"判断题","ty":"judge","n":40,"q":"建构主义的教学观强调自下而上的教学，而非自上而下的教学。","o":null,"a":"错","e":"建构主义强调自上而下的教学（先整体后部分）。"},{"k":"教育心理学|判断题|41","b":"教育心理学","t":"判断题","ty":"judge","n":41,"q":"可以说，离开了社会道德，品德也就无从谈起。","o":null,"a":"对","e":"品德是社会道德在个体身上的体现，离开社会道德就无从谈起。"},{"k":"教育心理学|判断题|42","b":"教育心理学","t":"判断题","ty":"judge","n":42,"q":"目标设置理论认为如果能力和目标的可接受性不变，目标越困难，绩效水平越高","o":null,"a":"对","e":"目标设置理论认为能力与目标可接受性不变时，目标越困难绩效越高。"},{"k":"教育心理学|判断题|43","b":"教育心理学","t":"判断题","ty":"judge","n":43,"q":"非正式群体对正式群体的影响都是积极的","o":null,"a":"错","e":"非正式群体的影响既有积极也有消极，并非都是积极的。"},{"k":"教育心理学|判断题|44","b":"教育心理学","t":"判断题","ty":"judge","n":44,"q":"大学生的情绪比中学生稳定。中学生的情绪往往受制于外部刺激，较少有情绪累积；大学生则有更稳定、更深刻的情绪","o":null,"a":"对","e":"大学生情绪比中学生更稳定、更深刻。"},{"k":"教育心理学|判断题|45","b":"教育心理学","t":"判断题","ty":"judge","n":45,"q":"习惯化是指由于重复刺激引起的反应性下降，它涉及反应的减少，而不是新反应的习得。","o":null,"a":"对","e":"习惯化是重复刺激引起的反应性下降，涉及反应的减少。"},{"k":"教育心理学|判断题|46","b":"教育心理学","t":"判断题","ty":"judge","n":46,"q":"维持一定的教学秩序是有效教学的前提","o":null,"a":"对","e":"维持一定的教学秩序是有效教学的前提。"},{"k":"教育心理学|判断题|47","b":"教育心理学","t":"判断题","ty":"judge","n":47,"q":"气质与性格的区别表现为：气质更多地受个体高级神经活动类型的制约，主要是先天的；性格更多地受社会生活条件的制约，主要是后天的；气质与性格的发生发展也并不总是同步的。","o":null,"a":"对","e":"气质主要受高级神经活动类型制约（先天），性格主要受社会生活条件制约（后天）。"},{"k":"教育心理学|判断题|48","b":"教育心理学","t":"判断题","ty":"judge","n":48,"q":"在大学生活中产生不公平现象的主要原因有：错误的攀比心理、奖励制度本身的不完善和工作者的不公正","o":null,"a":"对","e":"不公平感主要源于错误的攀比心理、奖励制度不完善和工作者不公正。"},{"k":"教育心理学|判断题|49","b":"教育心理学","t":"判断题","ty":"judge","n":49,"q":"匿名因素是产生去个性化现象的诱因","o":null,"a":"对","e":"匿名是产生去个性化现象的诱因。"},{"k":"教育心理学|判断题|50","b":"教育心理学","t":"判断题","ty":"judge","n":50,"q":"通过概括，反映事物的本质属性或一类事物的共同特征和事物之间的关系。","o":null,"a":"对","e":"概括反映事物的本质属性、一类事物的共同特征和事物之间的关系。"},{"k":"教育心理学|判断题|51","b":"教育心理学","t":"判断题","ty":"judge","n":51,"q":"主体性教学评价不仅关注结果，更加重视过程","o":null,"a":"对","e":"主体性教学评价既关注结果，更重视过程。"},{"k":"教育心理学|判断题|52","b":"教育心理学","t":"判断题","ty":"judge","n":52,"q":"皮连生将广义的教学过程概括为六个环节：陈述目标、分析任务、确定学生的原有水平、课堂教学活动设计、师生的相互作用过程和教学评价","o":null,"a":"对","e":"皮连生把广义教学过程概括为陈述目标、分析任务、确定原有水平、课堂教学设计、师生相互作用和教学评价六环节。"},{"k":"教育心理学|判断题|53","b":"教育心理学","t":"判断题","ty":"judge","n":53,"q":"在评定气质时，不能认为一种气质类型就是好的、积极的，另一种气质类型就是差的、消极的。","o":null,"a":"对","e":"评定气质时不能认为某一种气质类型是好的或差的。"},{"k":"教育心理学|判断题|54","b":"教育心理学","t":"判断题","ty":"judge","n":54,"q":"斯卡尔等人指出“遗传－环境－行为表现”的关系随着个体年龄发展而变化，并具体表现为被动式、唤起式和主动式三种形式","o":null,"a":"对","e":"斯卡尔等指出遗传—环境—行为表现的关系随年龄变化，表现为被动式、唤起式和主动式三种形式。"},{"k":"教育心理学|判断题|55","b":"教育心理学","t":"判断题","ty":"judge","n":55,"q":"根据心理异常的严重程度，我们将大学生的心理问题分为心理冲突、心理障碍、心理疾病三个层次。","o":null,"a":"对","e":"按严重程度，大学生心理问题分为心理冲突、心理障碍、心理疾病三个层次。"},{"k":"教育心理学|判断题|56","b":"教育心理学","t":"判断题","ty":"judge","n":56,"q":"美国心理学家布鲁姆将认知领域的教学目标分为知识、领会、运用、分析、综合和评价。","o":null,"a":"对","e":"布鲁姆把认知领域教学目标分为知识、领会、运用、分析、综合和评价。"},{"k":"教育心理学|判断题|57","b":"教育心理学","t":"判断题","ty":"judge","n":57,"q":"高校教师的角色冲突表现在以下四个方面：在师生关系上，表现为“教育者”与“服务者”冲突；在教师与高校行政管理部门的关系上，表现为“被服务者”与“被管理者”的冲突；在教师与社会的关系上，体现为“引领者”与“被动适应者”的冲突和在职业理想方面，存在着“志业”和“谋生”的冲突。","o":null,"a":"对","e":"高校教师角色冲突表现于师生关系、与行政管理部门、与社会关系及职业理想四方面。"},{"k":"教育心理学|判断题|58","b":"教育心理学","t":"判断题","ty":"judge","n":58,"q":"就业指导是高校的一项重要工作。","o":null,"a":"对","e":"就业指导是高校的一项重要工作。"},{"k":"教育心理学|判断题|59","b":"教育心理学","t":"判断题","ty":"judge","n":59,"q":"布朗芬布伦纳将个体置于五个环境系统中进行考察。这五个系统分别为：微系统、外系统、中介系统、宏系统和时序系统","o":null,"a":"对","e":"布朗芬布伦纳提出微系统、中介系统、外系统、宏系统和时序系统五个环境系统。"},{"k":"教育心理学|判断题|60","b":"教育心理学","t":"判断题","ty":"judge","n":60,"q":"动机由需要转化而来，但两者之间仍有严格的区分。需要是行为积极性的源泉，动机是行为的直接原因。","o":null,"a":"对","e":"需要是行为积极性的源泉，动机是行为的直接原因，二者有严格区分。"},{"k":"教育心理学|判断题|61","b":"教育心理学","t":"判断题","ty":"judge","n":61,"q":"马斯洛认为，人的需要是由以下五个等级构成，它们分别是生理需要、安全需要、爱与归属的需要、尊重的需要和自我实现的需要","o":null,"a":"对","e":"马斯洛需要层次为生理、安全、爱与归属、尊重和自我实现五级。"},{"k":"教育心理学|判断题|62","b":"教育心理学","t":"判断题","ty":"judge","n":62,"q":"陈述性知识在人的头脑中是以“产生式”的形式表征的；而程序性知识是以命题、表象、图示和线性排序的方式表征的。","o":null,"a":"错","e":"说反了：陈述性知识以命题、表象、图式和线性排序表征，程序性知识以产生式表征。"},{"k":"教育心理学|判断题|63","b":"教育心理学","t":"判断题","ty":"judge","n":63,"q":"就业指导的总目标是协助大学生做出职业选择，解决就业问题。","o":null,"a":"对","e":"就业指导的总目标是协助大学生做出职业选择、解决就业问题。"},{"k":"教育心理学|判断题|64","b":"教育心理学","t":"判断题","ty":"judge","n":64,"q":"德瑞福斯根据教师教学专长的一般过程，将教师成长划分为五个阶段：新手阶段、优秀新手阶段、胜任阶段、熟练阶段和专家阶段","o":null,"a":"对","e":"德瑞福斯把教师成长分为新手、优秀新手、胜任、熟练和专家五个阶段。"},{"k":"教育心理学|判断题|65","b":"教育心理学","t":"判断题","ty":"judge","n":65,"q":"了解品德心理结构的历时性与共时性这一特征，则在品德教育与培养中，应根据学生年龄阶段特点和品德结构发展状况有侧重地进行品德的培养与教育。","o":null,"a":"对","e":"依据品德心理结构的历时性与共时性，应按年龄阶段特点有侧重地培养品德。"},{"k":"教育心理学|判断题|66","b":"教育心理学","t":"判断题","ty":"judge","n":66,"q":"“一朝被蛇咬，十年怕井绳”，“十个电工，九个兔子胆”，都属于敏感化。","o":null,"a":"对","e":"“一朝被蛇咬，十年怕井绳”等体现的是敏感化（反应性增强）。"},{"k":"教育心理学|判断题|67","b":"教育心理学","t":"判断题","ty":"judge","n":67,"q":"如何引导大学生到合适的地区、行业和岗位上去，从而实现人尽其才、才尽其用，是就业指导的重要任务。","o":null,"a":"对","e":"引导大学生到合适地区、行业和岗位，实现人尽其才，是就业指导的重要任务。"},{"k":"教育心理学|判断题|68","b":"教育心理学","t":"判断题","ty":"judge","n":68,"q":"麦克利兰测量成就动机的方法是投射测验","o":null,"a":"对","e":"麦克利兰用投射测验测量成就动机。"},{"k":"教育心理学|判断题|69","b":"教育心理学","t":"判断题","ty":"judge","n":69,"q":"物质需要只包括生理需要，不包含社会需要。","o":null,"a":"错","e":"物质需要既含生理需要也含社会性的物质需要，并非只含生理需要。"},{"k":"教育心理学|判断题|70","b":"教育心理学","t":"判断题","ty":"judge","n":70,"q":"职业生涯规划一般可划分成长期、探索期、建立期、维持期和衰退期五个时期。","o":null,"a":"对","e":"职业生涯规划分为长期、探索期、建立期、维持期和衰退期五个时期。"},{"k":"教育心理学|判断题|71","b":"教育心理学","t":"判断题","ty":"judge","n":71,"q":"挫折行为的表现特征主要有攻击、退化和妥协。这些表现通常以综合的形式出现。","o":null,"a":"对","e":"挫折行为表现为攻击、退化和妥协，通常以综合形式出现。"},{"k":"教育心理学|判断题|72","b":"教育心理学","t":"判断题","ty":"judge","n":72,"q":"“医生虽然不能直接看到病毒对人体的侵袭，但根据对病人的各项检查结果和已有经验，就能诊断病情”这句话描述的是思维的创造性。","o":null,"a":"错","e":"该句描述的是思维的间接性，不是创造性。"},{"k":"教育心理学|判断题|73","b":"教育心理学","t":"判断题","ty":"judge","n":73,"q":"高校教师的角色期待有教学活动的设计者、大学生学习的指导者和促进者、教学的组织者和管理者、教学的反思者与研究者、平等中的“首席”、科学家或思想家、终身学习者和心理健康的维护者","o":null,"a":"对","e":"高校教师角色期待包括教学的设计者、学习的指导者、教学的组织管理者、教学的反思研究者、平等中的“首席”、科学家或思想家、终身学习者和心理健康维护者。"},{"k":"教育心理学|判断题|74","b":"教育心理学","t":"判断题","ty":"judge","n":74,"q":"舒茨的人际需要三维论认为，每一个体在人际互动中都有包容、支配和情感需要。","o":null,"a":"对","e":"舒茨的人际需要三维论认为人际互动中有包容、支配和情感需要。"},{"k":"教育心理学|判断题|75","b":"教育心理学","t":"判断题","ty":"judge","n":75,"q":"定势对知识迁移的作用既有积极的，也有消极的。","o":null,"a":"对","e":"定势对知识迁移的作用既有积极也有消极。"},{"k":"教育心理学|判断题|76","b":"教育心理学","t":"判断题","ty":"judge","n":76,"q":"从整体上讲，气质并无好坏优劣之分，任何一种气质都有其积极和消极的方面，气质类型也不会对一个人的品德、智力发展水平以及将来的成就、贡献和价值起决定性作用","o":null,"a":"对","e":"气质无好坏优劣之分，不会对品德、智力发展和成就起决定性作用。"},{"k":"教育心理学|判断题|77","b":"教育心理学","t":"判断题","ty":"judge","n":77,"q":"皮亚杰提出了人格发展的八阶段论","o":null,"a":"错","e":"人格发展八阶段论由埃里克森提出，不是皮亚杰。"},{"k":"教育心理学|判断题|78","b":"教育心理学","t":"判断题","ty":"judge","n":78,"q":"价值观是个人对于人生目的和意义的根本看法和态度，是一定的世界观在人生问题上的反映。","o":null,"a":"错","e":"价值观是以自身需要为尺度对事物重要性的观念系统；题干描述的是人生观。"},{"k":"教育心理学|判断题|79","b":"教育心理学","t":"判断题","ty":"judge","n":79,"q":"人生观是个人对于人生目的和意义的根本看法和态度，是一定的世界观在人生问题上的反映。","o":null,"a":"对","e":"人生观是对人生目的和意义的根本看法，是世界观在人生问题上的反映。"},{"k":"教育心理学|判断题|80","b":"教育心理学","t":"判断题","ty":"judge","n":80,"q":"在商店买东西的顾客群、公共汽车上的乘客群、在影剧院看电影的观众群，这些都不是真正意义上的群体。","o":null,"a":"对","e":"商店顾客、公交车乘客、影剧院观众都不是真正意义上的群体。"},{"k":"教育心理学|判断题|81","b":"教育心理学","t":"判断题","ty":"judge","n":81,"q":"PAC分析论认为，人格由三种比重不同的心理状态构成，这就是“父母”、“成人”、“儿童”。","o":null,"a":"对","e":"PAC分析论认为人格由“父母”“成人”“儿童”三种心理状态构成。"},{"k":"教育心理学|判断题|82","b":"教育心理学","t":"判断题","ty":"judge","n":82,"q":"大学生中常见的自我认知问题主要有自卑、自负、虚荣。","o":null,"a":"对","e":"大学生常见的自我认知问题有自卑、自负、虚荣。"},{"k":"教育心理学|判断题|83","b":"教育心理学","t":"判断题","ty":"judge","n":83,"q":"皮尔斯认为认为，一个心理健康的人应该是充分地理解并坚定地立足于自己的“此时此地”的人，那些念念不忘过去，或对未来想入非非的人，通常表现出人格的不平衡。","o":null,"a":"对","e":"皮尔斯认为心理健康者应立足于自己的“此时此地”。"},{"k":"教育心理学|判断题|84","b":"教育心理学","t":"判断题","ty":"judge","n":84,"q":"动物和人类都可以进行学习。","o":null,"a":"对","e":"动物和人类都可以进行学习。"},{"k":"教育心理学|判断题|85","b":"教育心理学","t":"判断题","ty":"judge","n":85,"q":"陈述性知识和程序性知识都是人的长时记忆中的重要内容。","o":null,"a":"对","e":"陈述性知识和程序性知识都存放在长时记忆中。"},{"k":"教育心理学|判断题|86","b":"教育心理学","t":"判断题","ty":"judge","n":86,"q":"认知成分是人际关系的核心","o":null,"a":"错","e":"情感成分才是人际关系的核心，认知成分是基础。"},{"k":"教育心理学|判断题|87","b":"教育心理学","t":"判断题","ty":"judge","n":87,"q":"人格形成与发展的影响因素有生物遗传因素、社会文化因素、家庭环境因素、早期童年经验、学校教育因素和自然物理因素","o":null,"a":"对","e":"人格形成与发展受生物遗传、社会文化、家庭环境、早期童年经验、学校教育和自然物理因素影响。"},{"k":"教育心理学|判断题|88","b":"教育心理学","t":"判断题","ty":"judge","n":88,"q":"教师扮演的角色对学生而言有不同作用，这些作用可以按感情因素排列，其中起权威者作用的有家长的代理人、知识的传授者、团体的领导和模范公民","o":null,"a":"对","e":"按感情因素排列，家长的代理人、知识的传授者、团体的领导和模范公民起权威者作用。"},{"k":"教育心理学|判断题|89","b":"教育心理学","t":"判断题","ty":"judge","n":89,"q":"健全人格是指人格的生理、心理、社会、道德和审美各要素的完美统一、平衡和协调，是生物进化所赋予人的本性充分发展时所能达到的境界","o":null,"a":"对","e":"健全人格是人格各要素的完美统一、平衡与协调。"},{"k":"教育心理学|判断题|90","b":"教育心理学","t":"判断题","ty":"judge","n":90,"q":"敏感化由于刺激重复使有机体对它的反应性增强，即有机体对环境中的某一特定刺激更容易作出反应。","o":null,"a":"对","e":"敏感化是重复刺激使有机体反应性增强。"},{"k":"教育心理学|判断题|91","b":"教育心理学","t":"判断题","ty":"judge","n":91,"q":"奥苏伯尔将学习分为接受学习和发现学习。","o":null,"a":"对","e":"奥苏伯尔把学习分为接受学习和发现学习。"},{"k":"教育心理学|判断题|92","b":"教育心理学","t":"判断题","ty":"judge","n":92,"q":"研究性学习的根本目标在于培养学生的创新能力和实践能力。","o":null,"a":"对","e":"研究性学习的根本目标是培养创新能力和实践能力。"},{"k":"教育心理学|判断题|93","b":"教育心理学","t":"判断题","ty":"judge","n":93,"q":"如果他人在场但每个人的参与程度可以检验和鉴别，就不会产生“浑水摸鱼”的情况。","o":null,"a":"对","e":"他人参与程度可检验鉴别时，不易产生责任分散式的“浑水摸鱼”。"},{"k":"教育心理学|判断题|94","b":"教育心理学","t":"判断题","ty":"judge","n":94,"q":"学生不会受到教师道德伦理价值体系的影响","o":null,"a":"错","e":"学生的品德与价值观会受教师道德伦理价值体系的影响。"},{"k":"教育心理学|判断题|95","b":"教育心理学","t":"判断题","ty":"judge","n":95,"q":"成语“耳濡目染”指的就是无意记忆起作用。","o":null,"a":"对","e":"“耳濡目染”体现无意记忆（内隐学习）的作用。"},{"k":"教育心理学|判断题|96","b":"教育心理学","t":"判断题","ty":"judge","n":96,"q":"教师是学生环境和学生集体的管理者","o":null,"a":"对","e":"教师是学生环境和学生集体的管理者。"},{"k":"教育心理学|判断题|97","b":"教育心理学","t":"判断题","ty":"judge","n":97,"q":"斯金纳进行了婴儿的恐惧形成实验。","o":null,"a":"错","e":"婴儿恐惧形成实验由华生完成，不是斯金纳。"},{"k":"教育心理学|判断题|98","b":"教育心理学","t":"判断题","ty":"judge","n":98,"q":"小学生学习乘法总是从同数连加入手，因为有关加法的知识是学习乘法的基础。新旧知识的有机联系，能帮助学生对新知识的理解。","o":null,"a":"对","e":"已有加法知识是学习乘法的基础，新旧知识的有机联系有助于理解新知识。"},{"k":"教育心理学|判断题|99","b":"教育心理学","t":"判断题","ty":"judge","n":99,"q":"习惯化是指人的感受能力发生了变化。","o":null,"a":"错","e":"习惯化是重复刺激引起的反应性下降，并非单纯的感受能力变化。"},{"k":"教育心理学|判断题|100","b":"教育心理学","t":"判断题","ty":"judge","n":100,"q":"教师还可以根据课堂活动形式采用多种座位安排形式，集体教学时可采用传统的“秧田型”排列；小组讨论时则可以采用“会晤型”和“马蹄型”排列。","o":null,"a":"对","e":"集体教学用“秧田型”排列，小组讨论用“会晤型”“马蹄型”等排列。"},{"k":"教育心理学|判断题|101","b":"教育心理学","t":"判断题","ty":"judge","n":101,"q":"马斯洛认为，在同一时间、地点和条件下，人存在多种需要，为人最渴望得到而又未得到满足的需要是优势需要，它对人的行为起决定性作用。","o":null,"a":"对","e":"优势需要是最渴望而又未得到满足的需要，对行为起决定性作用。"},{"k":"教育心理学|判断题|102","b":"教育心理学","t":"判断题","ty":"judge","n":102,"q":"对一般的教学能力而言，高校教师应掌握包括专业知识、组织教材的能力、言语表达能力、组织教学的能力以及教学多媒体运用能力等","o":null,"a":"对","e":"高校教师一般教学能力包括专业知识、组织教材、言语表达、组织教学和多媒体运用能力。"},{"k":"教育心理学|判断题|103","b":"教育心理学","t":"判断题","ty":"judge","n":103,"q":"“因材施教”是一条重要的教学原则，其依据就是学生的个别差异","o":null,"a":"对","e":"“因材施教”的依据就是学生的个别差异。"},{"k":"教育心理学|判断题|104","b":"教育心理学","t":"判断题","ty":"judge","n":104,"q":"教师指导学生进行归因时应引导大学生对自己的成败做有利的归因，即对成败做有利于今后的学习和适应的归因","o":null,"a":"对","e":"归因指导应引导大学生做有利于今后学习和适应的归因。"},{"k":"教育心理学|判断题|105","b":"教育心理学","t":"判断题","ty":"judge","n":105,"q":"相对成熟的大学生而言，坚持用社会意义较小的动机取代社会意义较大的动机的情况普遍存在。","o":null,"a":"错","e":"相对成熟的大学生而言，用社会意义较大的动机取代社会意义较小的动机更普遍。"},{"k":"教育心理学|判断题|106","b":"教育心理学","t":"判断题","ty":"judge","n":106,"q":"文化传承、文化选择、文化批判、文化创造是高等教育的功能","o":null,"a":"对","e":"文化传承、文化选择、文化批判和文化创造是高等教育的功能。"},{"k":"教育心理学|判断题|107","b":"教育心理学","t":"判断题","ty":"judge","n":107,"q":"教师组织教学活动的能力包括制定课堂教学计划的能力、正确选择运用教学方法的能力和调节课堂气氛、调动学生积极性的能力","o":null,"a":"对","e":"教师组织教学活动的能力包括制定课堂教学计划、选择运用教学方法和调节课堂气氛、调动积极性。"},{"k":"教育心理学|判断题|108","b":"教育心理学","t":"判断题","ty":"judge","n":108,"q":"教师是学校的咨询员，负有引导学生的认知和情感发展的责任","o":null,"a":"对","e":"教师是学校的咨询员，负有引导学生的认知和情感发展的责任。"},{"k":"教育心理学|判断题|109","b":"教育心理学","t":"判断题","ty":"judge","n":109,"q":"培养大学生健全人格的途径与措施包括：认识自我，优化人格整合；学会自我教育；增强挫折耐受力；养成良好习惯；建立和谐的人际关系以及加强文化修养","o":null,"a":"对","e":"培养健全人格可通过认识自我、学会自我教育、增强挫折耐受力、养成良好习惯、建立和谐人际关系和加强文化修养。"},{"k":"教育心理学|判断题|110","b":"教育心理学","t":"判断题","ty":"judge","n":110,"q":"人格障碍不同于精神病，但二者是相互转化的。严重的人格障碍者如果没有及时有效地进行矫正，会成为精神病的高发人群，给个体或社会造成精神痛苦与危害。","o":null,"a":"对","e":"人格障碍与精神病不同但可相互转化，严重者易成为精神病高发人群。"},{"k":"教育心理学|判断题|111","b":"教育心理学","t":"判断题","ty":"judge","n":111,"q":"短时记忆指的是信息保持在5秒至2分钟之内的记忆，容量很小，大约为7±2个单位。","o":null,"a":"对","e":"短时记忆保持约5秒至2分钟，容量约7±2个单位。"},{"k":"教育心理学|判断题|112","b":"教育心理学","t":"判断题","ty":"judge","n":112,"q":"气质与性格都是人的个性心理特征，二者既有联系又有区别，相互影响，彼此制约","o":null,"a":"对","e":"气质与性格同属个性心理特征，既有联系又有区别、相互影响。"},{"k":"教育心理学|判断题|113","b":"教育心理学","t":"判断题","ty":"judge","n":113,"q":"米尔格伦认为，在人际网络中，两个陌生人可以通过“亲友的亲友”建立联系，这中间最多只要通过5个朋友就能达到目的。","o":null,"a":"对","e":"米尔格伦认为两个陌生人可通过“亲友的亲友”建立联系，最多只要通过5个朋友。"},{"k":"教育心理学|判断题|114","b":"教育心理学","t":"判断题","ty":"judge","n":114,"q":"让学生体验到经过自身努力获取成功，是推动学生不断进取的关键因素。","o":null,"a":"对","e":"让学生体验经过自身努力获取成功，是推动学生不断进取的关键因素。"},{"k":"教育心理学|判断题|115","b":"教育心理学","t":"判断题","ty":"judge","n":115,"q":"学习者需要练习、反馈和复习","o":null,"a":"对","e":"学习者需要练习、反馈和复习。"},{"k":"教育心理学|判断题|116","b":"教育心理学","t":"判断题","ty":"judge","n":116,"q":"心理健康具有社会性是因为不同社会心理健康的标准也有不同。","o":null,"a":"对","e":"心理健康具有社会性，因为不同社会心理健康的标准也有不同。"},{"k":"教育心理学|判断题|117","b":"教育心理学","t":"判断题","ty":"judge","n":117,"q":"人本主义心理学家提倡的学习理论将范围扩大到了对学习者整个人的成长历程的解释。","o":null,"a":"对","e":"人本主义学习理论把范围扩大到对学习者整个人成长历程的解释。"},{"k":"教育心理学|判断题|118","b":"教育心理学","t":"判断题","ty":"judge","n":118,"q":"自我评价偏差是大学生产生心理问题的主要原因。","o":null,"a":"对","e":"自我评价偏差是大学生产生心理问题的主要原因。"},{"k":"教育心理学|判断题|119","b":"教育心理学","t":"判断题","ty":"judge","n":119,"q":"将获得知识以图式形式，围绕某一主题相互联系起来，形成一定的知识单元，将会有效地促进人对知识的存储和运用。","o":null,"a":"对","e":"以图式形式把知识围绕主题联系成知识单元，能有效促进知识的存储和运用。"},{"k":"教育心理学|判断题|120","b":"教育心理学","t":"判断题","ty":"judge","n":120,"q":"年龄小、社会阅历少的人因为好奇心强，容易模仿别人。","o":null,"a":"对","e":"年龄小、社会阅历少的人好奇心强，容易模仿别人。"},{"k":"教育心理学|判断题|121","b":"教育心理学","t":"判断题","ty":"judge","n":121,"q":"普通教育的对象是各年龄段的人，而高等教育的对象是大学生和研究生","o":null,"a":"错","e":"普通教育并非只以各年龄段的人为对象，高等教育对象为大学生和研究生，题干前半句有误。"},{"k":"教育心理学|判断题|122","b":"教育心理学","t":"判断题","ty":"judge","n":122,"q":"动机是推动和维持人们活动的内部原因或动力。人的一切活动总是受动机的调节和支配。","o":null,"a":"对","e":"动机是推动和维持活动的内部原因或动力，人的一切活动都受动机调节支配。"},{"k":"教育心理学|判断题|123","b":"教育心理学","t":"判断题","ty":"judge","n":123,"q":"心理健康不是一种固定的状态，而是一种不断发展的过程。健康没有止境，是人的理想追求。","o":null,"a":"对","e":"心理健康不是固定状态而是不断发展的过程，健康没有止境。"},{"k":"教育心理学|判断题|124","b":"教育心理学","t":"判断题","ty":"judge","n":124,"q":"精神分析大师弗洛伊德提出了自我、本我、超我的概念","o":null,"a":"对","e":"弗洛伊德提出自我、本我、超我三个概念。"},{"k":"教育心理学|判断题|125","b":"教育心理学","t":"判断题","ty":"judge","n":125,"q":"情感成分是人际关系得以形成和维系的理性条件","o":null,"a":"错","e":"情感成分是人际关系形成与维系的必要条件，题干中“理性条件”表述有误。"},{"k":"教育心理学|判断题|126","b":"教育心理学","t":"判断题","ty":"judge","n":126,"q":"女性在成功的情境下多做内部归因，在失败的情境下多做外部归因","o":null,"a":"错","e":"女性在成功时多做外部归因、失败时多做内部归因，题干说反了。"},{"k":"教育心理学|判断题|127","b":"教育心理学","t":"判断题","ty":"judge","n":127,"q":"群体规范指群体所确定的行为标准。","o":null,"a":"对","e":"群体规范是群体所确定的行为标准。"},{"k":"教育心理学|判断题|128","b":"教育心理学","t":"判断题","ty":"judge","n":128,"q":"挫折与攻击之间有必然的因果联系","o":null,"a":"错","e":"挫折与攻击之间没有必然的因果联系，挫折只是可能引发攻击。"},{"k":"教育心理学|判断题|129","b":"教育心理学","t":"判断题","ty":"judge","n":129,"q":"相对于鱼的图式而言，动物的图式是一个复杂图式，因为鱼属于动物；对于鱼来说，动物的图式是高级的、上位的图式，鱼的图式则是低级的、下位的图式。","o":null,"a":"对","e":"相对鱼的图式，动物图式是复杂的、高级的、上位图式，鱼的图式是低级的、下位图式。"},{"k":"教育心理学|判断题|130","b":"教育心理学","t":"判断题","ty":"judge","n":130,"q":"从众有两个基本要素：规范压力和信息压力。","o":null,"a":"对","e":"从众的两个基本要素是规范压力和信息压力。"},{"k":"教育心理学|判断题|131","b":"教育心理学","t":"判断题","ty":"judge","n":131,"q":"在教学过程中，应根据不同的学习要求和不同的学习阶段，有侧重地传授陈述性知识或程序性知识。","o":null,"a":"对","e":"教学应按不同学习要求和学习阶段有侧重地传授陈述性知识或程序性知识。"},{"k":"教育心理学|判断题|132","b":"教育心理学","t":"判断题","ty":"judge","n":132,"q":"张积家认为教师除担任由教师职务所决定的角色外，在社会生活中还担任知识的建设者、社区活动的组织者和普通公民的角色","o":null,"a":"对","e":"张积家认为教师还担任知识的建设者、社区活动的组织者和普通公民的角色。"},{"k":"教育心理学|判断题|133","b":"教育心理学","t":"判断题","ty":"judge","n":133,"q":"随着时代变迁，现代教育观念则更强调教师是学生学习活动的组织者、指导者和帮助者","o":null,"a":"对","e":"现代教育观念更强调教师是学生学习活动的组织者、指导者和帮助者。"},{"k":"教育心理学|判断题|134","b":"教育心理学","t":"判断题","ty":"judge","n":134,"q":"对大学生而言，在适当的范围内，自负可以激发他们的斗志，树立必胜的信心，坚定战胜困难的信念，使他们勇往直前。","o":null,"a":"对","e":"在适当范围内，自负可激发斗志、树立信心、坚定战胜困难的信念。"},{"k":"教育心理学|判断题|135","b":"教育心理学","t":"判断题","ty":"judge","n":135,"q":"影响教师威信形成的主观因素有：教育教学技能和心理素质、良好的道德品质、教师的仪表、生活作风和习惯、师生平等交往和教师给学生的第一印象","o":null,"a":"对","e":"影响教师威信形成的主观因素有教育教学技能与心理素质、良好道德品质、仪表作风和习惯、师生平等交往和第一印象。"},{"k":"教育心理学|判断题|136","b":"教育心理学","t":"判断题","ty":"judge","n":136,"q":"男性和女性的智力结构存在差异，各有自己的智力
