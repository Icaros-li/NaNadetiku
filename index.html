题","ty":"multiple","n":79,"q":"美国学者伯顿·克拉克的观点，在高等教育的运作中一直有三股力量，分别是（）。","o":{"A":"民间组织","B":"国家权力","C":"市场力量","D":"学术权威"},"a":"BCD","e":"伯顿·克拉克认为高等教育运作中有国家权力、市场力量和学术权威三股力量。"},{"k":"教育学|多选题|80","b":"教育学","t":"多选题","ty":"multiple","n":80,"q":"下列选项中属于高等教育贸易方式的是（）。","o":{"A":"跨境高等教育服务","B":"出国留学","C":"雇用外籍教师","D":"境外机构设立的私立高等教育机构"},"a":"ABCD","e":"高等教育贸易方式包括跨境高等教育服务、出国留学、雇用外籍教师和境外机构设立的私立高等教育机构。"},{"k":"教育学|多选题|81","b":"教育学","t":"多选题","ty":"multiple","n":81,"q":"对于提供教育服务的高等学校而言，高等教育市场包括（）。","o":{"A":"出口处的教育需求","B":"出口处的劳动力需求","C":"入口处的劳动需求","D":"入口处的教育需求"},"a":"BD","e":"高等教育市场包括入口处的教育需求（学生）和出口处的劳动力需求（用人单位）。"},{"k":"教育学|多选题|82","b":"教育学","t":"多选题","ty":"multiple","n":82,"q":"高等教育的资本市场包括（）。","o":{"A":"高校贷款","B":"学生贷款","C":"融资设立营利性高等教育机构","D":"高校拆借市场"},"a":"ABC","e":"高等教育的资本市场包括学生贷款、高校贷款和融资设立营利性高等教育机构。"},{"k":"教育学|多选题|83","b":"教育学","t":"多选题","ty":"multiple","n":83,"q":"下列说法正确的是（）。","o":{"A":"当代国际化的行动主体变成更加复杂","B":"国际化，只是高等院校的行动","C":"在当代国家或地区成为高等教育国际化的推动者","D":"当代高等教育国际化的支持系统加强"},"a":"ACD","e":"当代国际化行动主体更复杂、国家或地区成为推动者、支持系统加强；B错，国际化并非只是高等院校的行动。"},{"k":"教育学|判断题|1","b":"教育学","t":"判断题","ty":"judge","n":1,"q":"在官学中，太学和国子监是古代中国的最高学府，自汉代后历朝均设。","o":null,"a":"对","e":"太学和国子监是古代中国官学中的最高学府，自汉代后历朝均设。"},{"k":"教育学|判断题|2","b":"教育学","t":"判断题","ty":"judge","n":2,"q":"古罗马高等教育，开设了修辞、辩证法、算术、天文、几何、历史、音乐课程，培养哲学王。","o":null,"a":"错","e":"培养“哲学王”是古希腊（柏拉图）的教育理想，不属于古罗马高等教育。"},{"k":"教育学|判断题|3","b":"教育学","t":"判断题","ty":"judge","n":3,"q":"现代学位制度主要起源于西欧的中世纪大学。","o":null,"a":"对","e":"现代学位制度主要起源于西欧的中世纪大学。"},{"k":"教育学|判断题|4","b":"教育学","t":"判断题","ty":"judge","n":4,"q":"1810年成立的威斯康星大学则开启了研究型大学的未来，它不仅影响了德国其他大学，而且影响了世界各地大学的发展模式。","o":null,"a":"错","e":"1810年成立的是柏林大学（不是威斯康星大学），它开启了研究型大学的未来。"},{"k":"教育学|判断题|5","b":"教育学","t":"判断题","ty":"judge","n":5,"q":"高等学校的三项基本职能包括人才培养、科学研究和社会服务。","o":null,"a":"对","e":"高等学校的三项基本职能是人才培养、科学研究和社会服务。"},{"k":"教育学|判断题|6","b":"教育学","t":"判断题","ty":"judge","n":6,"q":"1809年洪堡创办柏林大学，提出“通过研究进行教学”、“教学与研究统一”作为柏林大学的办学原则，此后，科学研究发展成高等学校的第二职能。","o":null,"a":"对","e":"1809年洪堡创办柏林大学，提出“通过研究进行教学”“教学与研究统一”，此后科研成为高校第二职能。"},{"k":"教育学|判断题|7","b":"教育学","t":"判断题","ty":"judge","n":7,"q":"1912年，麦卡锡出版了《威斯康星理念》一书，宣扬威斯康星大学“为社会服务”的办学理念和模式。威斯康星大学是第一个将“为社会服务”作为高等学校职能的高校。","o":null,"a":"对","e":"1912年麦卡锡出版《威斯康星理念》，威斯康星大学是第一个把“为社会服务”作为高校职能的高校。"},{"k":"教育学|判断题|8","b":"教育学","t":"判断题","ty":"judge","n":8,"q":"个人本位论主张教育目的应依据个人的需要来确定，教育的首要目的不在于谋求国家利益和社会发展，而在于发展人的理性和个性，使人真正成其为人。强调个人的价值高于社会的价值。其代表人物有凯兴斯泰纳、卢梭等。","o":null,"a":"错","e":"凯兴斯泰纳属社会本位论代表，个人本位论代表应为卢梭、裴斯泰洛齐、洛克等。"},{"k":"教育学|判断题|9","b":"教育学","t":"判断题","ty":"judge","n":9,"q":"最早的专业教育始于中世纪大学，大学设文、法、神、医四科，培养牧师、教师、医生和官吏等专业人才。","o":null,"a":"对","e":"最早的专业教育始于中世纪大学，设文、法、神、医四科培养专业人才。"},{"k":"教育学|判断题|10","b":"教育学","t":"判断题","ty":"judge","n":10,"q":"通才教育主要针对具体岗位和行业需要来进行人才培养。","o":null,"a":"错","e":"针对具体岗位和行业需要培养人才的是专才教育，通才教育面向较宽领域。"},{"k":"教育学|判断题|11","b":"教育学","t":"判断题","ty":"judge","n":11,"q":"校风、学风，校训都是实践层面的大学精神文化。","o":null,"a":"错","e":"校风、学风属实践层面，校训属价值层面，不能一概归为实践层面。"},{"k":"教育学|判断题|12","b":"教育学","t":"判断题","ty":"judge","n":12,"q":"大学精神、理念、管理作风、教风等都是价值层面的精神文化。","o":null,"a":"错","e":"大学精神、理念、管理作风属价值层面，教风属实践层面。"},{"k":"教育学|判断题|13","b":"教育学","t":"判断题","ty":"judge","n":13,"q":"大学的各种制度规则体现了大学的隐性精神文化。","o":null,"a":"对","e":"大学的各种制度规则体现了大学的隐性精神文化。"},{"k":"教育学|判断题|14","b":"教育学","t":"判断题","ty":"judge","n":14,"q":"大学精神源于大学理念，大学理念一定会成为大学精神的一部分。","o":null,"a":"错","e":"大学理念并不必然成为大学精神的一部分，尚需经过长期实践的积淀与认同。"},{"k":"教育学|判断题|15","b":"教育学","t":"判断题","ty":"judge","n":15,"q":"洪堡是最早系统阐述理性主义大学理念的第一人。","o":null,"a":"错","e":"最早系统阐述理性主义大学理念的是纽曼，不是洪堡。"},{"k":"教育学|判断题|16","b":"教育学","t":"判断题","ty":"judge","n":16,"q":"赫钦斯是理性主义大学理念的代表人物和集大成者。","o":null,"a":"对","e":"赫钦斯是理性主义大学理念的代表人物和集大成者。"},{"k":"教育学|判断题|17","b":"教育学","t":"判断题","ty":"judge","n":17,"q":"大学理念方面，科尔是一个典型的工具主义者或实用主义者。","o":null,"a":"对","e":"科尔是典型的工具主义者（实用主义者）。"},{"k":"教育学|判断题|18","b":"教育学","t":"判断题","ty":"judge","n":18,"q":"牛津大学、巴黎大学、哈佛大学等都是著名的中世纪大学。","o":null,"a":"错","e":"哈佛大学创办于1636年，不属于中世纪大学。"},{"k":"教育学|判断题|19","b":"教育学","t":"判断题","ty":"judge","n":19,"q":"1998年10月在巴黎召开的首次世界高等教育大会，发表了《21世纪的高等教育：展望和行动世界宣言》","o":null,"a":"对","e":"1998年10月巴黎首次世界高等教育大会发表了《21世纪的高等教育：展望和行动世界宣言》。"},{"k":"教育学|判断题|20","b":"教育学","t":"判断题","ty":"judge","n":20,"q":"现代大学的国际化有助于促进异质文化之间的相互了解、相互理解，进而推动多元文化的融合。","o":null,"a":"对","e":"现代大学的国际化有助于异质文化相互了解、相互理解，推动多元文化的融合。"},{"k":"教育学|判断题|21","b":"教育学","t":"判断题","ty":"judge","n":21,"q":"一所现代大学有真正的大师就能够培养出大师级人才。","o":null,"a":"错","e":"有真正的大师只是必要条件，还须有“大楼”（物质条件）、制度和文化等条件才能培养出大师级人才。"},{"k":"教育学|判断题|22","b":"教育学","t":"判断题","ty":"judge","n":22,"q":"高校质量文化应当体现“刚性”约束与“柔性”约束的紧密结合。","o":null,"a":"对","e":"高校质量文化应体现“刚性”约束与“柔性”约束的紧密结合。"},{"k":"教育学|判断题|23","b":"教育学","t":"判断题","ty":"judge","n":23,"q":"柏林大学是现代大学崇尚科学研究职能并使之制度化的始祖。","o":null,"a":"对","e":"柏林大学是现代大学崇尚科学研究职能并使之制度化的始祖。"},{"k":"教育学|判断题|24","b":"教育学","t":"判断题","ty":"judge","n":24,"q":"学术漂移的首要表现是重行政权力、轻学术权力。","o":null,"a":"错","e":"学术漂移的首要表现是重科研轻教学，不是重行政权力、轻学术权力。"},{"k":"教育学|判断题|25","b":"教育学","t":"判断题","ty":"judge","n":25,"q":"教师低效教学的首要表现是不能有效地传授学科知识。","o":null,"a":"错","e":"教师低效教学的首要表现是不能有效促进学生的学习，而非仅是传授学科知识。"},{"k":"教育学|判断题|26","b":"教育学","t":"判断题","ty":"judge","n":26,"q":"学术自由不是单个学者绝对的言论自由，而是学术专业群体在思想、探究、讨论和教学方面的绝对自由。","o":null,"a":"对","e":"学术自由不是单个学者绝对的言论自由，而是学术专业群体在思想、探究、讨论和教学方面的自由。"},{"k":"教育学|判断题|27","b":"教育学","t":"判断题","ty":"judge","n":27,"q":"教师将知识传授给学生旨在培养学生的能力，包括培养学生学会做人、学会做事、学会共处、学会生活。","o":null,"a":"错","e":"题干把教师传授知识所培养的能力范围表述为“四个学会”，与实际不符，说法错误。"},{"k":"教育学|判断题|28","b":"教育学","t":"判断题","ty":"judge","n":28,"q":"教师群体本身就是一个行会组织，群体内部不同年龄、不同水平的教师之间保持的关系仅是竞争-合作关系。","o":null,"a":"错","e":"教师之间应保持共进、竞争与合作关系，不仅是竞争—合作关系。"},{"k":"教育学|判断题|29","b":"教育学","t":"判断题","ty":"judge","n":29,"q":"在专家介入型的教学发展模式中，教师和作为顾问的教学专家之间必须建立良好的合作关系。","o":null,"a":"对","e":"专家介入型教学发展模式中，教师与作为顾问的教学专家之间必须建立良好的合作关系。"},{"k":"教育学|判断题|30","b":"教育学","t":"判断题","ty":"judge","n":30,"q":"教师存在着“做一天和尚撞一天钟”的心态时，表明该教师处于生涯低落阶段。","o":null,"a":"错","e":"这一心态反映的是生涯挫折或停滞阶段，而非生涯低落阶段。"},{"k":"教育学|判断题|31","b":"教育学","t":"判断题","ty":"judge","n":31,"q":"高校教师绩效评指标价体系设计，应坚持指标划分的独立性、可操作性原则，避免多项指标之间的重复交叉，确保各项指标相互独立。","o":null,"a":"对","e":"教师绩效评价指标设计应坚持指标划分的独立性和可操作性，避免指标重复交叉。"},{"k":"教育学|判断题|32","b":"教育学","t":"判断题","ty":"judge","n":32,"q":"学术活动的同工不同酬是不能被认可的。","o":null,"a":"错","e":"学术活动中因学术生产力差异造成的报酬不同是可以被认可的，故该说法错误。"},{"k":"教育学|判断题|33","b":"教育学","t":"判断题","ty":"judge","n":33,"q":"我国公办高校实行党委领导下的校长负责制","o":null,"a":"对","e":"我国公办高校实行党委领导下的校长负责制。"},{"k":"教育学|判断题|34","b":"教育学","t":"判断题","ty":"judge","n":34,"q":"在“行政主导模式”中,学校的组织结构呈现金字塔形。","o":null,"a":"对","e":"在“行政主导模式”中，学校的组织结构呈现金字塔形。"},{"k":"教育学|判断题|35","b":"教育学","t":"判断题","ty":"judge","n":35,"q":"在我国大学的内部权力中，权力矛盾的焦点仍然是行政权力与学术权力的矛盾。","o":null,"a":"对","e":"在我国大学的内部权力中，权力矛盾的焦点仍然是行政权力与学术权力的矛盾。"},{"k":"教育学|判断题|36","b":"教育学","t":"判断题","ty":"judge","n":36,"q":"高校战略管理是一个静态的管理过程。","o":null,"a":"错","e":"高校战略管理是一个动态的管理过程，不是静态的。"},{"k":"教育学|判断题|37","b":"教育学","t":"判断题","ty":"judge","n":37,"q":"衡量高等教育质量的第一标准是人才培养水平。","o":null,"a":"对","e":"衡量高等教育质量的第一标准是人才培养水平。"},{"k":"教育学|判断题|38","b":"教育学","t":"判断题","ty":"judge","n":38,"q":"教学管理是高校的经常性工作，教学工作是高校管理的核心。","o":null,"a":"错","e":"教学是高校的中心工作，但高校管理的核心并非仅指教学管理，故该说法错误。"},{"k":"教育学|判断题|39","b":"教育学","t":"判断题","ty":"judge","n":39,"q":"在高等学校教学质量保障活动中，激励导向和监控手段是对立统一的两个方面。","o":null,"a":"对","e":"在高等学校教学质量保障活动中，激励导向和监控手段是对立统一的两个方面。"},{"k":"教育学|判断题|40","b":"教育学","t":"判断题","ty":"judge","n":40,"q":"培养方案修订的主体在学科和专业，学科和专业可以自主设置课程。","o":null,"a":"错","e":"培养方案修订的主体是学校教学管理部门，学科和专业不能自主设置课程。"},{"k":"教育学|判断题|41","b":"教育学","t":"判断题","ty":"judge","n":41,"q":"建立有效的质量监控与评价系统，首先是要建立良好的创新机制。","o":null,"a":"对","e":"建立有效的质量监控与评价系统，首先是要建立良好的创新机制。"},{"k":"教育学|判断题|42","b":"教育学","t":"判断题","ty":"judge","n":42,"q":"战略规划是战略管理的先导。","o":null,"a":"对","e":"战略规划是战略管理的先导。"},{"k":"教育学|判断题|43","b":"教育学","t":"判断题","ty":"judge","n":43,"q":"科研成果的价值难以在短时间内做出准确判断，长期的实践检验才是唯一的标准。","o":null,"a":"对","e":"科研成果的价值难以在短时间内准确判断，长期的实践检验才是唯一的标准。"},{"k":"教育学|判断题|44","b":"教育学","t":"判断题","ty":"judge","n":44,"q":"科研评价指标权重确定方法较为常用的有专家意见平均法、德尔裴法、秩和运算法、层次分析法等。","o":null,"a":"对","e":"科研评价指标权重的确定常用专家意见平均法、德尔裴法、秩和运算法、层次分析法等。"},{"k":"教育学|判断题|45","b":"教育学","t":"判断题","ty":"judge","n":45,"q":"把课程理解为学习方案或具体的学习科目，是我国教育理论界和广大教师最为熟悉的课程定义，也是最普遍、最传统、最一般的课程含义。","o":null,"a":"对","e":"把课程理解为学习方案或具体学习科目，是最普遍、最传统、最一般的课程含义。"},{"k":"教育学|判断题|46","b":"教育学","t":"判断题","ty":"judge","n":46,"q":"高校课程具有明显的专业性。","o":null,"a":"对","e":"高校课程具有明显的专业性。"},{"k":"教育学|判断题|47","b":"教育学","t":"判断题","ty":"judge","n":47,"q":"从课程组织方式上，可以把课程分为隐性课程和显性课程。","o":null,"a":"错","e":"按课程组织方式应分为分科课程与整合课程，显性课程与隐性课程是按表现形式划分的。"},{"k":"教育学|判断题|48","b":"教育学","t":"判断题","ty":"judge","n":48,"q":"整合课程被多个国家视为高校课程结构改革的焦点所在，是因为整合课程扬弃了分科课程的缺陷，符合人类整体认知特点。","o":null,"a":"对","e":"整合课程扬弃了分科课程的缺陷，符合人类整体认知特点，被视为高校课程结构改革的焦点。"},{"k":"教育学|判断题|49","b":"教育学","t":"判断题","ty":"judge","n":49,"q":"培养方案只能按照学年编制。","o":null,"a":"错","e":"培养方案可按学年编制，也可按学分制等方式编制，并非只能按学年编制。"},{"k":"教育学|判断题|50","b":"教育学","t":"判断题","ty":"judge","n":50,"q":"泰勒倡导的目标模式中，教师是课程实施的主体，学生是课程实施的对象，他们都是课程编制的主体。","o":null,"a":"错","e":"泰勒目标模式中课程编制的主体是课程专家与教师，学生是课程实施的对象，不是编制主体。"},{"k":"教育学|判断题|51","b":"教育学","t":"判断题","ty":"judge","n":51,"q":"不同的课程评价模式在具体的过程和使用的方法技术上必然存在着差异，所以不存在统一化、标准化的评价过程与方法，也不存在一般步骤。","o":null,"a":"错","e":"不同评价模式虽有差异，但仍存在一般步骤和可统一、标准化的评价过程与方法，故该说法错误。"},{"k":"教育学|判断题|52","b":"教育学","t":"判断题","ty":"judge","n":52,"q":"课程评价实施中的基础性工作是确定评价机构的人员构成。","o":null,"a":"错","e":"课程评价实施中的基础性工作是制定评价方案，而非确定评价机构的人员构成。"},{"k":"教育学|判断题|53","b":"教育学","t":"判断题","ty":"judge","n":53,"q":"教育学之父夸美纽斯在《大教学论》中正式提出和论证了“班级授课制”。","o":null,"a":"对","e":"夸美纽斯在《大教学论》中正式提出并论证了“班级授课制”。"},{"k":"教育学|判断题|54","b":"教育学","t":"判断题","ty":"judge","n":54,"q":"私学是始于春秋时期孟子设的学舍。","o":null,"a":"错","e":"私学始于春秋时期孔子设的学舍，不是孟子。"},{"k":"教育学|判断题|55","b":"教育学","t":"判断题","ty":"judge","n":55,"q":"“学在官府”、“吏师合一”是指官学的教育形式。","o":null,"a":"对","e":"“学在官府”“吏师合一”指的就是官学的教育形式。"},{"k":"教育学|判断题|56","b":"教育学","t":"判断题","ty":"judge","n":56,"q":"我国最早采用班级授课制的是京师同文馆。","o":null,"a":"对","e":"我国最早采用班级授课制的是京师同文馆。"},{"k":"教育学|判断题|57","b":"教育学","t":"判断题","ty":"judge","n":57,"q":"孟子主张在教学上发挥学生的主动性，提倡存疑的精神（尽信书，则不如无书）。","o":null,"a":"对","e":"孟子主张在教学上发挥学生的主动性，提倡存疑精神（尽信书，则不如无书）。"},{"k":"教育学|判断题|58","b":"教育学","t":"判断题","ty":"judge","n":58,"q":"高校教学是实现高等教育职能的基本途径。","o":null,"a":"对","e":"高校教学是实现高等教育职能的基本途径。"},{"k":"教育学|判断题|59","b":"教育学","t":"判断题","ty":"judge","n":59,"q":"在教学过程中，学生在教师的指导下不断成长，教师也在完成教学任务的同时得到提高，即古人所谓的“教学相长”。","o":null,"a":"对","e":"教学过程中师生共同成长，即古人所谓的“教学相长”。"},{"k":"教育学|判断题|60","b":"教育学","t":"判断题","ty":"judge","n":60,"q":"学习者目前水平与期望学习者达到的水平之间的差距是进行教学设计的后端分析。","o":null,"a":"错","e":"学习者现有水平与期望水平之间的差距是教学设计的前端分析，不是后端分析。"},{"k":"教育学|判断题|61","b":"教育学","t":"判断题","ty":"judge","n":61,"q":"学习者特征分析一般在开始授课之前详细地作一次，不必每节课的设计都作。","o":null,"a":"对","e":"学习者特征分析一般在开始授课之前详细地作一次，不必每节课的设计都作。"},{"k":"教育学|判断题|62","b":"教育学","t":"判断题","ty":"judge","n":62,"q":"教学目标可以是不可观察、不可测量的。","o":null,"a":"错","e":"教学目标应是可观察、可测量的，故该说法错误。"},{"k":"教育学|判断题|63","b":"教育学","t":"判断题","ty":"judge","n":63,"q":"教学方法直接影响教师教学工作的效能。","o":null,"a":"对","e":"教学方法直接影响教师教学工作的效能。"},{"k":"教育学|判断题|64","b":"教育学","t":"判断题","ty":"judge","n":64,"q":"讲授法主要以肢体语言为传递和交流教学信息的工具，教师语言素养的水平不会对教学效果产生直接的影响。","o":null,"a":"错","e":"讲授法主要以语言为传递和交流教学信息的工具，教师语言素养直接影响教学效果。"},{"k":"教育学|判断题|65","b":"教育学","t":"判断题","ty":"judge","n":65,"q":"案例教学法是以学生为中心，师生互动的教学过程。","o":null,"a":"对","e":"案例教学法是以学生为中心、师生互动的教学过程。"},{"k":"教育学|判断题|66","b":"教育学","t":"判断题","ty":"judge","n":66,"q":"案例教学法中学生是导演，教师是演员。","o":null,"a":"错","e":"案例教学法中学生是演员、教师是导演，题干把二者说反了。"},{"k":"教育学|判断题|67","b":"教育学","t":"判断题","ty":"judge","n":67,"q":"素质教育包括四个方面：思想道德素质、文化素质、业务素质、身心素质。其中思想道德素质是根本，文化素质是基础，业务素质是本领，身心素质是本钱。","o":null,"a":"对","e":"素质教育四方面中，思想道德素质是根本、文化素质是基础、业务素质是本领、身心素质是本钱。"},{"k":"教育学|判断题|68","b":"教育学","t":"判断题","ty":"judge","n":68,"q":"全面素质教育以人的综合素质，尤其以人的创新精神和实践能力为质量标准，反映了21世纪信息时代的新特点，这对于更新学生发展观念，改革人才培养模式是非常必要的。","o":null,"a":"对","e":"全面素质教育以人的综合素质尤其以创新精神和实践能力为质量标准，反映21世纪信息时代的新特点。"},{"k":"教育学|判断题|69","b":"教育学","t":"判断题","ty":"judge","n":69,"q":"“以学生为中心”，最根本的是要实现以“教”为中心向以“学”为中心的转变，也就是学校要从“课堂、教师、教材”“老三中心”，向“学生、学习、学习过程”“新三中心”转变，真正关注学生的学习。","o":null,"a":"对","e":"“以学生为中心”即由“课堂、教师、教材”老三中心向“学生、学习、学习过程”新三中心转变，真正关注学生的学习。"},{"k":"教育学|判断题|70","b":"教育学","t":"判断题","ty":"judge","n":70,"q":"大学生群体在组织结构上可分为正式的群体和非正式的群体两大类。非正式群体只会产生是负面影响。","o":null,"a":"错","e":"非正式群体既有负面影响也有积极影响，并非只会产生负面影响。"},{"k":"教育学|判断题|71","b":"教育学","t":"判断题","ty":"judge","n":71,"q":"高校学生服务涵盖了学生教育、学生管理和学生服务等三个方面。它们相互联系，相互制约，构成了一个有机的整体，对学生的成长和发展起着十分重要的保障作用。学生教育主要包括思想政治教育、人文素质教育、社会实践教育、心理健康教育以及国防教育，其核心是加强心理健康教育。","o":null,"a":"错","e":"学生教育的核心是思想政治教育，而不是心理健康教育。"},{"k":"教育学|判断题|72","b":"教育学","t":"判断题","ty":"judge","n":72,"q":"如何提高思想政治教育的实效性，是目前高等教育必须解决的重大问题。","o":null,"a":"对","e":"如何提高思想政治教育的实效性，是目前高等教育必须解决的重大问题。"},{"k":"教育学|判断题|73","b":"教育学","t":"判断题","ty":"judge","n":73,"q":"马斯洛的需要层次理论认为，人的基本需要从低级到高级依次是生理需要、安全需要、尊重的需要、自我实现的需要、归属与爱的需要。","o":null,"a":"错","e":"马斯洛需要由低到高依次为生理、安全、归属与爱、尊重、自我实现，题干顺序有误。"},{"k":"教育学|判断题|74","b":"教育学","t":"判断题","ty":"judge","n":74,"q":"高校学生社团属于学生自发性组织，主要作用是丰富业余生活，对于学生的成长和素质教育作用不大。","o":null,"a":"错","e":"学生社团对学生成长和素质教育具有重要作用，故该说法错误。"},{"k":"教育学|判断题|75","b":"教育学","t":"判断题","ty":"judge","n":75,"q":"依据学生评价在教育教学活动中发挥的作用，可以将其分为四种即定位性评价、形成性评价、诊断性评价、总结性评价。","o":null,"a":"对","e":"按学生评价发挥的作用，可分为定位性评价、形成性评价、诊断性评价和总结性评价。"},{"k":"教育学|判断题|76","b":"教育学","t":"判断题","ty":"judge","n":76,"q":"形成性评价主要是在教学过程中，检查学生的进步情况，为师生提供有关教学情况的连续性的成功或失败的反馈信息。师生利用这些信息，不断地加强成功之处，纠正已经出现的失误，以达到改进教和学的目的。","o":null,"a":"对","e":"形成性评价在教学过程中进行，为师生提供连续性的成功或失败反馈以改进教与学。"},{"k":"教育学|判断题|77","b":"教育学","t":"判断题","ty":"judge","n":77,"q":"高等教育大众化，指的就是高等教育由“精英高等教育”走向“大众高等教育”的发展过程。","o":null,"a":"对","e":"高等教育大众化指高等教育由“精英高等教育”走向“大众高等教育”的发展过程。"},{"k":"教育学|判断题|78","b":"教育学","t":"判断题","ty":"judge","n":78,"q":"每个国家高等教育规模扩张的速度总是向上的。","o":null,"a":"错","e":"各国高等教育规模扩张的速度并非总是向上的，也会出现波动甚至收缩。"},{"k":"教育学|判断题|79","b":"教育学","t":"判断题","ty":"judge","n":79,"q":"知识型社会与现代工业社会的差别在它的技术能力，它把知识作为间接的生产力。","o":null,"a":"错","e":"知识型社会把知识作为直接生产力，而不是间接生产力。"},{"k":"教育学|判断题|80","b":"教育学","t":"判断题","ty":"judge","n":80,"q":"各国高等教育大众化的共同经验是发展短期应用型高等学校，以承担数量众多的新型学生。","o":null,"a":"对","e":"各国高等教育大众化的共同经验是发展短期应用型高等学校，以承担数量众多的新型学生。"},{"k":"教育学|判断题|81","b":"教育学","t":"判断题","ty":"judge","n":81,"q":"1998年高校扩招政策在中国高等教育发展史上具有里程碑式的意义。","o":null,"a":"错","e":"我国高校扩招始于1999年，不是1998年。"},{"k":"教育学|判断题|82","b":"教育学","t":"判 function hl(t,kw){
  if(!kw)return esc(t);
  const s=String(t);
  let re;
  try{re=new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');}catch(e){return esc(t);}
  let out='',last=0,m;
  while((m=re.exec(s))!==null){
    if(m[0]===''){re.lastIndex++;continue;}      /* 防零宽匹配死循环 */
    if(m.index>last)out+=esc(s.slice(last,m.index));
    out+='<mark>'+esc(m[0])+'</mark>';
    last=m.index+m[0].length;
  }
  return out+esc(s.slice(last));
}
/* 错题本中仍然存在于题库的题数（防止题库变动后统计虚高） */
function wcount(){let n=0;for(const k of wrong)if(byKey[k])n++;return n;}
/* ---------- 次数统计：刷题次数 / 对次数 / 错次数 / 净次数 ---------- */
function qcnt(k){return cnt[k]||{c:0,w:0};}
function totals(){
  let c=0,w=0;
  for(const k in cnt){ if(!byKey[k])continue; c+=cnt[k].c||0; w+=cnt[k].w||0; }
  return {c:c,w:w,total:c+w,net:c-w};
}
function netCls(n){return n>0?'netup':(n<0?'netdown':'netzero');}

/* ============================================================
   考试模式
   试卷构成：单选 40 题 × 1 分 + 判断 30 题 × 1 分 + 多选 20 题 × 1.5 分 = 100 分
   抽题规则：两个题库（教育心理学 / 教育学）按各自题量比例分配名额，
             再在「题库 × 题型」内随机抽取；用 Fisher-Yates 洗牌保证均匀。
   与练习模式的关键差异：
     · 考试中不判分、不给解析，只记录你的选择（选中态≠对错态）
     · 交卷后统一批改，多选题必须与标准答案完全一致才得分（不给半分）
     · 成绩单独存 localStorage，并可在首页看到历史记录
   ============================================================ */
const EXAM_SPEC=[
  {ty:'single',  n:40, per:1,   name:'单选题'},
  {ty:'judge',   n:30, per:1,   name:'判断题'},
  {ty:'multiple',n:20, per:1.5, name:'多选题'}
];
const EXAM_FULL=100;                       /* 满分，用于自检 */
const EXAM_MIN=20;                         /* 及格线，仅用于结果页提示 */
const EXAM_KEY='tk_exam_hist';             /* 历史成绩 */
const EXAM_LIMIT=60*60*1000;               /* 默认限时 60 分钟 */

let examHist=LS.get(EXAM_KEY,[]);

/* ---------- 抽题 ---------- */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
/* 把 need 个名额按各题库题量比例摊到题库上，总和恰好等于 need。
   用「最大余数法」分配：先取整，再把剩下的名额按小数部分从大到小补。
   这样 20 道多选在两个题库之间不会出现 0 或全部落在一侧。 */
function splitByBank(ty,need){
  const banks=[];
  D.forEach(function(q){ if(q.ty===ty&&banks.indexOf(q.b)<0)banks.push(q.b); });
  const pool=banks.map(function(b){
    return {b:b,items:D.filter(function(q){return q.ty===ty&&q.b===b;}).
      map(function(q){return q.i;})};
  });
  pool.sort(function(a,b){return BANKORDER[a.b]-BANKORDER[b.b];});
  const total=pool.reduce(function(s,p){return s+p.items.length;},0);
  if(!total||!need)return pool.map(function(p){return {b:p.b,items:p.items,quota:0};});
  const exact=pool.map(function(p){return p.items.length/total*need;});
  const quota=exact.map(function(x){return Math.floor(x);});
  let left=need-quota.reduce(function(s,x){return s+x;},0);
  /* 余数大的先补；并列时题量大的先补，保证结果稳定 */
  const order=pool.map(function(p,k){return k;}).sort(function(a,b){
    const d=(exact[b]-quota[b])-(exact[a]-quota[a]);
    return d!==0?d:(pool[b].items.length-pool[a].items.length);
  });
  for(let i=0;left>0&&order.length;i++,left--)quota[order[i%order.length]]++;
  return pool.map(function(p,k){return {b:p.b,items:p.items,quota:quota[k]};});
}
/* 生成一套试卷：返回 {list:[题索引], spec:[分项统计]} */
function buildPaper(){
  const list=[],spec=[];
  EXAM_SPEC.forEach(function(s){
    const parts=splitByBank(s.ty,s.n);
    let picked=0;
    parts.forEach(function(p){
      const take=Math.min(p.quota,p.items.length);
      const chosen=shuffle(p.items.slice()).slice(0,take);
      list.push.apply(list,chosen);
      picked+=chosen.length;
    });
    /* 兜底：某个题型名额没凑够（题库不足）时，从该题型全局再补，
       宁可跨题库调整，也不能让试卷少题——题数直接决定满分。 */
    if(picked<s.n){
      const rest=shuffle(D.filter(function(q){return q.ty===s.ty&&list.indexOf(q.i)<0;})
        .map(function(q){return q.i;}));
      const add=rest.slice(0,s.n-picked);
      list.push.apply(list,add);
      picked+=add.length;
    }
    spec.push({ty:s.ty,name:s.name,n:picked,per:s.per,score:picked*s.per});
  });
  /* 组内按题型排序（单选→判断→多选），符合考试习惯 */
  const sorted=[];
  EXAM_SPEC.forEach(function(s){
    list.forEach(function(i){if(D[i].ty===s.ty)sorted.push(i);});
  });
  return {list:sorted,spec:spec};
}
function paperFull(spec){return spec.reduce(function(a,s){return a+s.score;},0);}

/* ---------- 考试状态 ---------- */
const E={view:'setup',list:[],spec:[],ans:{},idx:0,start:0,end:0,result:null,sel:[],limit:EXAM_LIMIT};
function examRunning(){return E.view==='paper';}

/* ---------- 计时 ---------- */
let examTimer=null;
function fmtDur(ms){
  if(ms<0)ms=0;
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  const p=function(x){return (x<10?'0':'')+x;};
  return h?h+':'+p(m)+':'+p(ss):p(m)+':'+p(ss);
}
function examTick(){
  if(E.view!=='paper')return;
  const el=document.getElementById('exTime');
  if(!el)return;
  const used=Date.now()-E.start;
  const left=E.limit-used;
  el.textContent=left>0?fmtDur(left):'00:00';
  el.className='et'+(left<=300000?' warn':'');
  if(left<=0)examSubmit(true);            /* 到点自动交卷 */
}
function startExamTimer(){
  clearInterval(examTimer);
  examTimer=setInterval(examTick,500);
  examTick();
}
function stopExamTimer(){clearInterval(examTimer);examTimer=null;}

/* ---------- 开始 / 交卷 ---------- */
function startExam(limitMs){
  const p=buildPaper();
  E.view='paper';E.list=p.list;E.spec=p.spec;E.ans={};E.idx=0;E.result=null;E.sel=[];
  E.start=Date.now();E.end=0;E.limit=limitMs||EXAM_LIMIT;
  S.view='exam';
  render();
  startExamTimer();
  toast('考试开始，共 '+E.list.length+' 题');
}
/* 交卷：批改 + 计分 + 存历史。auto=true 表示超时自动交卷 */
function examSubmit(auto){
  if(E.view!=='paper'&&E.view!=='paper2')return;
  const spent=Date.now()-E.start;
  let right=0,got=0;
  const detail=[];
  E.spec.forEach(function(s){
    let r=0,w=0,skip=0,g=0;
    E.list.forEach(function(qi,i){
      const q=D[qi];if(q.ty!==s.ty)return;
      const a=E.ans[i];
      const corr=q.a.split('').slice().sort();
      if(!a||!a.length){skip++;return;}
      const sel=a.slice().sort();
      const ok=sel.length===corr.length&&sel.every(function(x,k){return x===corr[k];});
      if(ok){r++;g+=s.per;}else w++;
    });
    right+=r;got+=g;
    /* 该题型总题数 = 卷面上该题型数量（用 s.n 统计的实到题数） */
    detail.push({ty:s.ty,name:s.name,n:s.n,per:s.per,right:r,wrong:w,skip:skip,score:g});
  });
  /* 得分保留一位小数：1.5 分制下会出现 0.5，四舍五入到整数会失真 */
  const score=Math.round(got*10)/10;
  const total=E.list.length;
  let answered=0;
  for(const k in E.ans)if(E.ans[k]&&E.ans[k].length)answered++;

  E.end=Date.now();
  E.result={score:score,right:right,total:total,answered:answered,
            spent:spent,detail:detail,auto:!!auto,at:Date.now()};
  E.view='result';
  stopExamTimer();
  /* 写入历史（最多保留 50 次） */
  examHist.unshift({score:score,right:right,total:total,spent:spent,at:E.result.at});
  if(examHist.length>50)examHist.length=50;
  LS.set(EXAM_KEY,examHist);
  /* 同步进练习进度：考试答错的题同样进错题本与统计，
     让「错题本」在整个 App 里是同一个概念。 */
  let added=0;
  E.list.forEach(function(qi,i){
    const q=D[qi],a=E.ans[i];
    if(!a||!a.length)return;
    const corr=q.a.split('').slice().sort();
    const sel=a.slice().sort();
    const ok=sel.length===corr.length&&sel.every(function(x,k){return x===corr[k];});
    prog[q.k]=ok?1:0;
    const c=cnt[q.k]||(cnt[q.k]={c:0,w:0});
    if(ok)c.c++;else c.w++;
    if(!ok&&wrong.indexOf(q.k)<0){wrong.push(q.k);added++;}
  });
  saveP();saveCnt();saveW();
  render();
  toast(auto?'时间到，已自动交卷':'已交卷'+(added?'，'+added+' 道错题已进错题本':''));
}

function countExamRight(){
  let ok=0,no=0,skip=0;
  E.list.forEach(function(qi,i){

  });
  return {ok:ok,no:no,skip:skip};
}

/* ---------- 考试作答 ---------- */
function epick(v){
  if(E.view!=='paper')return;
  const q=D[E.list[E.idx]];
  const cur=E.ans[E.idx]||(E.ans[E.idx]=[]);
  if(q.ty==='multiple'){
    const i=cur.indexOf(v);
    if(i>=0)cur.splice(i,1);else cur.push(v);
    cur.sort();
    E.sel=cur.slice();
    render(true);                  /* 多选题勾选不跳回顶部 */
  }else{
    E.ans[E.idx]=[v];
    /* 单选、判断答完自动前进，符合考试手感；最后一题不跳，避免误触交卷 */
    if(E.idx<E.list.length-1){egoto(E.idx+1);return;}
    E.sel=[v];render(true);
  }
}
function egoto(i){
  if(i<0||i>=E.list.length)return;
  E.idx=i;E.sel=(E.ans[i]||[]).slice();
  render();
  window.scrollTo(0,0);
}
function emove(d){
  const ni=E.idx+d;
  if(ni<0||ni>=E.list.length){toast(d>0?'已经是最后一题了':'已经是第一题了');return;}
  egoto(ni);
}
function examQuit(){
  ask('退出后本次考试作废，未交卷的答案不会计入成绩。\n确定退出吗？',function(){
    stopExamTimer();E.view='setup';S.view='examsetup';render();
  },true);
}

/* ---------- 渲染 ---------- */
function render(keepScroll){
  /* 重绘前把笔记输入框的草稿存起来，避免打字被刷掉 */
  const ta=document.getElementById('ntext');
  if(ta&&ta.dataset&&ta.dataset.qk)niText[ta.dataset.qk]=ta.value;
  if(S.view==='home')app().innerHTML=viewHome();
  else if(S.view==='wrong')app().innerHTML=viewWrong();
  else if(S.view==='card')app().innerHTML=viewCard();
  else if(S.view==='ai')app().innerHTML=viewAI();
  /* 考试模式：S.view 只标「在考试里」，具体是开始页/答题页/成绩单由 E.view 决定。
     这样 @media 与返回键逻辑都不用重复判断。 */
  else if(S.view==='examsetup')app().innerHTML=viewExamSetup();
  else if(S.view==='exam'){
    if(E.view==='result')app().innerHTML=viewExamResult();
    else if(E.view==='card')app().innerHTML=viewExamCard();
    else if(E.view==='paper'||E.view==='paper2')app().innerHTML=viewExamPaper();
    else app().innerHTML=viewExamSetup();
  }
  else app().innerHTML=viewPractice();
  /* 重绘后回填草稿 */
  const ta2=document.getElementById('ntext');
  if(ta2&&ta2.dataset&&ta2.dataset.qk&&niText[ta2.dataset.qk])ta2.value=niText[ta2.dataset.qk];
  if(S.view==='home'){
    const el=document.getElementById('sInput');
    if(el)el.addEventListener('input',function(){S.search=this.value;document.getElementById('sRes').innerHTML=searchHtml();});
  }
  if(S.view==='ai'){
    const th=document.getElementById('aiThink');
    if(th)th.addEventListener('change',function(){
      const row=document.getElementById('effRow');
      if(row)row.style.display=(this.value==='enabled')?'':'none';
    });
  }
  if(S.view==='practice'&&S.from==='group'){
    const j=document.getElementById('jump');
    if(j)j.addEventListener('change',function(){
      const v=parseInt(this.value,10);
      if(!v)return;
      const at=S.list.findIndex(i=>D[i].n===v);
      if(at<0){toast('本组没有第 '+v+' 题');this.value='';return;}
      gotoIdx(at);
    });
  }
  if(keepScroll)return;                 /* 同题内的勾选/判分/重做不跳回顶部 */
  window.scrollTo(0,0);
  if(S.view==='card'){                  /* 打开答题卡时把当前题滚到可见区 */
    const c=document.getElementById('cellcur');
    if(c&&c.scrollIntoView){try{c.scrollIntoView({block:'center'});}catch(e){}}
  }
  if(S.view==='exam'&&E.view==='card'){ /* 考试答题卡同理 */
    const c=document.getElementById('excellcur');
    if(c&&c.scrollIntoView){try{c.scrollIntoView({block:'center'});}catch(e){}}
  }
}

/* ---------- 导航与作答 ---------- */
function gotoIdx(i){
  S.idx=i;S.sel=[];S.done=false;S.res=false;S.revisit=false;
  const a=S.ans[i];            /* 只回显“本次练习中”已作答的题；新进入一律从头答，不预显答案 */
  if(a){S.sel=a.sel.slice();S.res=a.res;S.done=true;S.revisit=true;}
  if(S.from==='group'){pos[S.group]=i;savePos();}
  /* 切题时收起上一题的 AI 结果与编辑态 */
  const qk=D[S.list[i]]?D[S.list[i]].k:null;
  if(AI.qk!==qk){AI.qk=qk;AI.state='idle';AI.text='';AI.err='';noteEdit=null;}
  render();
}
function startGroup(g){
  const grp=gmap[g];if(!grp)return;
  S.view='practice';S.from='group';S.back='home';S.group=g;S.list=grp.items.slice();S.title=g;S.ans={};
  gotoIdx(Math.max(0,Math.min(pos[g]||0,S.list.length-1)));
}
function openOne(k,back){
  const q=byKey[k];if(!q)return;
  S.view='practice';S.from='single';S.back=back||'home';S.group=null;S.list=[q.i];S.title=q.b+' · '+q.t;S.ans={};
  gotoIdx(0);
}
function practiceWrong(){
  const list=wrong.map(k=>byKey[k]).filter(Boolean).map(x=>x.i);
  if(!list.length){toast('错题本是空的');return;}
  S.view='practice';S.from='wrong';S.back='wrong';S.group=null;S.list=list;S.title='错题本';S.ans={};
  gotoIdx(0);
}
function move(d){
  const ni=S.idx+d;
  if(ni<0||ni>=S.list.length){toast(d>0?'已经是最后一题了':'已经是第一题了');return;}
  gotoIdx(ni);
}
function randJump(){
  const un=S.list.filter(i=>prog[D[i].k]===undefined);
  const pool=un.length?un:S.list;
  gotoIdx(S.list.indexOf(pool[Math.floor(Math.random()*pool.length)]));
}
function pick(v){
  const q=D[S.list[S.idx]];
  if(S.done)return;
  if(q.ty==='multiple'){
    const i=S.sel.indexOf(v);
    if(i>=0)S.sel.splice(i,1);else S.sel.push(v);
    S.sel.sort();render(true);          /* 勾选不跳回顶部 */
  }else{S.sel=[v];judge();}
}
function judge(){
  const q=D[S.list[S.idx]];
  if(S.done||!S.sel.length)return;
  const corr=q.a.split('').slice().sort();
  const sel=S.sel.slice().sort();
  S.res=sel.length===corr.length&&sel.every((x,i)=>x===corr[i]);
  S.done=true;
  S.ans[S.idx]={sel:S.sel.slice(),res:S.res};
  prog[q.k]=S.res?1:0;saveP();
  const c=cnt[q.k]||(cnt[q.k]={c:0,w:0});   /* 累计次数 */
  if(S.res)c.c++;else c.w++;
  saveCnt();
  /* 答错自动进错题本；答对不再自动移出（按需求改为只能手动移出） */
  if(!S.res&&wrong.indexOf(q.k)<0){wrong.push(q.k);saveW();}
  render(true);                         /* 判分后留在原位看解析 */
}
function redo(){
  delete S.ans[S.idx];
  S.done=false;S.res=false;S.sel=[];S.revisit=false;render(true);
}
function rmWrong(k){
  const i=wrong.indexOf(k);
  if(i<0)return;

/* 导出：默认下载文件；浏览器禁止下载时（部分 iOS 环境）退回复制到剪贴板，
   两条路都给，免得分不清是功能坏了还是环境限制。 */
function backupExport(withKey){
  const keys=withKey?BK_KEYS:BK_SAFE, data={__app:'题库练习',__ver:1,__time:new Date().toISOString()};
  keys.forEach(function(k){
    const raw=localStorage.getItem(k);

  });
  /* 导出时顺手把缓存裁剪到上限内，避免备份文件无谓地变大 */
  if(data.tk_aicache){
    const ks=Object.keys(data.tk_aicache);
    if(ks.length>CACHE_MAX){
      ks.sort(function(a,b){return (data.tk_aicache[a].time||0)-(data.tk_aicache[b].time||0);});
      for(let i=0;i<ks.length-CACHE_MAX;i++)delete data.tk_aicache[ks[i]];
    }
  }
  const txt=JSON.stringify(data,null,1);
  const nCache=data.tk_aicache?Object.keys(data.tk_aicache).length:0;
  const nNotes=data.tk_notes?Object.keys(data.tk_notes).reduce(function(s,k){
    return s+(Array.isArray(data.tk_notes[k])?data.tk_notes[k].length:0);},0):0;

    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},4000);   /* 立刻 revoke 会让部分浏览器下载失败 */
    downloaded=true;

  AI.bkMsg='已导出 '+nCache+' 条解析、'+nNotes+' 条笔记、'+nWrong+' 道错题、'+nExam+' 次考试记录'

  if(!d||typeof d!=='object'||Array.isArray(d))return '内容不是备份对象（应以 { 开头）。';
  const pick=BK_KEYS.filter(function(k){return d[k]!==undefined&&d[k]!==null;});
  if(!pick.length)return '没有找到可导入的数据（未包含 tk_prog / tk_notes / tk_aicache 等字段）。';
  const bad=[];

/* 粗粒度 Markdown → HTML（先转义再渲染，防止 XSS） */
function mdToHtml(src){
  const code=[];
  let s=esc(src||'');
  s=s.replace(/`([^`\n]+)`/g,function(m,c){code.push('<code>'+c+'</code>');return '\u0000'+(code.length-1)+'\u0000';});
  s=s.replace(/^\s{0,3}#{1,6}\s*(.+?)\s*$/gm,'<h3>$1</h3>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  /* 列表必须逐行转换，且一行只能匹配到行尾。
     原写法 `[-*+]\s+(.+)` 里的 `.` 不匹配 \n，看起来没问题，
     但列表项后面紧跟 `### 小标题` 时（模型常常不空行），
     整段会被吞进同一个 <li>，导致下一个标题连同内容凭空消失。
     加上“行尾断言”并把内容限定为「不含换行」，从根上排除这种吞并。 */
  s=s.replace(/^\s{0,3}[-*+][ \t]+([^\n]+?)[ \t]*$/gm,'<li>$1</li>');
  s=s.replace(/^\s{0,3}\d+[.、)][ \t]+([^\n]+?)[ \t]*$/gm,'<li>$1</li>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  const blocks=s.split(/\n{2,}/).map(function(b){
    b=b.trim(); if(!b)return '';
    if(/^<(h3|ul|ol|li)/.test(b))return b;
    return '<p>'+b.replace(/\n/g,'<br>')+'</p>';
  });
  let out=blocks.join('');
  /* 把所有零散的 <li> 收拢进 <ul>：
     之前用「<li>…</li> 后面不再紧跟 <li>」来配对，一旦模型在列表项之间空行
     （分块后各自成段），配对就断掉，<li> 被塞进 <p> 里变成没有序号的裸文本——
     这正是「结构很乱」的主要来源。改为整体扫描、按连续 <li> 分组。 */
  out=out.replace(/(?:<li>[\s\S]*?<\/li>\s*)+/g,function(seg){
    return '<ul>'+seg.replace(/\s+$/,'')+'</ul>';
  });
  return out.replace(/\u0000(\d+)\u0000/g,function(m,i){return code[+i];});
}

/* 组装请求体：deepseek-flash 即 DeepSeek-V4.1-Flash。
   注意：思考模式下 temperature 无效（官方会静默忽略），因此只透传 thinking 与 reasoning_effort。 */
function aiBody(model,messages,maxTokens,stream){
  const b={model:model||'deepseek-flash',messages:messages,stream:!!stream,max_tokens:maxTokens};
  const think=aiCfg.think===undefined?'enabled':aiCfg.think;

/* 流式请求：每收到一段增量就回调 onDelta(chunk, kind)
   kind='reason' 表示思维链增量（只用于显示进度，绝不并入正文）
   kind='text'   表示正文增量
   返回 {text, reason} */
/* 把网络层的异常翻译成用户看得懂、能照做的话。
   file:// 打开时页面源是 null，任何跨域请求都会被浏览器 CORS 拦下
   （请求根本没发出去，所以报的是 TypeError 或 "Load failed"/"Failed to fetch"）。
   这不是密钥或网络的问题，必须说清楚，否则用户会一直换密钥。 */
function netErr(e,url){
  const m=String((e&&e.message)||e||'');
  const isFile=(location&&location.protocol==='file:');
  if(isFile&&(e instanceof TypeError||/Load failed|Failed to fetch|NetworkError|not allowed|CORS/i.test(m)))
    return new Error('双击打开（file://）时浏览器会拦截跨域请求，所以连不上 DeepSeek。\n'
      +'请把本文件放到本地服务器上打开（「AI 设置」页有具体命令），'
      +'或改用 Chrome / Edge 打开同一地址。');
  if(e instanceof TypeError)
    return new Error('网络不可达：'+(url?('无法连接 '+url+'。'):'')+'请检查网络，或确认「AI 设置」里的接口地址（Base URL）没有写错。');
  return e;
}
async function aiStream(messages,maxTokens,onDelta,timeoutMs){
  const ctrl=new AbortController();
  let got=false;
  /* 首字节超时与整体超时分开：流式下首个 chunk 到达即视为连接正常 */
  const tm=setTimeout(function(){ctrl.abort();},timeoutMs||90000);
  try{
    const r=await fetch((aiCfg.base||'https://api.deepseek.com').replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+(aiCfg.key||'').trim()},
      body:JSON.stringify(aiBody(aiCfg.model,messages,maxTokens,true)),
      signal:ctrl.signal
    });
    if(!r.ok){
      const txt=await r.text();
      let j=null;try{j=JSON.parse(txt);}catch(e){}
      throw httpErr(r.status,(j&&j.error&&j.error.message)||txt.slice(0,200));
    }
    if(!r.body||!r.body.getReader){                 /* 环境不支持流式，退回整包读取 */
      const txt=await r.text();
      return parseWhole(txt);
    }
    const reader=r.body.getReader(),dec=new TextDecoder('utf-8');
    let buf='',text='',reason='',finish='';
    for(;;){
      const p=await reader.read();
      if(p.done)break;
      buf+=dec.decode(p.value,{stream:true});
      /* SSE：以空行分隔事件；逐行解析 data: */
      let nl;
      while((nl=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,nl).trim();
        buf=buf.slice(nl+1);
        if(!line||line.charAt(0)===':')continue;
        if(line.indexOf('data:')!==0)continue;
        const payload=line.slice(5).trim();
        if(payload==='[DONE]')continue;
        let piece=null;try{piece=JSON.parse(payload);}catch(e){continue;}
        const ch=piece&&piece.choices&&piece.choices[0];
        const d=ch&&ch.delta;
        if(ch&&ch.finish_reason)finish=ch.finish_reason;
        if(!d)continue;
        if(d.reasoning_content){got=true;reason+=d.reasoning_content;if(onDelta)onDelta(d.reasoning_content,'reason');}
        if(d.content){got=true;text+=d.content;if(onDelta)onDelta(d.content,'text');}
      }
      clearTimeout(tm);       /* 收到数据即撤掉超时；长回答下总时长由外部逻辑兜底 */
    }
    /* 正文为空时给出能定位问题的提示，而不是一句笼统的「返回内容为空」。
       最常见的两种：
       - finish_reason='length'：max_tokens 被思维链吃光（思考模式预算不足）
       - 只有思维链没有正文：模型没来得及写结论 */
    if(!text){
      if(finish==='length'&&reason)
        throw new Error('模型把输出额度用在思考上，没来得及写解析。请到「AI 设置」把思考强度调低，或改用快速模式。');
      if(/^\s*$/.test(reason))
        throw new Error('模型没有返回内容'+(finish?'（finish_reason='+finish+'）':'')+'，请重试');
      throw new Error('模型只返回了思考过程、没有给出解析，请重试或改用快速模式');
    }
    return {text:text,reason:reason,finish:finish};
  }catch(e){
    if(e&&e.name==='AbortError')throw new Error('请求超时，请检查网络后重试');
    throw netErr(e,aiCfg.base||'https://api.deepseek.com');
  }finally{clearTimeout(tm);}
}
/* 非流式响应整包解析（含 HTTP 错误分类） */
function httpErr(status,m){
  if(status===401)m='密钥无效或已失效（401）。请到「AI 设置」重新填写。';
  else if(status===402)m='DeepSeek 账户余额不足（402），请先充值。';
  else if(status===429)m='请求太频繁或已达限额（429），稍后再试。';
  else if(status===400&&/model/i.test(m))m='模型名不被接受（400）：'+m+'。请在「AI 设置」里改用 deepseek-flash。';
  else if(status>=500)m='DeepSeek 服务器错误（'+status+'），稍后再试。';
  return new Error('HTTP '+status+' · '+m);
}
function parseWhole(txt){
  let j=null;try{j=JSON.parse(txt);}catch(e){}
  const ch=j&&j.choices&&j.choices[0];
  const msg=ch&&ch.message;
  if(!msg)throw new Error('返回内容为空，请重试');
  const text=String(msg.content||'').trim(), reason=String(msg.reasoning_content||'').trim();
  if(!text){
    if(ch.finish_reason==='length'&&reason)
      throw new Error('模型把输出额度用在思考上，没来得及写解析。请在「AI 设置」调低思考强度，或改用快速模式。');
    throw new Error('模型没有返回解析内容'+(ch.finish_reason?'（finish_reason='+ch.finish_reason+'）':'')+'，请重试');
  }
  /* 正文优先；思维链绝不作为解析内容返回 */
  return {text:text,reason:reason,finish:ch.finish_reason||''};
}
async function aiFetch(messages,maxTokens,timeoutMs){
  const ctrl=new AbortController();
  const tm=setTimeout(function(){ctrl.abort();},timeoutMs||75000);
  try{
    const r=await fetch((aiCfg.base||'https://api.deepseek.com').replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+(aiCfg.key||'').trim()},
      body:JSON.stringify(aiBody(aiCfg.model,messages,maxTokens)),
      signal:ctrl.signal
    });
    const txt=await r.text();
    let j=null;
    try{j=JSON.parse(txt);}catch(e){}
    if(!r.ok)throw httpErr(r.status,(j&&j.error&&j.error.message)||txt.slice(0,200));
    const res=parseWhole(txt);
    return res.text;  }catch(e){
    if(e&&e.name==='AbortError')throw new Error('请求超时，请检查网络后重试');
    throw netErr(e,aiCfg.base||'https://api.deepseek.com');
  }finally{clearTimeout(tm);}
}
async function aiExtract(q,onDelta){
  /* 快速模式：只问三个要点，提示词短、不思考，追求 2～4 秒出结果 */
  const fast=!!aiCfg.fast;
  /* 快速模式：只关掉「思考」，不压缩表达。
     之前把字数压到 300 字，导致逐项原因被挤成几个字（如「概念混淆」），等于没讲。
     现在改为四节结构 + 600 字，速度主要靠关思考来省，而不是靠让 AI 少说话。 */
  /* 解析结构（两模式共用，只有字数下限不同）。
     核心设计：四节对应四个互不重叠的问题，谁都不许越界，这样就不会出现重复段落。
       考点            = 这题在考什么（禁止提前说答案）
       为什么选它      = 正确答案为什么成立（禁止提干扰项）
       其余选项为什么错 = 逐个干扰项错在哪（禁止跨项比较）
       一句话记住      = 压缩成口诀（禁止与上文重复）
     答案对错由「考点」自动生成：答对 → 为什么选它；答错 → 为什么选它 + 其余选项为什么错。

     特别注意判断题（ty:'judge'）：以前让它同时给出「对/错的依据」，等于让模型把两个方向
     都讲一遍 —— 既啰嗦，又容易把「为什么错」和「为什么对」混成一段，读的人根本分不清
     这题到底该选什么。正确做法是只讲「本题实际答案」这一个方向，反向那句单独放到「陷阱」里
     提醒（例如「把『正迁移』记成『负迁移』就会误判为错」），而不是完整论证一遍。 */
  const judge=q&&q.ty==='judge';
  const SEC={
    dian:'\n### 考点\n一句话：考哪个知识点 + 属于识记/理解/应用。**只说考什么，不许提前出现答案文字。**\n',
    why:'\n### 为什么选它\n**只讲正确项，不要提任何干扰项，也不要提易混概念。** 分两点：\n'
       +'(1) 正确项为什么成立（不超过 2 句）；\n'
       +(judge
         ? '(2) 本题实际答案是「对」还是「错」，以及题干里哪个词决定了它，用 `引号` 标出这个词。\n'
         : '(2) 题干里哪个词是判断关键，用 `引号` 标出这个词。\n'),
    other:judge
      ? '\n### 别选错\n**不要重复论证反方向，只指出一句最可能的误判。** 格式固定为 `- 易误判为「对/错」：因为把 X 记成了 Y`，只写一行。\n'
      : '\n### 其余选项为什么错\n每个干扰项一行，格式固定为 `- A：错因归类——具体说明`。\n'
       +'错因归类只能从这四个里选一个：与题干无关 / 概念混淆 / 范围不当 / 表述颠倒。\n'
       +'一行只说这一项，不许跨项比较（如「B 比 C 更…」），**不许另起小节集中辨析易混概念**。\n'
       +'若某干扰项本身说法正确、只是不合题意，归类写「说法本身正确，但不符题意」。\n',
    memo:'\n### 一句话记住\n一句能背下来、考场上想得起来的话，不得与上面任何句子重复。\n'
  };
  const body=fast
    ? '请解析这道题，讲清楚就行，不要寒暄、不要复述题干。\n\n'+qBrief(q)
      +'严格按下面四节输出，节标题一字不改、顺序不变，每节内容只有一处，不许在其他小节里重复：\n'
      +SEC.dian+SEC.why+SEC.other+SEC.memo
    : '请解析下面这道题。题库答案与解析仅供参考，如与你的判断不一致，请明确指出并说明依据。\n\n'
      +qBrief(q)
      +'\n严格按下面四节输出，节标题一字不改、顺序不变，全文 500 字左右（不超过 600 字）。'
      +'每节内容只有一处，不许在其他小节里重复：\n'
      +SEC.dian+SEC.why+SEC.other+SEC.memo
      +'\n底线：分清「知识点本身」与「本题问法」，不要把题库解析原样抄一遍。';
  /* max_tokens 是「思维链 + 正文」共用的预算！
     官方文档：未设置时非思考模式默认 8K，思考模式默认 64K。
     之前给 1400，思考模式下思维链往往就要几千 token，直接把预算吃光，
     结果是 finish_reason=length 且 content 为空 —— 表现为「返回空 / 调用失败」。
     所以思考模式必须给足余量：正文约 600 字≈1000 token，思维链留 6～10 倍。 */
  const r=await aiStream([
    {role:'system',content:fast
      ? '你是教育心理学与教育学的辅导老师。只输出正文，不要寒暄、不要复述题干，也不要写出推理过程。'
      : '你是一位教育心理学与教育学的资深辅导老师，擅长把知识点讲透又不说废话。只输出正文，不要寒暄、不要复述题干。'},
    {role:'user',content:body}
  ],fast?4000:16000,onDelta,120000);
  return r.text;   /* 只取正文，思维链永不作为解析内容 */
}
function copyText(t,ok){
  const done=function(){toast(ok||'已复制');};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,function(){fallbackCopy(t,done);});
  }else fallbackCopy(t,done);
}
function fallbackCopy(t,done){
  try{
    const ta=document.createElement('textarea');
    ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);done();
  }catch(e){toast('复制失败，请长按选择文本');}
}
const needKey=function(){toast('请先在「AI 设置」里填写 DeepSeek 密钥');S.view='ai';render();};

/* AI 运行态扩展：phase 表示当前阶段（'think' 思考中 / 'write' 正在写正文），
   reason 累计思维链（只用来显示进度和字数，绝不并入解析正文）
   saved=true 表示这次解析结果已经自动存进笔记，避免重复存 */
async function runAnalyze(qk,force){
  if(!hasKey()){needKey();return;}
  const q=byKey[qk];if(!q)return;
  /* 命中缓存：直接用，不花 token、不等网络。force=true 表示用户强制重算 */
  if(!force){
    const c=cacheGet(qk);
    if(c){
      AI.qk=qk;AI.state='done';AI.text=c.t;AI.err='';AI.phase='';
      AI.reason='';AI.fromCache=true;AI.saved=false;
      autoSaveAi(qk);                       /* 缓存结果同样要保证已入库 */
      render(true);toast('已用缓存（'+(aiCfg.fast?'快速模式':'完整模式')+'·'+(aiCfg.fast?'-':(aiCfg.effort||'high'))+'）');
      return;
    }
  }
  AI.qk=qk;
  AI.state='run';AI.text='';AI.err='';AI.phase='think';AI.reason='';AI.t0=Date.now();
  AI.fromCache=false;AI.saved=false;
  render(true);
  /* 增量渲染节流：不能每来一个字就重绘整个页面，否则自己把自己卡死 */
  let last=0,timer=null;
  const flush=function(){
    if(AI.qk!==qk)return;                 /* 已切题就别再动 DOM */
    const box=document.getElementById('aiStream');
    if(box)box.innerHTML=mdToHtml(AI.text)||'<span class="aiwait0">正在组织语言…</span>';
    const st=document.getElementById('aiPhase');
    if(st)st.textContent=AI.phase==='think'?'正在思考…':'正在写解析…';
  };
  const onDelta=function(chunk,kind){
    if(AI.qk!==qk)return;
    if(kind==='reason'){AI.phase='think';AI.reason+=chunk;}
    else{AI.phase='write';AI.text+=chunk;}
    const now=Date.now();
    if(now-last>90){last=now;clearTimeout(timer);flush();}
    else if(!timer){timer=setTimeout(function(){timer=null;last=Date.now();flush();},90);}
  };
  try{
    AI.text=await aiExtract(q,onDelta);
    AI.state=AI.text?'done':'err';
    if(!AI.text)AI.err='返回内容为空，请重试';
    else{cachePut(qk,AI.text);autoSaveAi(qk);}   /* 成功即写缓存 + 自动入笔记 */
  }catch(e){
    AI.state='err';AI.err=(e&&e.message)||'未知错误';
    /* 失败时若之前有话，清掉半截内容，免得半成品被误当解析 */
    clearTimeout(timer);
    if(!AI.text)AI.text='';
  }
  clearTimeout(timer);
  render(true);
}
/* 解析完成后自动存进笔记——「一键」的核心：
   同一条解析不重复存（按正文内容比对），避免反复点解析堆出一堆重复笔记 */
function autoSaveAi(qk){
  const t=(AI.text||'').trim();
  if(!t||AI.saved)return false;
  const list=notes[qk]||(notes[qk]=[]);
  const dup=list.some(function(n){return n.src==='ai'&&n.t.trim()===t;});
  if(dup){AI.saved=true;return false;}      /* 已有一条一模一样的，不重复存 */
  list.push({id:'n'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
             t:t,src:'ai',time:Date.now()});
  saveNotes();AI.saved=true;
  return true;
}
function saveAiAsNote(qk){
  if(!AI.text)return;
  /* 正常流程解析完就自动存了；这里主要给「手动删掉后又想补回」用，
     所以允许重复存一条，但缓存一并刷新 */
  cachePut(qk,AI.text);
  const list=notes[qk]||(notes[qk]=[]);
  list.push({id:'n'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
             t:AI.text,src:'ai',time:Date.now()});
  saveNotes();AI.saved=true;toast('已存为笔记');render(true);
}
function addNote(qk,text,src){
  const t=(text||'').trim();if(!t){toast('内容不能为空');return false;}
  const list=notes[qk]||(notes[qk]=[]);
  list.push({id:'n'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
             t:t,src:src||'user',time:Date.now()});
  saveNotes();return true;
}
function delNote(qk,id){
  const list=notes[qk];if(!list)return;
  const i=list.findIndex(function(n){return n.id===id;});
  if(i<0)return;
  list.splice(i,1);
  if(!list.length)delete notes[qk];
  saveNotes();render(true);toast('已删除');
}

      :'<div class="hint">当前不是 file:// 方式，跨域请求可以正常发出，可忽略本节。</div>')
    +'<div class="hint" style="margin-top:8px"><b>手机上最简单：把文件放到免费网页空间，用网址打开。</b></div>'
    +'<div class="hint" style="margin-top:4px">用 Safari 打开 <b>github.com</b> 登录 → 右上「+」新建仓库（勾选 Add a README）'
    +'→ 进仓库点 <b>Add file → Upload files</b> → 选择本文件上传。'
    +'<b>上传前把文件名改成 index.html</b>，这样网址最短。</div>'
    +'<div class="hint" style="margin-top:4px">上传后进 仓库 <b>Settings → Pages</b>，'
    +'Source 选 <b>Deploy from a branch</b>，分支选 main、目录选 /(root)，保存。</div>'
    +'<div class="hint" style="margin-top:4px">等 1～2 分钟，网址是：</div>'
    +'<div class="cmdline">https://你的用户名.github.io/仓库名/</div>'
    +'<div class="hint" style="margin-top:6px">用这个网址打开，AI 就能正常用了。'
    +'之后建议「添加到主屏幕」，跟 App 一样一点就开。'
    +'密钥仍只存在你手机浏览器里，不会因为文件上传而泄露（别人打开也看不到你的密钥）。</div>'
    +'<div class="hint" style="margin-top:8px;color:var(--sec)">电脑上打开本文件时，可在文件所在目录执行下面任一条命令，'
    +'再访问 <b>http://localhost:8000/题库练习.html</b>：</div>'
    +'<div class="cmdline">python -m http.server 8000</div>'
    +'<div class="hint" style="margin-top:6px;color:var(--sec)">说明：本页请求带 Authorization 头，浏览器会先发一次预检（OPTIONS）。'
    +'DeepSeek 官方接口已允许浏览器跨域调用；若填的是第三方中转地址，需要该中转自己支持 CORS。</div>'
    +'</div>';
  /* 缓存管理：解析结果按「题目+模式+强度」缓存，重复解析不再花 token */
  const cks=Object.keys(aiCache);
  h+='<div class="card" style="margin-top:12px"><div class="setrow" style="margin-bottom:6px">'
    +'<label>解析缓存</label><div class="hint">已缓存 <b>'+cks.length+'</b> 条解析。'
    +'同一道题在同一模式与强度下再点解析，会直接读缓存，不消耗用量。'
    +'切换模式或强度会重新解析。</div>'
    +'<div class="row-btns" style="margin-top:10px">'
    +'<button class="btn ghost sm" data-act="cacheclear">清空缓存</button></div></div></div>';
  /* 备份 / 恢复：换地址（改名、传 GitHub Pages）会换掉 localStorage 的来源，
     旧数据读不到，所以提供一个明确的搬运通道。 */
  let nNotesBk=0;for(const nk in notes)if(Array.isArray(notes[nk]))nNotesBk+=notes[nk].length;
  h+='<div class="card" style="margin-top:12px"><div class="setrow" style="margin-bottom:6px">'
    +'<label>备份与恢复</label>'
    +'<div class="hint">当前：答题进度、<b>'+wrong.length+'</b> 道错题、<b>'+nNotesBk+'</b> 条笔记、'
    +'<b>'+cks.length+'</b> 条解析缓存。</div>'
    +'<div class="hint" style="margin-top:6px">数据存在这台设备的浏览器里，'
    +'<b>换网址、换浏览器、清理缓存都会看不到</b>。导出成文件就能带到任何地方。</div>'
    +'<div class="row-btns" style="margin-top:10px">'
    +'<button class="btn pri sm" data-act="bkexport">导出备份</button>'
    +'<button class="btn ghost sm" data-act="bkimport">导入备份</button></div>'
    +'<label class="bkchk"><input type="checkbox" id="bkKey">'
    +'<span>备份里包含 API 密钥（换设备才勾；分享文件前请取消）</span></label>'
    +'<textarea id="bkText" class="bktext" placeholder="导入：把备份文件里的内容粘贴到这里（也可以直接选择文件）"'
    +' spellcheck="false"></textarea>'
    +'<div class="row-btns" style="margin-top:8px">'
    +'<button class="btn ghost sm" data-act="bkfile">选择备份文件</button>'
    +'<button class="btn pri sm" data-act="bkdo">确认导入</button></div>'
    +'<input type="file" id="bkFile" accept=".json,application/json" style="display:none">'
    +(AI.bkMsg?'<div class="bkok">'+esc(AI.bkMsg)+'</div>':'')
    +'</div></div>';
  h+='<div class="hint" style="margin-top:12px;font-size:11.5px;color:#9aa4b2;line-height:1.7;padding:0 4px">'
    +'用法：答完一题 → 点「AI 解析本题」；或直接在解析里长按选中一段文字，点「解析选中文字」，结果会作为笔记追加到当前题下方。</div>';
  h+='</div>';
  /* 文件选择器要在 HTML 插入之后再绑事件：
     让用户可以直接选 .json 文件，不必手动打开文件复制内容
     （手机上复制一个几千行的 json 很不现实）。 */
  setTimeout(function(){
    const f=document.getElementById('bkFile');
    if(f&&!f.__bound){
      f.__bound=true;
      f.addEventListener('change',function(){
        const file=f.files&&f.files[0];
        if(!file)return;
        const fr=new FileReader();
        fr.onload=function(){
          const ta=document.getElementById('bkText');
          const r=backupImport(String(fr.result||''));
          if(r.indexOf('ok:')===0){
            const p=r.slice(3).split('|');
            toast('导入成功：'+p[1]+' 条解析、'+p[2]+' 条笔记');
            AI.bkMsg='已从文件「'+file.name+'」导入 '+p[1]+' 条解析、'+p[2]+' 条笔记';
            render(true);
          }else{
            /* 文件读进来了但内容不对：回填到文本框，用户能看见问题出在哪 */
            if(ta)ta.value=String(fr.result||'').slice(0,200000);
            toast(r);
            AI.bkMsg='导入失败：'+r;
            render(true);
          }
        };
        fr.onerror=function(){toast('读取文件失败，请改用手动粘贴');};
        fr.readAsText(file);
      });
    }
  },0);
  return h;
}

/* ---------- 事件 ---------- */
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='start')startGroup(el.dataset.g);
  else if(a==='home'){S.view='home';render();}          /* 返回首页保留搜索词 */
  else if(a==='exresult'){E.view='result';S.view='exam';render();}
  else if(a==='wrong'){S.view='wrong';render();}
  else if(a==='card'){S.view='card';render();}
  else if(a==='backpractice'){S.view='practice';render();}
  else if(a==='goto'){S.view='practice';gotoIdx(parseInt(el.dataset.i,10));}
  else if(a==='opt')pick(el.dataset.v);
  else if(a==='submit')judge();
  else if(a==='next')move(1);
  else if(a==='prev')move(-1);
  else if(a==='rand')randJump();
  else if(a==='redo')redo();
  else if(a==='openq')openOne(el.dataset.k,el.dataset.back||'home');
  else if(a==='practicewrong')practiceWrong();
  else if(a==='rmwrong')rmWrong(el.dataset.k);
  else if(a==='ai'){S.view='ai';render();}
  else if(a==='aianalyze'){const t=document.getElementById('ntext');if(t)niText[S.list[S.idx]]=t.value;runAnalyze(D[S.list[S.idx]].k);}
  else if(a==='aisavenote')saveAiAsNote(D[S.list[S.idx]].k);
  else if(a==='airefresh')runAnalyze(D[S.list[S.idx]].k,true);   /* true = 忽略缓存强算 */
  else if(a==='cacheclear')ask('确定清空全部 AI 解析缓存吗？\n题本与笔记不受影响，只是下次解析要重新请求。',function(){
    aiCache={};saveCache();toast('缓存已清空');render(true);
  });
  else if(a==='bkexport'){const c=document.getElementById('bkKey');backupExport(c?!!c.checked:false);}
  else if(a==='bkimport'){const ta=document.getElementById('bkText');if(ta)ta.focus();toast('请把备份内容粘贴到下方文本框，或点「选择备份文件」');}
  else if(a==='bkfile'){const f=document.getElementById('bkFile');if(f)f.click();}
  else if(a==='bkdo'){
    const ta=document.getElementById('bkText');
    const v=ta?ta.value.trim():'';
    if(!v){toast('请先粘贴备份内容，或点「选择备份文件」');return;}
    const r=backupImport(v);
    if(r.indexOf('ok:')===0){
      const p=r.slice(3).split('|');
      toast('导入成功：'+p[1]+' 条解析、'+p[2]+' 条笔记');
      AI.bkMsg='已导入 '+p[1]+' 条解析、'+p[2]+' 条笔记，页面已是最新数据';
      render(true);
    }else{toast(r);}
  }
  else if(a==='aisel')selTextNow();
  else if(a==='nadd'){const id=S.list[S.idx];const t=document.getElementById('ntext');const v=t?t.value:'';
    if(addNote(D[id].k,v,'user')){niText[id]='';render(true);toast('已添加笔记');}}
  else if(a==='nedit'){noteEdit=el.dataset.id;render(true);}
  else if(a==='ncancel'){noteEdit=null;render(true);}
  else if(a==='nsave'){const ta=document.getElementById('nedit');
    if(ta){const list=notesOf(D[S.list[S.idx]].k);const n=list.find(function(x){return x.id===el.dataset.id;});
      if(n){const v=ta.value.trim();if(!v){toast('内容不能为空');return;}n.t=v;saveNotes();}}
    noteEdit=null;render(true);toast('已保存');}
  else if(a==='ndel'){if(noteEdit===el.dataset.id)noteEdit=null;delNote(D[S.list[S.idx]].k,el.dataset.id);}
  else if(a==='ncopy'){const n=notesOf(D[S.list[S.idx]].k).find(function(x){return x.id===el.dataset.id;});
    if(n)copyText(n.t,'已复制笔记');}
  else if(a==='ncopynote'){const l=notesOf(D[S.list[S.idx]].k);
    if(l.length)copyText(l.map(function(n){return '【'+(n.src==='ai'?'AI解析':'笔记')+' '+timeStr(n.time)+'】\n'+n.t;}).join('\n\n'),'已复制全部笔记');}
  else if(a==='aifast'){
    /* 快速模式：关思考 + 用精简提示词。为速度牺牲一点深度，随时可切回 */
    aiCfg.fast=!aiCfg.fast;
    saveCfg();
    AI.state='idle';AI.text='';AI.err='';
    render(true);
    toast(aiCfg.fast?'快速模式已开：不思考但讲得完整，约 3～5 秒':'快速模式已关：恢复完整思考');
  }
  else if(a==='aieffort'){
    /* 单题临时切思考强度：只改当前会话的 aiCfg.effort，不写盘，避免影响全局默认 */
    aiCfg.effort=el.dataset.eff||'high';
    AI.state='idle';AI.text='';AI.err='';   /* 换强度后旧结果作废，强制重新解析 */
    render(true);toast('思考强度：'+aiCfg.effort);
  }
  else if(a==='aisave'){const gi=function(id){const x=document.getElementById(id);return x?x.value.trim():'';};
    aiCfg.key=gi('aiKey');aiCfg.model=gi('aiModel')||'deepseek-flash';aiCfg.base=gi('aiBase')||'https://api.deepseek.com';
    aiCfg.think=gi('aiThink')||'enabled';aiCfg.effort=gi('aiEffort')||'high';
    saveCfg();const st=document.getElementById('aiStatus');
    if(st){st.className='selstatus ok';st.textContent='已保存：'+aiCfg.model+'（思考模式'+(aiCfg.think==='enabled'?'开启 · '+aiCfg.effort:'关闭')+'）'+(aiCfg.key?'':'，但密钥为空，AI 功能已关闭');}
    toast('设置已保存');}
  else if(a==='showkey'){const k=document.getElementById('aiKey');
    if(k){const show=k.type==='password';k.type=show?'text':'password';el.textContent=show?'隐藏':'显示';}}
  else if(a==='aitest'){aiTest();}
  else if(a==='reset')ask('确定清空所有答题进度和错题本吗？\n此操作不可恢复。',doReset,true);
  /* ---------- 考试模式 ---------- */
  else if(a==='examentry'){E.view='setup';S.view='examsetup';render();}
  else if(a==='exstart'||a==='exstart2'){
    const sel=document.getElementById('exLimit');
    let ms=EXAM_LIMIT;
    if(sel&&sel.value)ms=parseInt(sel.value,10)||0;
    /* 不限时用 0 表示；给一个足够大的内部上限避免负数判断出错 */
    startExam(ms>0?ms:Number.MAX_SAFE_INTEGER);
  }
  else if(a==='exquit')examQuit();
  else if(a==='exsubmit'){
    if(E.view!=='paper')return;
    let answered=0,blank=0;
    for(let i=0;i<E.list.length;i++){const x=E.ans[i];if(x&&x.length)answered++;else blank++;}
    ask('已答 '+answered+' 题，未答 '+blank+' 题。\n交卷后不能修改，确定交卷吗？',function(){examSubmit(false);});
  }
  else if(a==='eopt')epick(el.dataset.v);
  else if(a==='enext')emove(1);
  else if(a==='eprev')emove(-1);
  else if(a==='excard'){E.view=(E.view==='paper2')?'paper2':'card';render();}
  else if(a==='exbackpaper'){E.view=(E.result)?'paper2':'paper';render();}
  else if(a==='egoto'){
    const i=parseInt(el.dataset.i,10);
    if(E.view==='card')E.view=(E.result)?'paper2':'paper';
    egoto(i);
  }
  else if(a==='exjump'){
    const total=E.list.length;
    const v=window.prompt('跳到第几题？（1 - '+total+'）',''+(E.idx+1));
    if(v===null)return;
    const n=parseInt(v,10);
    if(!n||n<1||n>total){toast('请输入 1 到 '+total+' 之间的题号');return;}
    egoto(n-1);
  }
  else if(a==='exreview'){E.view='paper2';egoto(0);}
  else if(a==='exwrong'){
    /* 交卷时答错的题已逐题写入错题本，这里只挑「本次考试」的错题组成一份临时卷，
       比把用户丢进整个错题本更聚焦。 */
    const mine=[];
    E.list.forEach(function(qi,i){
      const q=D[qi],x=E.ans[i];
      if(!x||!x.length)return;
      const corr=q.a.split('').slice().sort(),sel=x.slice().sort();
      if(!(sel.length===corr.length&&sel.every(function(v,k){return v===corr[k];})))mine.push(qi);
    });
    if(!mine.length){toast('本次考试没有错题');return;}
    S.view='practice';S.from='exam';S.back='exresult';S.group=null;
    S.list=mine;S.title='考试错题（'+mine.length+'）';S.ans={};
    gotoIdx(0);
  }
  else if(a==='exhistclear')ask('确定清空全部考试记录吗？\n错题本与练习进度不受影响。',function(){
    examHist=[];LS.set(EXAM_KEY,examHist);toast('考试记录已清空');render();
  },true);
  else if(a==='askno')askClose();
  else if(a==='askyes'){const f=askFn;askClose();if(f){try{f();}catch(e){toast('操作失败');}}}
});
/* ---------- 左右滑动切题（左滑下一题 / 右滑上一题） ---------- */
(function(){
  let sx=0,sy=0,st=0,on=false;
  document.addEventListener('touchstart',function(e){
    const examNow=(S.view==='exam'&&(E.view==='paper'||E.view==='paper2'));
    if((S.view!=='practice'&&!examNow)||e.touches.length!==1){on=false;return;}
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();on=true;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!on)return;on=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Date.now()-st>900)return;                        /* 长按不当作滑动 */
    if(Math.abs(dx)<55)return;                          /* 位移太小视为点击 */
    if(Math.abs(dx)<Math.abs(dy)*1.5)return;            /* 竖向滚动不切题 */
    if(S.view==='exam')emove(dx<0?1:-1);else move(dx<0?1:-1);
  },{passive:true});
})();
document.addEventListener('keydown',function(e){
  /* 考试模式优先接管键盘：A/B/C/D 或 1/2/3/4 选项，方向键翻页 */
  if(S.view==='exam'&&(E.view==='paper'||E.view==='paper2')){
    if(E.view==='paper2'){                      /* 回顾态：只允许翻页 */
      if(e.key==='ArrowRight')emove(1);
      else if(e.key==='ArrowLeft')emove(-1);
      return;
    }
    const q=D[E.list[E.idx]];
    const k=(e.key||'').toUpperCase();
    if(q.ty==='judge'){
      /* 判断题：1/Y=对，2/N=错；方向键翻页 */
      if(k==='1'||k==='Y')epick('对');
      else if(k==='2'||k==='N')epick('错');
      else if(e.key==='ArrowRight')emove(1);
      else if(e.key==='ArrowLeft')emove(-1);
    }else{
      const map={A:'A',B:'B',C:'C',D:'D',1:'A',2:'B',3:'C',4:'D'};
      if(map[k])epick(map[k]);
      else if(e.key==='ArrowRight')emove(1);
      else if(e.key==='ArrowLeft')emove(-1);
    }
    return;
  }
  if(S.view!=='practice')return;
  const q=D[S.list[S.idx]];
  if(!S.done){
    const k=(e.key||'').toUpperCase();
    if(q.ty==='judge'){
      if(k==='1'||k==='Y')pick('对');
      else if(k==='2'||k==='N')pick('错');
    }else{
      const map={A:'A',B:'B',C:'C',D:'D',1:'A',2:'B',3:'C',4:'D'};
      if(map[k])pick(map[k]);
      if(e.key==='Enter'&&q.ty==='multiple')judge();
    }
  }else{
    if(e.key==='ArrowRight'||e.key==='Enter')move(1);
    else if(e.key==='ArrowLeft')move(-1);
  }
});
render();
</script>
